<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="老良人价 标记">
  <!-- 横梁：8° 定角，笔画较细（横细） -->
  <path d="M33 72 L207 96" fill="none" stroke="#1A1A1E" stroke-width="13" stroke-linecap="round"/>
  <!-- 撇捺：微曲，呼应「人」的书法笔意（竖粗） -->
  <path d="M120 84 Q110 142 64 190" fill="none" stroke="#1A1A1E" stroke-width="18" stroke-linecap="round"/>
  <path d="M120 84 Q130 142 176 190" fill="none" stroke="#1A1A1E" stroke-width="18" stroke-linecap="round"/>
  <!-- 支点：朱砂，唯一的色彩记忆点 -->
  <circle cx="120" cy="84" r="13" fill="#C93A2B"/>
</svg>
