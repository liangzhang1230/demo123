<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>销冠算账器 v3.3 · 经营真相层</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🧮</text></svg>" />
<style>
/* ============================================================================
   销冠算账器 v3.3 · 设计语言
   借鉴：Stripe/Ramp/Mercury（暖中性浅底、单一发丝线、去饱和状态色）、
        Linear（FLIP 排名翻转、克制的微交互）、Metabase/Looker（英雄数 + 证据 + 出处，
        缺失显 — 而非 0）、Gong/Clari（判定+凭据）。全部手写 CSS，无框架无 CDN。
   ==========================================================================*/
:root{
  --bg:#FAFAFA; --card:#FFFFFF; --panel:#F6F7F9; --panel2:#F1F3F5;
  --ink:#1A1A1A; --ink2:#5C6470; --ink3:#8A909A; --ink4:#C4C8CE;
  --line:#E6E8EB; --line2:#EEF0F2;
  --green:#137333; --green-bg:#E6F4EA;
  --amber:#B25E09; --amber-bg:#FEF3E2;
  --red:#B3261E; --red-bg:#FCE8E6; --red-hero:#D93025;
  --blue:#1A56DB; --blue-bg:#EAF1FE;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-lift:0 4px 16px rgba(16,24,40,.08);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cnum" 1;}
.num{font-feature-settings:"tnum" 1,"cnum" 1;font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue);text-decoration:none}
::selection{background:#DCE6FB}

/* ---- 布局：左固定导航 + 右内容 ---- */
#app{display:flex;min-height:100vh}
#nav{width:236px;flex:0 0 236px;background:var(--card);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 0}
.brand{padding:0 22px 18px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.brand .logo{font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.brand .mode{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;
  text-transform:uppercase;letter-spacing:.05em}
.mode.full{background:var(--green-bg);color:var(--green)}
.mode.free{background:var(--amber-bg);color:var(--amber)}
.navlist{flex:1;overflow-y:auto;padding:4px 12px}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--ink2);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:1px;user-select:none;position:relative}
.navitem:hover{background:var(--panel)}
.navitem.active{background:var(--panel2);color:var(--ink);font-weight:600}
.navitem.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--ink);border-radius:0 3px 3px 0}
.navitem .n{font-size:11px;color:var(--ink4);width:16px;text-align:center;font-weight:700}
.navitem.locked{opacity:.5}
.navitem .lockicon{margin-left:auto;font-size:11px;color:var(--ink4)}
.nav-foot{padding:12px 22px 0;border-top:1px solid var(--line2);margin-top:8px;font-size:11px;color:var(--ink3)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:52px;flex:0 0 52px;border-bottom:1px solid var(--line);background:rgba(250,250,250,.85);
  backdrop-filter:saturate(180%) blur(8px);display:flex;align-items:center;gap:14px;padding:0 32px;position:sticky;top:0;z-index:30}
#topbar .sig{font-size:12px;color:var(--ink3)}
#topbar .sig b{color:var(--ink2);font-weight:600}
#topbar .spacer{flex:1}
#topbar .pill{font-size:11.5px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);
  padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:6px}
#content{flex:1;padding:32px 40px 80px;max-width:1180px;width:100%}
.screen{display:none;animation:fade .35s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- 通用组件 ---- */
.page-h{margin-bottom:8px}
.page-h h1{font-size:22px;font-weight:700;letter-spacing:-.015em}
.page-h .lede{color:var(--ink2);font-size:14px;margin-top:4px;max-width:70ch}
.section-gap{height:28px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g2,.g3,.g4{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow:hidden}
.card .label{font-size:11.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.045em}
.hero-num{font-size:52px;font-weight:700;letter-spacing:-.025em;line-height:1;margin:8px 0 6px}
.hero-num.red{color:var(--red-hero)} .hero-num.green{color:var(--green)}
.metric-num{font-size:28px;font-weight:600;letter-spacing:-.01em}
.unit{font-size:.6em;color:var(--ink3);font-weight:600;margin-left:1px}
.delta{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:5px;margin-top:2px}
.delta .basis{color:var(--ink3)}
.dash{color:var(--ink4)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;line-height:1.5}
.chip.g{background:var(--green-bg);color:var(--green)} .chip.a{background:var(--amber-bg);color:var(--amber)}
.chip.r{background:var(--red-bg);color:var(--red)} .chip.b{background:var(--blue-bg);color:var(--blue)}
.chip.n{background:var(--panel2);color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.dot.g{background:var(--green)} .dot.a{background:var(--amber)} .dot.r{background:var(--red-hero)} .dot.n{background:var(--ink4)}

.src{font-size:12px;color:var(--ink3);margin-top:8px;display:flex;align-items:flex-start;gap:5px;line-height:1.5}
.src .pin{flex:0 0 auto}
.asof{font-size:11.5px;color:var(--ink3);font-weight:400}
.asof.stale{color:var(--amber)}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
  padding:10px 14px;border-bottom:1px solid var(--line)}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);color:var(--ink)}
table.tbl tr:last-child td{border-bottom:none}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl tr.hoverable:hover{background:var(--panel)}
.rowmove{transition:transform .55s cubic-bezier(.2,0,0,1),background .3s}

.btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:8px 15px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.12s}
.btn:hover{background:var(--panel);border-color:#D5D9DE}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn.ghost:hover{background:var(--blue-bg)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* action_card：系统永不自动执行，一切走建议卡 */
.action-card{border:1px solid var(--line);border-left:3px solid var(--ink);background:var(--panel);
  border-radius:var(--radius-sm);padding:14px 16px;margin-top:14px}
.action-card.r{border-left-color:var(--red-hero)} .action-card.a{border-left-color:var(--amber)}
.action-card.b{border-left-color:var(--blue)} .action-card.g{border-left-color:var(--green)}
.action-card .ac-h{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:5px}
.action-card .ac-body{font-size:13px;color:var(--ink2);line-height:1.6}

/* 手风琴（证据展开） */
.acc{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;background:var(--card)}
.acc-h{display:flex;align-items:center;gap:11px;padding:14px 18px;cursor:pointer;user-select:none}
.acc-h:hover{background:var(--panel)}
.acc-h .chev{margin-left:auto;color:var(--ink3);transition:transform .2s;font-size:12px}
.acc.open .chev{transform:rotate(90deg)}
.acc-b{max-height:0;overflow:hidden;transition:max-height .28s ease}
.acc.open .acc-b{max-height:1600px}
.acc-b-inner{padding:2px 18px 18px;border-top:1px solid var(--line2)}
.acc-title{font-weight:600;font-size:14px}
.acc-meta{font-size:12px;color:var(--ink3)}

.stat-strip{display:flex;flex-wrap:wrap;gap:22px;margin:12px 0}
.stat-strip .st{min-width:90px}
.stat-strip .st .k{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stat-strip .st .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stat-strip .st .v small{font-size:11.5px;color:var(--ink3);font-weight:400}

.banner{border-radius:var(--radius-sm);padding:11px 16px;font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.banner.warn{background:var(--amber-bg);color:#7a4506;border:1px solid #F5D9A8}
.banner.warn .btn{margin-left:auto}
.callout{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;font-size:13px;color:var(--ink2);line-height:1.65}
.callout .q{font-weight:600;color:var(--ink)}
.fixed-note{font-size:12.5px;color:var(--ink3);font-style:normal;background:var(--panel);border:1px dashed var(--line);
  border-radius:var(--radius-sm);padding:12px 14px;line-height:1.65;margin-top:12px}

.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink2)} .kv .v{font-variant-numeric:tabular-nums;font-weight:600}
.kv.total{border-top:2px solid var(--ink);margin-top:4px;padding-top:12px}
.kv.total .k,.kv.total .v{font-weight:700;font-size:15px}
.kv .v.neg{color:var(--red)}

.lock-hero{text-align:center;padding:48px 24px;max-width:640px;margin:0 auto}
.lock-hero .ic{font-size:40px}
.lock-hero h2{font-size:24px;font-weight:700;margin:14px 0 8px}
.lock-hero p{color:var(--ink2);font-size:14.5px;line-height:1.7}

/* 徽章网格（自检） */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;font-size:12px;display:flex;align-items:center;gap:8px;background:var(--card)}
.badge.ok{border-color:#BFE3C9;background:#F3FBF5}
.badge.no{border-color:#F0C3BF;background:#FEF5F4}
.badge .bi{font-weight:700}
.badge.ok .bi{color:var(--green)} .badge.no .bi{color:var(--red-hero)}
.badge .bid{font-weight:700;font-variant-numeric:tabular-nums}
.badge .bd{color:var(--ink3);font-size:11px}

.big-badge{display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border-radius:var(--radius);font-weight:700;font-size:22px}
.big-badge.ok{background:var(--green-bg);color:var(--green)}
.big-badge.no{background:var(--red-bg);color:var(--red)}

input,select{font-family:inherit;font-size:13.5px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--card);color:var(--ink);width:100%}
input:focus,select:focus{outline:none;border-color:var(--ink3);box-shadow:0 0 0 3px rgba(138,144,154,.12)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--ink3);margin-top:4px}
.coef-row{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.coef-row .cn{font-size:13px} .coef-row .cd{font-size:11.5px;color:var(--ink3)}

.tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--panel2);color:var(--ink2);letter-spacing:.02em}
.tag.new{background:var(--blue-bg);color:var(--blue)}
.muted{color:var(--ink3)}
.hr{height:1px;background:var(--line);margin:22px 0;border:none}
.small{font-size:12px;color:var(--ink3)}
.pin{color:var(--ink3)}

/* 打印（《经营真相报告》A4） */
@media print{
  #nav,#topbar,.no-print{display:none!important}
  #content{padding:0;max-width:none}
  .screen{display:block!important;page-break-after:always}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ccc}
  .print-foot{display:block!important}
}
.print-foot{display:none;font-size:11px;color:#888;margin-top:20px;border-top:1px solid #ddd;padding-top:8px}

/* 授-2 免费版：钩子/英雄数可见，明细锁（.locked）；导出与数据页永不锁 */
body.free-mode #content .acc,
body.free-mode #content table.tbl,
body.free-mode #content .action-card:not(.free-ok){filter:blur(4.5px);opacity:.5;pointer-events:none;user-select:none;transition:filter .2s}
.free-banner{background:var(--amber-bg);color:#7a4506;border:1px solid #F5D9A8;border-radius:var(--radius-sm);
  padding:10px 15px;font-size:12.5px;display:flex;align-items:center;gap:9px;margin-bottom:16px}
.free-banner .btn{margin-left:auto}
</style>
</head>
<body>
<div id="app">
  <aside id="nav">
    <div class="brand">
      <div class="logo">🧮 销冠算账器</div>
      <div class="sub">经营真相层 · v3.3</div>
      <div class="mode full" id="modeBadge">FULL</div>
    </div>
    <div class="navlist" id="navlist"></div>
    <div class="nav-foot">
      单文件 · 无后端 · 无网络<br/>数据只在你电脑
    </div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div class="sig">授权：<b id="tenantName">演示客户</b></div>
      <div class="spacer"></div>
      <div class="pill" id="todayPill">📅 今天 2026-07-13</div>
      <div class="pill no-print" id="lockPill" style="cursor:pointer">🔓 M21 已归一化</div>
    </div>
    <main id="content"></main>
  </div>
</div>

<!-- ====================== 计算引擎（离线 35 断言全绿·逐字内联） ====================== -->
<script>
/* 销冠算账器 v3.3 计算引擎 —— 唯一权威口径：公约§4/§5 + 3号件三。
   时钟注入（C-14）：含日期函数 today 显式传参，永不 new Date()。 */
(function (root) {
  'use strict';
  var SK = {};
  function safeDiv(a, b){ return (b===0||b==null||a==null)?null:a/b; } SK.safeDiv=safeDiv;
  var COEFFICIENTS = {
    socialCostRate:0.30, imbalanceGlobal:0.56, redrawGainBand:[0.02,0.07], envelopeStaleDays:90,
    ahcTrustLine:60, minSampleDefault:5, p90ColdFactor:1.8,
    territoryBand:[0.90,1.10], selfDevBonusFactor:0.5, discountLeakRedline:0.06, pushShareRedline:0.40,
    scissorsAlert:0.30, uerMinObs:48, propertyMinEach:{people:4,months:6}, dviMinDeals:10,
    categoryFuseMarginRate:0.22, categoryFuseShareRate:0.20, winRateCeiling:0.20, refundConcentrationX:3,
    forcedDiscount:{rate:0.15,share:0.60}, leaverCategoryX:1.5, stopBleedDays:30, territoryStarveIdx:0.7,
    dataGapWarn:0.10, personLeakX:1.5, p90MinSample:8, p90Method:'R7',
    m34TailShare:1/3, m34BunchBand:0.10, m34DiffRedline:0.02, m34BunchRedline:1.5,
    m35RankJumpShare:0.30, m36Band:0.15, m36Redline:0.40, m36MinManDays:30,
    hongbaoDailyX:2, hongbaoRepeatN:3, scissorsBunchBand:0.15, threeYearScaleFactor:1.18
  };
  SK.COEFFICIENTS=COEFFICIENTS;
  function getCoef(k){ return COEFFICIENTS[k]; } SK.getCoef=getCoef;
  function round(x){ return Math.round(x); } SK.round=round;

  function commission(paymentAmt,g,r){ if(paymentAmt==null||g==null||r==null)return null; return round(paymentAmt*g*r); }
  SK.commission=commission;
  var BONUS_TYPES=['instant_bonus','year_end_bonus','dividend','mentoring_share','recipe_royalty','sprint_vested','discretionary'];
  SK.BONUS_TYPES=BONUS_TYPES;
  function totalIncome(ctx){ var b=ctx.baseSalaryAmt||0,c=ctx.commissionAmt||0,bo=0;
    (ctx.payouts||[]).forEach(function(p){ if(BONUS_TYPES.indexOf(p.type)>=0)bo+=(p.amount||0); }); return b+c+bo; }
  SK.totalIncome=totalIncome;
  function laborCost(ctx){ var b=ctx.baseSalaryAmt||0,
    s=round(b*(ctx.socialCostRate!=null?ctx.socialCostRate:getCoef('socialCostRate'))),c=ctx.commissionAmt||0,p=0;
    (ctx.payouts||[]).forEach(function(x){ p+=(x.amount||0); }); return b+s+c+p; }
  SK.laborCost=laborCost;
  function netContribution(s){ return (s.grossMarginAmt||0)-(s.laborCostAmt||0)-(s.opCostAmt||0)-(s.refundMarginAmt||0)-(s.discountMarginAmt||0); }
  SK.netContribution=netContribution;
  function leverageChain(c){ return (c.leads||0)*(c.convRate||0)*(c.aov||0)*(c.marginRate||0)-(c.laborCostAmt||0); }
  SK.leverageChain=leverageChain;

  var rampCurve12={ short:[0,12,25,42,60,73,85,93,100,100,100,100], regular:[0,5,12,22,35,48,60,72,82,90,96,100],
    midLong:[0,0,5,12,20,30,42,53,63,72,80,87], long:[0,0,0,5,10,18,27,36,45,54,62,70], ultraLong:[0,0,0,0,5,10,16,23,30,37,44,50] };
  SK.rampCurve12=rampCurve12;
  function newHireYearRate(cycle,m){ var a=rampCurve12[cycle]; if(!a)return null; var u=13-m,s=0; for(var i=1;i<=u;i++)s+=(a[i]||0); return s/12/100; }
  SK.newHireYearRate=newHireYearRate;

  function m21Normalize(people){
    var n=people.length; if(n===0)return{done:false,rows:[],imbalanceRate:null};
    var totalLeads=people.reduce(function(a,p){return a+(p.leads||0);},0);
    var totalMargin=people.reduce(function(a,p){return a+(p.grossMarginAmt||0);},0);
    var perCapitaLeads=safeDiv(totalLeads,n); var band=getCoef('territoryBand');
    var rows=people.map(function(p){
      var index=safeDiv(p.leads,perCapitaLeads);
      var over=index!=null&&index>band[1], under=index!=null&&index<band[0];
      var unit=safeDiv(p.grossMarginAmt,p.leads);
      var nb=(unit==null||perCapitaLeads==null)?null:unit*perCapitaLeads;
      var ss=safeDiv(p.selfDevLeads||0,p.leads); var sf=1+(ss||0)*getCoef('selfDevBonusFactor');
      var nm=nb==null?null:nb*sf;
      return{id:p.id,name:p.name,leads:p.leads,grossMarginAmt:p.grossMarginAmt,selfDevLeads:p.selfDevLeads||0,
        index:index,over:over,under:under,unitLeadMargin:unit,normMargin:nm,selfFactor:sf};
    });
    var bo=rows.slice().sort(function(a,b){return (b.grossMarginAmt||0)-(a.grossMarginAmt||0);});
    bo.forEach(function(r,i){r.origRank=i+1;});
    var bn=rows.slice().sort(function(a,b){var av=a.normMargin==null?-Infinity:a.normMargin,bv=b.normMargin==null?-Infinity:b.normMargin;return bv-av;});
    bn.forEach(function(r,i){r.normRank=i+1;});
    var ic=rows.filter(function(r){return r.over||r.under;}).length;
    return{done:true,rows:rows,n:n,totalLeads:totalLeads,totalMargin:totalMargin,perCapitaLeads:perCapitaLeads,
      imbalanceRate:safeDiv(ic,n),imbalCount:ic,redrawBand:[totalMargin*getCoef('redrawGainBand')[0],totalMargin*getCoef('redrawGainBand')[1]]};
  }
  SK.m21Normalize=m21Normalize;

function gatesList() {
  var g5 = f.gateDiscountLeak(DISCOUNTS);

  var m28cov = 0, inService = M21.n;
  var gates = [];
  gates.push(acc('gate5', '⑤ 折扣泄漏', chipFor(g5.leakRed || g5.pushRed), gate5Body(g5)));
  gates.push(acc('gate9', '⑨ 品类泄漏熔断', chipFor(true), gate9Body()));
  gates.push(acc('gate11', '⑪ 敲竹杠（三证据链）', chipFor(true), gate11Body(hj, m28cov, inService)));
  gates.push(acc('gate6', '⑥ 提拔预测 M23（八维度）', '<span class="chip n">展开</span>', gate6Body()));
  gates.push(acc('gate7', '⑦ 剪刀差', '<span class="chip n">展开</span>', gate7Body()));
  gates.push(acc('gate3', '③ 报销永不进收入', '<span class="chip g">铁律</span>',
    '<div class="ac-body">报销（reimburse）只进 laborCost 成本侧，永不计入 totalIncome 收入侧。这条写进宪法函数，代码层不可绕过。</div>'));

function buildOwnEnvelope() {
  var derived = {
    realP90Factor: f.realP90Factor([5, 6, 7, 8, 9, 10, 11, 12, 14, 18]),
    dvi: Math.round(f.dvi({ reportRate: 0.85, medianEntryLagDays: 3, leadAttribRate: 0.34, discountRecordRate: 0.40, dealCount: 100 })),
    imbalanceRate: M21.imbalanceRate,
    uerTeamMean: UER_MEAN
  };
  return f.buildEnvelope(APP.today, derived, { Deal: [], Category: [], ProcessBaseline: [] }, 'demo-hash');
}

function coefCard() {
  var keys = ['socialCostRate', 'discountLeakRedline', 'pushShareRedline', 'ahcTrustLine', 'personLeakX', 'envelopeStaleDays', 'm36Redline', 'p90MinSample'];
  var rows = keys.map(function (k) {
    return '<div class="coef-row"><div><div class="cn">' + k + '</div></div>' +
      '<input class="num" data-coef="' + k + '" value="' + f.getCoef(k) + '"/></div>';
  }).join('');
  return '<div class="card"><div class="label">COEFFICIENTS 金框（数值权归老板 · 三权分立）</div>' +
    '<div style="margin-top:10px">' + rows + '</div>' +
    '<div class="fixed-note">权威源：跨板块系数以《0号公约》§5 为准；本板块专属以件二增补为准。' +
    'ahcTrustLine / envelopeStaleDays 等双侧系数改动须两侧同步（R-04）。</div></div>';
}

/* ---- 自检：22 条对拍（浏览器内跑同一引擎）---- */
function runSelfTest() {
  var approx = function (a, b, e) { return a != null && Math.abs(a - b) <= (e || 1e-6); };
  var A = row('A'), J = row('J');
  var T = [];
  function t(id, desc, ok) { T.push({ id: id, desc: desc, ok: !!ok }); }

  var payment = 200e6, mr = 0.5, r = 0.2706, gm = payment * mr;
  t('T1', '提成占毛利27.06%', approx(+((f.commission(payment, mr, r) / gm) * 100).toFixed(2), 27.06));
  var net = f.netContribution(NETSCENE);
  t('T2', '净贡献¥291,330（29.1%）', f.fmtYuan(net) === '¥291,330' && f.fmtPct(net / NETSCENE.grossMarginAmt) === '29.1%');
  t('T3', 'labor_roi=2.14', approx(+(NETSCENE.grossMarginAmt / NETSCENE.laborCostAmt).toFixed(2), 2.14));
  t('T4', '失衡率70%', f.fmtPct(M21.imbalanceRate) === '70.0%');
  t('T5', 'rank(J)=1', J.normRank === 1);
  t('T6', 'rank(A)=8（原始#1）', A.normRank === 8 && A.origRank === 1 && J.origRank === 10);
  t('T7', 'DVI=54🟡', Math.round(f.dvi({ reportRate: .85, medianEntryLagDays: 3, leadAttribRate: .34, discountRecordRate: .40, dealCount: 100 })) === 54);
  t('T8', 'A 的 UER=−1.5万🔴', f.fmtWan(UER.A) === '-1.5 万' && f.uerBand(UER.A, UER_SIGMA) === 'red');
  var la = f.personAttribution({ discountLeakRate: .11, teamDiscountLeakRate: .05, complaintRate: .03, teamComplaintRate: .03, leadIndex: 1.8 });
  var te = f.personAttribution({ discountLeakRate: .04, teamDiscountLeakRate: .05, complaintRate: .02, teamComplaintRate: .03, leadIndex: .3 });
  var un = f.personAttribution({ discountLeakRate: .05, teamDiscountLeakRate: .05, complaintRate: .03, teamComplaintRate: .03, leadIndex: 1.0 });
  t('T8b', '3.3b 三分支 leak/territory/undetermined', la.verdict === 'leak' && te.verdict === 'territory' && un.verdict === 'undetermined');
  t('T9', 'J 的 UER=+0.9万🟢；均值−0.4万', f.fmtWan(UER.J) === '0.9 万' && f.uerBand(UER.J, UER_SIGMA) === 'green' && f.fmtWan(UER_MEAN) === '-0.4 万');
  t('T10', '观测<48→UER=null', f.uerObsGate(40) === false && f.uerObsGate(48) === true);
  t('T11', '剪刀差摊薄：年终奖12万÷12', f.amortizeForScissors('year_end_bonus', 12e6, 1) === 1e6);
  var g5 = f.gateDiscountLeak(DISCOUNTS);
  t('T12', '闸⑤ 泄漏7.2%红/期末58%红', f.fmtPct(g5.leakRate) === '7.2%' && g5.leakRed && f.fmtPct(g5.pushShare) === '58.0%' && g5.pushRed);
  var m34 = f.m34ArbitrageFromRates(.087, .031, 600e6, 50e6, 2.6);
  t('T13', 'M34 差5.6pp/泄漏33.6万/聚集2.6', approx(+(m34.diff * 100).toFixed(1), 5.6) && f.fmtWan(m34.annualLeakAmt) === '33.6 万' && m34.bunchIndex === 2.6 && m34.red);
  var mis = f.m35Misfire(10, 1, 10);
  t('T14', 'M35 jump=9≥3 警报', mis.jump === 9 && mis.threshold === 3 && mis.misfire);
  var cc = []; for (var i = 0; i < 61; i++) cc.push(32); for (var k = 0; k < 39; k++) cc.push(20);
  var m36 = f.m36BunchRate(cc, 30), few = f.m36BunchRate(cc.slice(0, 20), 30);
  t('T15', 'M36 卡线率61%红；<30人天→null', f.fmtPct(m36.rate) === '61.0%' && m36.red && few.rate === null);
  var hb = f.hongbaoCheck({ amount: 20000, dailyAvgCommission: 30000, timing: 'immediate', hasCondition: false, rolling12ImmediateUncondCount: 3 });
  t('T16', '红包 rule①②触发·无扣减', hb.rule1 && hb.rule2);
  var sa = f.stopBleedTriage({ zeroEventDays: 30, isActivePaid: true, leadIndex: 0.3, uer: null });
  var sb = f.stopBleedTriage({ zeroEventDays: 30, isActivePaid: true, leadIndex: 1.0, uer: 5e5 });
  t('T17', '止血 idx0.3拦截 / UER>0提示', sa.block && sa.verdict === 'starved' && !sb.block && sb.verdict === 'invisible_work');
  var env = buildOwnEnvelope();
  t('T18', '信封 derived 四项齐全 + 导入 ExternalRef', ['realP90Factor', 'dvi', 'imbalanceRate', 'uerTeamMean'].every(function (kk) { return kk in env.derived; }) && REFS.liuren.derived.ahc === 41);
  t('T19', 'realP90Factor=1.44（R-7）；<8→null', approx(+f.realP90Factor([5, 6, 7, 8, 9, 10, 11, 12, 14, 18]).toFixed(2), 1.44) && f.realP90Factor([5, 6, 7]) === null);
  var v1 = f.hijackVerdict({ ahc: 41, m28Coverage: 0, irrevocable: false });
  var v2 = f.hijackVerdict({ ahc: 85, m28Coverage: 0.4, irrevocable: true });
  var v3 = f.hijackVerdict({ ahc: null, m28Coverage: null, irrevocable: false });
  t('T20', '闸⑪ 三分支 V-A/V-B/V-C', v1.verdict === 'pointed_hoarding' && v1.bad === 3 && v2.verdict === 'not_supported' && v2.bad === 0 && v3.verdict === 'insufficient' && v3.missingList.indexOf('AHC') >= 0);
  var d = f.staleDays(APP.today, '2026-01-10');
  t('T21', '新鲜度 staleDays=184>90；过期不改 verdict', d === 184 && f.isStale(APP.today, '2026-01-10') && v1.verdict === 'pointed_hoarding');
  return T;
}

function selfTestCard() {
  var T = runSelfTest();
  var pass = T.filter(function (x) { return x.ok; }).length, total = T.length;
  var badges = T.map(function (x) {
    return '<div class="badge ' + (x.ok ? 'ok' : 'no') + '"><span class="bi">' + (x.ok ? '✓' : '✗') + '</span>' +
      '<span class="bid">' + x.id + '</span><span class="bd">' + esc(x.desc) + '</span></div>';
  }).join('');
  return '<div class="card"><div class="label">自检徽章 · 件七 22 条对拍（浏览器内跑同一引擎）</div>' +
    '<div style="margin:14px 0"><span class="big-badge ' + (pass === total ? 'ok' : 'no') + '">' +
    (pass === total ? '✅ ' : '⚠️ ') + pass + ' / ' + total + ' 绿</span>' +
    '<span class="small" style="margin-left:14px">TEST_TODAY=2026-07-13（公约 C-14/R-11）· ' + (pass === total ? '三绿 = 收货' : '有红 = 原样发回修') + '</span></div>' +
    '<div class="badge-grid">' + badges + '</div></div>';
}

/* ============================ 通用小工具 ============================ */
function card(x, inner) { return '<div class="screen active">' + inner + '</div>'; }
function kv(k, v, neg) { return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v' + (neg ? ' neg' : '') + '">' + v + '</span></div>'; }
function acc(id, title, chip, body) {
  return '<div class="acc" id="' + id + '"><div class="acc-h" data-acc="' + id + '"><span class="acc-title">' + esc(title) + '</span>' +
    '<span style="margin-left:auto">' + chip + '</span><span class="chev">▶</span></div>' +
    '<div class="acc-b"><div class="acc-b-inner">' + body + '</div></div></div>';
}

/* ---- 事件接线 ---- */
function wire() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-acc]'), function (el) {
    el.onclick = function () { var a = document.getElementById(el.getAttribute('data-acc')); a.classList.toggle('open'); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-act]'), function (el) {
    el.onclick = function () { act(el.getAttribute('data-act'), el); };
  });
  // 数值权归老板：系数金框可改，改后全应用重算（三权分立）
  Array.prototype.forEach.call(document.querySelectorAll('[data-coef]'), function (el) {
    el.onchange = function () {
      var k = el.getAttribute('data-coef'); var v = parseFloat(el.value);
      if (!isNaN(v)) { f.COEFFICIENTS[k] = v; renderScreen(); }
    };
  });
}

function act(a, el) {
  if (a === 'start') return go('territory');
  if (a.indexOf('goto:') === 0) return go(a.split(':')[1]);
  if (a === 'goexport' || a === 'doexport') return doExport();
  if (a === 'dom21' || a === 'skipm21') { APP.m21done = true; save('m21done', true); renderNav(); return go('normalize'); }
  if (a === 'flip') return playFlip();
  if (a === 'verifyLic') return doVerify();
  if (a === 'downgrade') { APP.buildMode = 'free'; save('buildMode', 'free'); refreshChrome(); alert('已模拟到期降级为 free。授-2/4：数据一字不动、导出永不锁定。'); return renderScreen(); }
  if (a === 'ac') return toast(el, '已生成 action_card（系统永不自动执行·由你点击后才动）');
}

function toast(el, msg) {
  var old = el.textContent; el.textContent = '✓ ' + msg; el.disabled = true;
  setTimeout(function () { el.textContent = old; el.disabled = false; }, 1600);
}

function playFlip() {
  // FLIP：原始榜 → 归一榜（Linear 缓动）
  var tbody = document.querySelector('#rankTbl tbody'); if (!tbody) return;
  var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
  var first = {}; rows.forEach(function (tr) { first[tr.dataset.id] = tr.getBoundingClientRect().top; });
  rows.sort(function (a, b) {
    return (row(a.dataset.id).normRank) - (row(b.dataset.id).normRank);
  });
  rows.forEach(function (tr) { tbody.appendChild(tr); });
  rows.forEach(function (tr) {
    var last = tr.getBoundingClientRect().top; var dy = first[tr.dataset.id] - last;
    tr.style.transform = 'translateY(' + dy + 'px)'; tr.style.transition = 'none';
    requestAnimationFrame(function () { tr.style.transition = 'transform .6s cubic-bezier(.2,0,0,1)'; tr.style.transform = ''; });
  });
}

function doExport() {
  var env = buildOwnEnvelope();
  var blob = new Blob([JSON.stringify(env, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob); var a = document.createElement('a');
  a.href = url; a.download = 'skab_suanzhang_' + APP.today + '.json'; a.click();
  URL.revokeObjectURL(url);
  APP.lastExportAt = APP.today; save('lastExportAt', APP.today); renderScreen();
}

async function doVerify() {
  var inp = document.getElementById('licInput'); var msg = document.getElementById('licMsg');
  var res = await verifyLicense(inp.value.trim());
  if (!res.ok) { APP.licMsg = '🔴 验证失败：' + esc(res.why); if (msg) msg.innerHTML = APP.licMsg; return; }
  APP.tenant = res.tenant; APP.buildMode = res.mode; save('buildMode', res.mode);
  APP.licMsg = '✅ 验证通过 · 授权 <b>' + esc(res.tenant) + '</b> · 到期 ' + res.expiry + ' · 模式 ' + res.mode.toUpperCase() +
    (res.expired ? '（已过期 → 降级 free，数据与导出不受影响）' : '');
  refreshChrome(); renderScreen();
}

function refreshChrome() {
  $('#tenantName').textContent = APP.tenant;
  var mb = $('#modeBadge'); mb.textContent = APP.buildMode.toUpperCase();
  mb.className = 'mode ' + APP.buildMode;
}

/* ---- 顶栏锁 pill（演示：切换 M21 归一化状态）---- */
function wireChrome() {
  $('#todayPill').textContent = '📅 今天 ' + APP.today;
  $('#lockPill').onclick = function () {
    APP.m21done = !APP.m21done; save('m21done', APP.m21done);
    $('#lockPill').textContent = APP.m21done ? '🔓 M21 已归一化' : '🔒 M21 未归一化';
    renderNav(); renderScreen();
  };
  $('#lockPill').textContent = APP.m21done ? '🔓 M21 已归一化' : '🔒 M21 未归一化';
  refreshChrome();
}

/* ---- 启动 ---- */
APP.buildMode = load('buildMode', 'full');
wireChrome();
renderNav();
renderScreen();
window.__SK_SELFTEST__ = runSelfTest;   // 供无头验证
})();

</script>
