<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>卖家离线发码器(内部工具,严禁外传)</title>
<style>
body{font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:560px;margin:0 auto;padding:16px;background:#f5f5f2;color:#1a1c22}
.card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:16px;margin:12px 0}
input,select{width:100%;font:inherit;padding:10px;border:1px solid #d8d8d2;border-radius:9px;margin:6px 0;box-sizing:border-box}
button{font:inherit;font-weight:700;width:100%;padding:12px;border:none;border-radius:10px;background:#4f46e5;color:#fff;cursor:pointer;margin-top:6px}
.out{font-family:ui-monospace,Menlo,monospace;font-size:17px;font-weight:800;background:#eef0fe;border-radius:9px;padding:12px;text-align:center;margin-top:10px;word-break:break-all;min-height:24px}
.warn{background:#fce8e6;color:#c5221f;border-radius:9px;padding:10px 12px;font-size:13px;font-weight:650;margin:10px 0}
.hint{color:#8a8f9c;font-size:12.5px}
</style>
</head>
<body>
<h2>卖家离线发码器</h2>
<div class="warn">⚠ 本文件含产品密钥,是你的"印钞机"——只放在自己电脑,严禁发给任何人。接口挂了用它兜底,双击即用,不联网。</div>
<div class="card">
  <b>D 型码(一设备一码,正常销售用这个)</b>
  <div class="hint">买家把激活页上的设备码发你 → 粘贴到下面 → 生成 → 把激活码发回去。同一设备码永远生成同一个激活码(补码=重发同一个码)。</div>
  <select id="pd">
    <option value="HRDX-2026-a7f3e9c1b5d24f8a6e0c9b3d1f5a7c2e-K9">销售定薪器 · HR 版</option>
  </select>
  <input id="fp" placeholder="粘贴买家设备码,如 AB3F-9C21-77D0" autocomplete="off">
  <button onclick="makeD()">生成 D 型激活码</button>
  <div class="out" id="outD"></div>
</div>
<div class="card">
  <b>G 型通用码(任意设备可激活)</b>
  <div class="hint">只用于自己测试或赠送,严禁售卖——一个 G 码全网通用,卖出去等于开闸。</div>
  <button onclick="makeG()" style="background:#b25e09">生成 G 型码(想清楚再点)</button>
  <div class="out" id="outG"></div>
</div>
<script>
'use strict';
function sha256Bytes(bytes){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  function rot(v,n){return (v>>>n)|(v<<(32-n));}
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var msg=bytes.slice(), bits=bytes.length*8;
  msg.push(0x80); while(msg.length%64!==56)msg.push(0);
  msg.push(0,0,0,0,(bits>>>24)&255,(bits>>>16)&255,(bits>>>8)&255,bits&255);
  for(var i=0;i<msg.length;i+=64){
    var w=new Array(64),t;
    for(t=0;t<16;t++)w[t]=(msg[i+4*t]<<24)|(msg[i+4*t+1]<<16)|(msg[i+4*t+2]<<8)|(msg[i+4*t+3]);
    for(t=16;t<64;t++){var s0=rot(w[t-15],7)^rot(w[t-15],18)^(w[t-15]>>>3);
      var s1=rot(w[t-2],17)^rot(w[t-2],19)^(w[t-2]>>>10); w[t]=(w[t-16]+s0+w[t-7]+s1)|0;}
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(t=0;t<64;t++){var S1=rot(e,6)^rot(e,11)^rot(e,25),ch=(e&f)^(~e&g);
      var t1=(h+S1+ch+K[t]+w[t])|0;var S0=rot(a,2)^rot(a,13)^rot(a,22),maj=(a&b)^(a&c)^(b&c);
      var t2=(S0+maj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var out=[];
  for(var j=0;j<8;j++){out.push((H[j]>>>24)&255,(H[j]>>>16)&255,(H[j]>>>8)&255,H[j]&255);}
  return out;
}
function strBytes(s){var b=[],i,c;for(i=0;i<s.length;i++){c=s.charCodeAt(i);
  if(c<128)b.push(c);else if(c<2048){b.push(192|(c>>6),128|(c&63));}
  else{b.push(224|(c>>12),128|((c>>6)&63),128|(c&63));}}return b;}
function bytesHex(b){var h='',i;for(i=0;i<b.length;i++)h+=(b[i]<16?'0':'')+b[i].toString(16);return h;}
function hmac256(key,msg){
  var kb=strBytes(key);if(kb.length>64)kb=sha256Bytes(kb);
  while(kb.length<64)kb.push(0);
  var i,ip=[],op=[];
  for(i=0;i<64;i++){ip.push(kb[i]^0x36);op.push(kb[i]^0x5c);}
  var inner=sha256Bytes(ip.concat(strBytes(msg)));
  return bytesHex(sha256Bytes(op.concat(inner)));
}
function normHex(s){return String(s||'').toLowerCase().replace(/[^0-9a-f]/g,'');}
function makeD(){
  var secret=document.getElementById('pd').value;
  var fp=normHex(document.getElementById('fp').value);
  var out=document.getElementById('outD');
  if(fp.length<8){out.textContent='设备码不对,请让买家从激活页完整复制';return;}
  out.textContent='XZ-D-'+hmac256(secret,'D|'+fp).slice(0,20);
}
function makeG(){
  var secret=document.getElementById('pd').value;
  var nonce='';for(var i=0;i<8;i++)nonce+='0123456789abcdef'[Math.floor(Math.random()*16)];
  document.getElementById('outG').textContent='XZ-G-'+nonce+'-'+hmac256(secret,'G|'+nonce).slice(0,16);
}
</script>
</body>
</html>
