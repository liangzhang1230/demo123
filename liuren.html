<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="referrer" content="no-referrer" />
<title>销冠留人器 · 信用层</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
<style>
/* =========================================================================
   销冠留人器 · 设计系统（借鉴 Linear / Stripe / Geist / Radix / Ant 密度）
   扁平 + 1px 边框承重 + 极轻阴影 + 表格数字对齐 + 双主题
   ========================================================================= */

/* ---------- 令牌：字体 ---------- */
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono",ui-monospace,"Cascadia Code","JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono","PingFang SC","Microsoft YaHei",monospace;

  --fs-2xs:.6875rem; --fs-xs:.75rem; --fs-sm:.8125rem; --fs-base:.875rem;
  --fs-md:1rem; --fs-lg:1.25rem; --fs-xl:1.5rem; --fs-2xl:2rem;
  --fs-3xl:2.5rem; --fs-4xl:3.25rem;
  --lh-tight:1.2; --lh-snug:1.35; --lh-normal:1.6;
  --fw-normal:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;
  --tracking-tight:-0.01em; --tracking-label:0.04em;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;
  --container:1280px; --gutter:20px; --card-pad:20px;

  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:9999px;
  --dur-fast:120ms; --dur:180ms; --dur-slow:280ms;
  --ease-out:cubic-bezier(.2,.8,.2,1);
}

/* ---------- 令牌：亮色 ---------- */
:root{
  --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;
  --gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;
  --gray-800:#1e293b;--gray-900:#0f172a;--gray-950:#020617;
  --bg:#f6f8fa; --surface:#ffffff; --surface-2:#f1f5f9; --surface-hover:#f8fafc;
  --text-strong:#0f172a; --text:#334155; --text-muted:#64748b; --text-faint:#94a3b8;
  --border:#e2e8f0; --border-strong:#cbd5e1;
  --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef2ff; --accent-text:#4338ca;
  --success:#15803d; --warning:#b45309; --danger:#dc2626; --info:#0369a1; --gold:#a16207;
  --success-soft:#f0fdf4; --warning-soft:#fffbeb; --danger-soft:#fef2f2; --info-soft:#f0f9ff; --gold-soft:#fefce8;
  --success-bd:#bbf7d0; --warning-bd:#fde68a; --danger-bd:#fecaca; --info-bd:#bae6fd; --gold-bd:#fde68a;
  --shadow-xs:0 1px 2px rgba(15,23,42,.06);
  --shadow-sm:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 12px rgba(15,23,42,.08),0 2px 4px rgba(15,23,42,.04);
  --shadow-lg:0 12px 32px rgba(15,23,42,.12),0 4px 8px rgba(15,23,42,.06);
  --ring:0 0 0 3px rgba(79,70,229,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root{ --_auto-dark:1; } }
:root[data-theme="dark"], :root:not([data-theme="light"]) { }

/* 暗色（跟随系统） */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0f1a; --surface:#111827; --surface-2:#1a2333; --surface-hover:#1e293b;
    --text-strong:#f8fafc; --text:#e2e8f0; --text-muted:#94a3b8; --text-faint:#64748b;
    --border:#1f2a3a; --border-strong:#334155;
    --accent:#818cf8; --accent-hover:#a5b4fc; --accent-soft:#1e1b4b; --accent-text:#a5b4fc;
    --success:#4ade80; --warning:#fbbf24; --danger:#f87171; --info:#38bdf8; --gold:#facc15;
    --success-soft:#052e1a; --warning-soft:#2a1e05; --danger-soft:#2a1010; --info-soft:#04202e; --gold-soft:#292207;
    --success-bd:#14532d; --warning-bd:#78350f; --danger-bd:#7f1d1d; --info-bd:#075985; --gold-bd:#78350f;
    --shadow-xs:0 1px 2px rgba(0,0,0,.4);
    --shadow-sm:0 1px 3px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 4px 12px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.4);
    --shadow-lg:0 12px 32px rgba(0,0,0,.6),0 4px 8px rgba(0,0,0,.5);
    --ring:0 0 0 3px rgba(129,140,248,.45);
    color-scheme:dark;
  }
}
/* 暗色（手动切换，优先级最高） */
:root[data-theme="dark"]{
  --bg:#0a0f1a; --surface:#111827; --surface-2:#1a2333; --surface-hover:#1e293b;
  --text-strong:#f8fafc; --text:#e2e8f0; --text-muted:#94a3b8; --text-faint:#64748b;
  --border:#1f2a3a; --border-strong:#334155;
  --accent:#818cf8; --accent-hover:#a5b4fc; --accent-soft:#1e1b4b; --accent-text:#a5b4fc;
  --success:#4ade80; --warning:#fbbf24; --danger:#f87171; --info:#38bdf8; --gold:#facc15;
  --success-soft:#052e1a; --warning-soft:#2a1e05; --danger-soft:#2a1010; --info-soft:#04202e; --gold-soft:#292207;
  --success-bd:#14532d; --warning-bd:#78350f; --danger-bd:#7f1d1d; --info-bd:#075985; --gold-bd:#78350f;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 12px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.4);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6),0 4px 8px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(129,140,248,.45);
  color-scheme:dark;
}

/* ---------- 基础 ---------- */
*{box-sizing:border-box}
*:focus{outline:none}
*:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans); font-size:var(--fs-base); line-height:var(--lh-normal);
  font-weight:var(--fw-normal); color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0;line-height:var(--lh-tight);letter-spacing:var(--tracking-tight);font-weight:var(--fw-semibold);color:var(--text-strong)}
p{margin:0}
a{color:var(--accent-text);text-decoration:none}
button{font-family:inherit}
.num,td.num,.metric,.kpi-value,.mono{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.mono{font-family:var(--font-mono)}
.muted{color:var(--text-muted)} .faint{color:var(--text-faint)} .strong{color:var(--text-strong)}
.tiny{font-size:var(--fs-xs)} .center{text-align:center} .right{text-align:right}
.dash{color:var(--text-faint)} /* “—” 空态 */

/* ---------- 布局：顶栏 + 侧栏 + 内容 ---------- */
.app-shell{display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"topbar topbar" "sidebar main";min-height:100vh}
.topbar{grid-area:topbar;display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-6);height:56px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:var(--sp-2);font-weight:var(--fw-bold);color:var(--text-strong);font-size:var(--fs-md)}
.brand .logo{font-size:1.25rem}
.brand .sub{font-size:var(--fs-xs);color:var(--text-muted);font-weight:var(--fw-medium);padding:2px 6px;background:var(--surface-2);border-radius:var(--r-sm)}
.topbar-spacer{flex:1}
.topbar .lic{font-size:var(--fs-xs);color:var(--text-muted)}
.topbar .lic b{color:var(--text)}
.sidebar{grid-area:sidebar;background:var(--surface);border-right:1px solid var(--border);padding:var(--sp-4) var(--sp-3);position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.nav-group{margin-bottom:var(--sp-4)}
.nav-group-label{font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-faint);padding:0 var(--sp-3);margin-bottom:var(--sp-2)}
.nav-item{display:flex;align-items:center;gap:var(--sp-2);width:100%;text-align:left;border:none;background:none;cursor:pointer;color:var(--text-muted);font-size:var(--fs-sm);font-weight:var(--fw-medium);padding:8px var(--sp-3);border-radius:var(--r-sm);margin-bottom:2px;transition:background var(--dur-fast),color var(--dur-fast)}
.nav-item .ico{width:18px;text-align:center;opacity:.9}
.nav-item:hover{background:var(--surface-hover);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-text)}
.nav-item .lock{margin-left:auto;font-size:var(--fs-xs);opacity:.7}
.main{grid-area:main;padding:var(--sp-6);max-width:1240px}
@media(max-width:900px){
  .app-shell{grid-template-columns:1fr;grid-template-areas:"topbar" "main"}
  .sidebar{display:none}
}

/* ---------- 卡片 ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:var(--card-pad)}
.card--interactive{cursor:pointer;transition:border-color var(--dur),box-shadow var(--dur),transform var(--dur)}
.card--interactive:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.card-title{font-size:var(--fs-lg);font-weight:var(--fw-semibold)}
.card-sub{font-size:var(--fs-xs);color:var(--text-muted);margin-top:2px}
.section-title{font-size:var(--fs-xl);margin-bottom:var(--sp-2)}
.section-desc{color:var(--text-muted);font-size:var(--fs-sm);margin-bottom:var(--sp-5);max-width:70ch}
.stack>*+*{margin-top:var(--sp-4)}
.grid{display:grid;gap:var(--gutter)}
.kpi-grid{display:grid;gap:var(--gutter);grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ---------- KPI ---------- */
.kpi-label{font-size:var(--fs-xs);font-weight:var(--fw-medium);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}
.kpi-value{font-size:var(--fs-3xl);font-weight:var(--fw-bold);line-height:var(--lh-tight);letter-spacing:-0.02em;color:var(--text-strong)}
.kpi-value.sm{font-size:var(--fs-2xl)}
.kpi-unit{font-size:var(--fs-md);font-weight:var(--fw-medium);color:var(--text-muted);margin-left:.15em}
.kpi-foot{margin-top:var(--sp-2);font-size:var(--fs-xs);color:var(--text-muted)}
.hero-num{font-size:var(--fs-4xl);font-weight:var(--fw-bold);letter-spacing:-.03em;line-height:1}

/* ---------- 徽章 ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-full);font-size:var(--fs-xs);font-weight:var(--fw-medium);line-height:1;border:1px solid transparent;white-space:nowrap}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge--success{color:var(--success);background:var(--success-soft);border-color:var(--success-bd)}
.badge--warning{color:var(--warning);background:var(--warning-soft);border-color:var(--warning-bd)}
.badge--danger{color:var(--danger);background:var(--danger-soft);border-color:var(--danger-bd)}
.badge--info{color:var(--info);background:var(--info-soft);border-color:var(--info-bd)}
.badge--gold{color:var(--gold);background:var(--gold-soft);border-color:var(--gold-bd)}
.badge--neutral{color:var(--text-muted);background:var(--surface-2);border-color:var(--border)}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:var(--fs-sm);font-weight:var(--fw-medium);cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast),color var(--dur-fast)}
.btn:hover{background:var(--surface-hover);border-color:var(--text-faint)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn--primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn--danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn--ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn--ghost:hover{background:var(--accent-soft)}
.btn--sm{min-height:28px;padding:0 10px;font-size:var(--fs-xs)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:var(--sp-2);flex-wrap:wrap}

/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg)}
.table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-sm)}
.table th{position:sticky;top:0;z-index:1;background:var(--surface-2);text-align:left;font-weight:var(--fw-semibold);font-size:var(--fs-xs);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top}
.table tbody tr:last-child td{border-bottom:none}
.table tbody tr:hover{background:var(--surface-hover)}
.table td.num,.table th.num{text-align:right;font-variant-numeric:tabular-nums}
.table td.mono{font-family:var(--font-mono)}

/* ---------- 计量条 / 环 ---------- */
.meter{height:8px;background:var(--surface-2);border-radius:var(--r-full);overflow:hidden}
.meter-fill{height:100%;border-radius:inherit;background:var(--accent);transition:width var(--dur-slow) var(--ease-out)}
.meter-fill.s-success{background:var(--success)} .meter-fill.s-info{background:var(--info)}
.meter-fill.s-warning{background:var(--warning)} .meter-fill.s-danger{background:var(--danger)}
.meter-fill.s-gold{background:var(--gold)}
.ring{position:relative;width:132px;height:132px;border-radius:50%;display:grid;place-items:center}
.ring::before{content:"";position:absolute;width:98px;height:98px;border-radius:50%;background:var(--surface)}
.ring-num{position:relative;font-size:var(--fs-2xl);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;line-height:1}
.ring-cap{position:relative;font-size:var(--fs-2xs);color:var(--text-muted);margin-top:2px}

/* ---------- 横幅 / 提示 ---------- */
.banner{display:flex;gap:12px;padding:12px 16px;border-radius:var(--r-md);border:1px solid;font-size:var(--fs-sm);align-items:flex-start}
.banner .b-ico{flex:none;font-size:1rem;line-height:1.3}
.banner strong{color:var(--text-strong)}
.banner p{margin:2px 0 0;color:var(--text-muted)}
.banner--warning{background:var(--warning-soft);border-color:var(--warning-bd);color:var(--warning)}
.banner--danger{background:var(--danger-soft);border-color:var(--danger-bd);color:var(--danger)}
.banner--success{background:var(--success-soft);border-color:var(--success-bd);color:var(--success)}
.banner--info{background:var(--info-soft);border-color:var(--info-bd);color:var(--info)}
.banner--gold{background:var(--gold-soft);border-color:var(--gold-bd);color:var(--gold)}

/* ---------- 行动卡（永不自动执行；老板点击） ---------- */
.action-card{border-left:3px solid var(--accent);background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 16px}
.action-card.sev-danger{border-left-color:var(--danger)}
.action-card.sev-warning{border-left-color:var(--warning)}
.action-card.sev-success{border-left-color:var(--success)}
.action-card .ac-title{font-weight:var(--fw-semibold);color:var(--text-strong);margin-bottom:2px}
.action-card .ac-body{font-size:var(--fs-sm);color:var(--text-muted);margin-bottom:10px}
.cite{font-size:var(--fs-xs);color:var(--text-muted);margin-top:8px;display:block;line-height:1.5}
.cite::before{content:"📎 ";}

/* ---------- 空态 / “—” ---------- */
.empty{text-align:center;padding:var(--sp-12) var(--sp-6);color:var(--text-muted)}
.empty-icon{font-size:32px;opacity:.5;margin-bottom:var(--sp-3)}
.empty-title{font-size:var(--fs-md);font-weight:var(--fw-semibold);color:var(--text);margin-bottom:4px}
.locked{position:relative}
.locked .lock-veil{position:absolute;inset:0;background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(3px);border-radius:inherit;display:grid;place-items:center;text-align:center;padding:var(--sp-4);z-index:2}

/* ---------- “计算得出，改不了” 信任标记 ---------- */
.computed-tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-2xs);color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-full);padding:2px 8px}
.asof{font-size:var(--fs-2xs);color:var(--text-faint)}
.asof.stale{color:var(--warning)}
.info-i{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-size:9px;font-weight:700;cursor:help}

/* ---------- 拆解条（hero 下方“为什么”） ---------- */
.breakdown{display:flex;flex-direction:column;gap:8px}
.bd-row{display:grid;grid-template-columns:130px 1fr 56px;align-items:center;gap:10px;font-size:var(--fs-sm)}
.bd-row .bd-name{color:var(--text)} .bd-row .bd-pts{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-muted)}

/* ---------- 表单 ---------- */
label.field{display:block;margin-bottom:var(--sp-3)}
.field-label{display:block;font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--text);margin-bottom:4px}
.field-hint{font-size:var(--fs-2xs);color:var(--text-faint);margin-top:3px}
input,select,textarea{width:100%;font-family:inherit;font-size:var(--fs-sm);color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:8px 10px;transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:var(--ring)}
input::placeholder{color:var(--text-faint)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:var(--sp-5);flex-wrap:wrap}
.tab{appearance:none;background:none;border:none;cursor:pointer;padding:10px 14px;font-size:var(--fs-sm);font-weight:var(--fw-medium);color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)} .tab.active{color:var(--accent-text);border-bottom-color:var(--accent)}

/* ---------- 弹层 ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.55);display:grid;place-items:center;z-index:100;padding:var(--sp-6)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:var(--sp-6)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-4)}
.modal h3{font-size:var(--fs-lg)}
.x-btn{border:none;background:none;font-size:1.25rem;color:var(--text-muted);cursor:pointer;line-height:1}

/* ---------- 自检徽章 ---------- */
.badge-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tcase{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);font-size:var(--fs-sm)}
.tcase .t-mark{flex:none;font-weight:700}
.tcase.pass{border-color:var(--success-bd);background:var(--success-soft)} .tcase.pass .t-mark{color:var(--success)}
.tcase.fail{border-color:var(--danger-bd);background:var(--danger-soft)} .tcase.fail .t-mark{color:var(--danger)}
.tcase .t-id{font-family:var(--font-mono);font-weight:600;color:var(--text-strong)}
.tcase .t-detail{color:var(--text-muted);font-size:var(--fs-xs);margin-top:2px}
.selftest-hero{display:flex;align-items:center;gap:var(--sp-5);flex-wrap:wrap}

<script>
"use strict";
(function(){
/* ==================== core.js ==================== */
// ============================================================================
// 宪法层（公约【2】【3】【4】）—— 唯一源，全系统 import，禁止重复实现
// 全部为纯函数；含日期计算的函数一律显式传入 today（公约 C-14 时钟注入铁律）
// ============================================================================

// ---- 【3】兜底铁律：safeDiv（除号唯一合法出口）----
function safeDiv(a, b) {
  return (b === 0 || b == null || a == null) ? null : a / b;
}
// null ≠ 0：证据缺失显 "—"，绝不退化为 0（A-19）
const DASH = '—';

// ---- 【2】全局数据类型 · 展示层格式化（运算层永不中途舍入）----
// 金额一律以「分」(int) 存储与运算；展示才转元。
const Money = {
  yuan: (fen) => (fen == null ? null : fen / 100),
  // ¥12,480（默认整数元，千分位）
  cny: (fen) => (fen == null ? DASH : '¥' + Math.round(fen / 100).toLocaleString('en-US')),
  // 3.5 万（保留 1 位）；元→万 = fen/1e6
  wan: (fen, dp = 1) => (fen == null ? DASH : (fen / 1e6).toFixed(dp) + ' 万'),
  wanNum: (fen) => (fen == null ? null : fen / 1e6),
};
const Rate = {
  // 35.0%（×100 保留 1 位）
  pct: (r, dp = 1) => (r == null ? DASH : (r * 100).toFixed(dp) + '%'),
  signPct: (r, dp = 1) => (r == null ? DASH : (r >= 0 ? '+' : '') + (r * 100).toFixed(dp) + '%'),
};
const Num = {
  x: (n, dp = 1) => (n == null ? DASH : n.toFixed(dp) + ' 倍'),
  int: (n) => (n == null ? DASH : Math.round(n).toLocaleString('en-US')),
};

// ---- 日期（YYYY-MM-DD；比较左闭右闭）----
const D = {
  parse: (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); },
  iso: (dt) => dt.toISOString().slice(0, 10),
  diffDays: (a, b) => Math.round((D.parse(b) - D.parse(a)) / 86400000), // b - a（天）
  addDays: (s, n) => D.iso(new Date(D.parse(s).getTime() + n * 86400000)),
  monthKey: (s) => String(s).slice(0, 7),
  // UI 层唯一取真实时钟处（计算层禁止 new Date()）
  realToday: () => new Date().toISOString().slice(0, 10),
};

// ---- ID：{缩写}_{毫秒}_{4位随机}（仅 UI 录入用，不进纯计算）----
function makeId(prefix) {
  return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
}

// ============================================================================
// 【4.7】全系统唯一 S 曲线（🔧C-04 头部和，四板块共用）
// ============================================================================
const RAMP = {
  short:     [0, 12, 25, 42, 60, 73, 85, 93, 100, 100, 100, 100], // 满产 9 月
  regular:   [0, 5, 12, 22, 35, 48, 60, 72, 82, 90, 96, 100],     // 满产 12 月
  midLong:   [0, 0, 5, 12, 20, 30, 42, 53, 63, 72, 80, 87],       // 满产 15 月
  long:      [0, 0, 0, 5, 10, 18, 27, 36, 45, 54, 62, 70],        // 满产 18 月
  ultraLong: [0, 0, 0, 0, 5, 10, 16, 23, 30, 37, 44, 50],         // 满产 24 月
};
const SEGMENT_MAP = { short: 'smb', regular: 'smb', midLong: 'mid', long: 'ent', ultraLong: 'strategic' };

// 🔴🔧C-04：入职月 m 的【当年】贡献率 = 在职 tenure 的【头部和】= Σ 曲线前 (13−m) 段 ÷ 12 ÷ 100
function newHireYearRate(cycle, m) {
  const c = RAMP[cycle];
  if (!c || m < 1) return null;
  const take = 13 - m;
  let s = 0;
  for (let i = 0; i < take && i < c.length; i++) s += c[i];
  return s / 12 / 100;
}
// 咬合基准（自我验证常量）：
//   基准① newHireYearRate('short',1) = 65.8%（790/1200）
//   基准② newHireYearRate('short',5) = 32.5%（390/1200）← C-04 专用回归哨兵（旧式会算成 59.25%）

// ============================================================================
// 【4.1–4.5】双口径宪法：金额只出自 totalIncome / laborCost / netContribution
// 数据以「一笔一条」的 PayoutEntry 数组传入（type + amt 分）
// ============================================================================
const INCOME_BONUS = new Set(['instant_bonus', 'year_end_bonus', 'dividend',
  'mentoring_share', 'recipe_royalty', 'sprint_vested', 'discretionary']);

// 4.1 员工视角"我拿到多少"（报销永不计入；VSA vested 前不计入）
function totalIncome(baseAmt, commissionAmt, payouts) {
  let bonus = 0;
  for (const p of (payouts || [])) if (INCOME_BONUS.has(p.type)) bonus += p.amt;
  return baseAmt + commissionAmt + bonus;
}
// 4.2 老板视角"我花了多少"（报销只进成本）
function laborCost(baseAmt, commissionAmt, socialCostRate, payouts) {
  let bonus = 0, reimburse = 0;
  for (const p of (payouts || [])) {
    if (INCOME_BONUS.has(p.type)) bonus += p.amt;
    else if (p.type === 'reimburse') reimburse += p.amt;
  }
  return baseAmt + Math.round(baseAmt * socialCostRate) + commissionAmt + bonus + reimburse;
}
// 4.5 提成口径（护城河）：margin_based，永不可换；禁止统一毛利折算系数
function commission(collectedAmt, categoryMarginRate, r) {
  return Math.round(collectedAmt * categoryMarginRate * r);
}

// 4.6 回算引擎核心（定价器心脏，公约级公式）——留人器守护线/闸引用
function recalcEngine(T, longTermRate, B, G) {
  // 边界守卫
  if (B >= T * (1 - longTermRate)) return { blocked: '底薪已吃穿现金目标（B ≥ T×(1−长期占比)）', r: null };
  if (G <= 0) return { blocked: '毛利口径 G ≤ 0', r: null };
  const gap = T * (1 - longTermRate) - B;      // 提成缺口
  const r = safeDiv(gap, G);                     // 毛利口径
  const longMonthly = T * longTermRate;          // → 分红池
  return { gap, r, longMonthly, blocked: null };
}
// 好招指数 = min(拟定B÷预警档B, 拟定T÷预警线T)
function goodHireIndex(planB, warnB, planT, warnT) {
  const a = safeDiv(planB, warnB), b = safeDiv(planT, warnT);
  if (a == null || b == null) return null;
  return Math.min(a, b);
}
function goodHireBand(idx) {
  if (idx == null) return null;
  if (idx < 1.0) return { band: 'danger', label: '🔴 招不起' };
  if (idx < 1.2) return { band: 'warning', label: '🟡 勉强' };
  if (idx < 1.4) return { band: 'success', label: '🟢 好招' };
  return { band: 'gold', label: '金 · 极好招' };
}


/* ==================== coefficients.js ==================== */
// ============================================================================
// COEFFICIENTS 系数总表（公约【5】跨板块共享 + 4号件二 §2.3 增补）
// 三权分立：结构权=系统 / 数值权=老板（Override）/ 启用权=老板
// 取用一律经 getCoef；null→"—"，绝不假装知道（公约【10】不变量 7）
// ============================================================================
const COEF_DEFAULT = {
  // ---- §5.2 全球基准（🔄 出厂值，真实数据回灌替换）----
  socialCostRate: 0.30,

  hiringCostDefaultAmt: 15000_00,          // 完全招聘成本（招人器口径，含入职行政）
  minSampleDefault: 5,
  envelopeStaleDays: 90,                    // 跨板块字段过期标注阈值（只标注不阻断）
  ahcTrustLine: 60,                         // AHC 信任线（闸⑦ / 算账器闸⑪ e1，双侧同步）
  midYearAttritionFactor: 0.5,
  backupNudgeDays: 14,                      // 备份提醒阈值（A-24）
  pipelineDecay: { loss: 0.35, residual: 0.65, inPriceTag: 0.35 }, // 接手劣化 35%（慢性）
  handoverLossRate: 0.40,                   // 在途单交接折损（急性，仅具名 HandoverCard）
  imbalanceGlobal: 0.56,                    // 全球辖区失衡基准（约六成）
  redrawGainBand: [0.02, 0.07],
  minWageTable: { tier1: 2420_00, tier2: 2000_00, tier34: 1700_00 },
  longTermRate: 0.10,

  // ---- 4号件二 §2.3 留人器专属增补 ----
  sii: { w: [25, 15, 15, 15, 20, 10], spotCap: 5, approveCap: 3, viewPerCapMonth: 4, rxPerCapMonth: 20, bands: [30, 60] }, // <30🟢 30–60🟡 >60🔴
  ei:  { w: [30, 25, 25, 20], objectionPerCapQuarter: 0.5, bands: [30, 60] },   // >60🟢 <30🔴
  ahc: { w: [40, 25, 20, 15], interceptCap: 10, ratchetCap: 3, bands: [60, 80] }, // ≥80🟢 <60🔴
  mc:  { w: [40, 30, 20, 10], bands: [40, 65] },                                  // >65🟢 <40🔴
  ratchetCorrThreshold: 0.5,
  freeRiderRules: { discountX: 2, complaintX: 1.5, concentration: 0.60, lowMarginShare: 0.40 },
  rampGapShareRedline: 0.45,
  pipelineDecayInPriceTag: 0.35,           // = 招人器/算账器 pipelineDecay.loss（一致）
  silentMonthsDefault: 6,
  dividendPayoutDelayDays: 45,
  refRound: 10000,                          // 参照点取整到 100 元（=10000 分）
  aftershockTalkDays: 7,
  handoverSavableShare: 0.50,
  secondPlaceRankBand: [2, 3],
  secondPlaceMonths: 3,
  m28: { mentorRate: 0.05, royaltyRate: 0.02, mentorDur: 12, royaltyDur: 24, oneOffAmt: 500_00 }, // 带教/使用费默认
  dependency: { warn: 0.40, danger: 0.60 }, // 依赖度雷达
  collapseMonthIn: [10, 18],               // 🔧L-C13 黑暗三角崩塌窗口（权威源=2号 collapseRule）
};

// 数值权归老板：Override 层（落 localStorage）。启动时由 storage 注入。
let COEF_OVERRIDE = {};
function setCoefOverride(obj) { COEF_OVERRIDE = obj || {}; }
function getCoef(key) {
  if (Object.prototype.hasOwnProperty.call(COEF_OVERRIDE, key)) return COEF_OVERRIDE[key];
  return COEF_DEFAULT[key];
}
// 系数表指纹（信封 coefficientsHash 用；导入时校验一致性，不一致提示不阻断）
function coefficientsHash() {
  const merged = { ...COEF_DEFAULT, ...COEF_OVERRIDE };
  const s = JSON.stringify(merged, Object.keys(merged).sort());
  let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
  return 'cf_' + (h >>> 0).toString(16);
}


/* ==================== storage.js ==================== */
// ============================================================================
// 存储层：StorageAdapter（localStorage，前缀 skab_liuren_；预留 IndexedDB 切换位）
// + 实体 + 信封（skab_v1：derived + entities）+ ExternalRef（整条覆盖·只读）
// + 授权/降级（公约【11】：ECDSA 公钥验签，HTML 内只含公钥）
// ============================================================================
const PREFIX = 'skab_liuren_';
const hasLS = (() => { try { return typeof localStorage !== 'undefined'; } catch (_) { return false; } })();
const _mem = {}; // Node/自检环境无 localStorage 时的内存兜底

const StorageAdapter = {
  get(key) { try { return hasLS ? localStorage.getItem(PREFIX + key) : (_mem[key] ?? null); } catch (_) { return _mem[key] ?? null; } },
  set(key, val) { try { hasLS ? localStorage.setItem(PREFIX + key, val) : (_mem[key] = val); } catch (_) { _mem[key] = val; } },
  remove(key) { try { hasLS ? localStorage.removeItem(PREFIX + key) : delete _mem[key]; } catch (_) { delete _mem[key]; } },
  // 配额自检（C-15：占用估算 + 写入探针）
  probe() {
    let used = 0;
    try { for (const k in (hasLS ? localStorage : _mem)) if (k.startsWith(PREFIX) || !hasLS) used += (StorageAdapter.get(k.replace(PREFIX, '')) || '').length; } catch (_) {}
    let writable = true;
    try { StorageAdapter.set('__probe__', '1'); StorageAdapter.remove('__probe__'); } catch (_) { writable = false; }
    return { approxBytes: used, writable, budgetBytes: 800 * 1024 }; // 单板块建议 ≤0.8MB
  },
};

// ---- 授权（公约【11】·全程零网络请求 A-17）----
const LICENSE = {
  // 🔴 HTML 内唯一密钥材料 = 公钥（授-5）；私钥永不进文件
  publicJwk: { kty: 'EC', crv: 'P-256', x: 'MzOG2tyKl1F1vO_p7MHNf6coVU9PLZCf_1G5QD3lHws', y: '8SJHKfZ40_POfMZduHIf9scLux7a1weIDuVHYFe69ic' },
  demoCode: 'SKAB-LR-ABFHWITUMVXGC3TUEI5CFZV4STT2JOXHU6P6NCFXEDBLOIHHR2F6NAF3EIWCEYTPMFZGIIR2EJWGS5LSMVXCELBCMV4HA2LSPERDUIRSGAZDOLJRGIWTGMJCPWYIENG3FZ3IC7674CILKSNUR5T5J7ZTI3WQSWCVW4DAVULBY24YBRTR5NMPO375424C4LLO3RVPKTTHULY5QMRITCDN6GLPZSGXN23F',
};
const B32AL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32decode(s) {
  let bits = 0, val = 0; const out = [];
  for (const ch of s) { const idx = B32AL.indexOf(ch); if (idx < 0) continue; val = (val << 5) | idx; bits += 5; if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } }
  return new Uint8Array(out);
}
// 纯逻辑：按日期解析 BUILD_MODE（授-2 到期只降级；防调表 seenMaxDate）——可离线单测
function resolveModeByDate(expiry, today, seenMaxDate) {
  if (seenMaxDate && today < seenMaxDate) return { mode: 'free', reason: 'clock_rollback' }; // 防调表
  if (!expiry) return { mode: 'free', reason: 'no_license' };
  if (today > expiry) return { mode: 'free', reason: 'expired' };                            // 到期只降级
  return { mode: 'full', reason: 'ok' };
}
async function verifyLicenseCode(code) {
  // 解码 → 公钥验签（crypto.subtle.verify，浏览器原生，零 CDN）
  try {
    const raw = code.replace(/^SKAB-LR-/, '').replace(/-/g, '');
    const bytes = b32decode(raw);
    const plen = (bytes[0] << 8) | bytes[1];
    const payloadBytes = bytes.slice(2, 2 + plen);
    const sig = bytes.slice(2 + plen);
    const cryptoObj = (typeof crypto !== 'undefined' && crypto.subtle) ? crypto : null;
    if (!cryptoObj) return { ok: false, reason: 'no_webcrypto' };
    const key = await cryptoObj.subtle.importKey('jwk', LICENSE.publicJwk, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    const ok = await cryptoObj.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, sig, payloadBytes);
    if (!ok) return { ok: false, reason: 'bad_sig' };
    const payload = JSON.parse(new TextDecoder().decode(payloadBytes));
    return { ok: true, payload };
  } catch (e) { return { ok: false, reason: 'parse_error' }; }
}

// ============================================================================
// 数据库根对象
// ============================================================================
const DB_KEY = 'db';

function saveDB() { if (DB) StorageAdapter.set(DB_KEY, JSON.stringify(DB)); }

}

// ---- 信封（公约【7】）----
function buildEnvelope(today) {
  // 🔧L-C11 双载荷：ahc(derived) + M28Agreement(entities)；导出永不锁定（授-2）
  const ind = Engine.indices(DB, today);
  return {
    schema: 'skab_v1',
    board: 'liuren',
    exportedAt: today,
    dataVersion: DB.meta.dataVersion,
    coefficientsHash: coefficientsHash(),
    derived: {
      ahc: ind.ahc.value,          // 供算账器闸⑪证据 e1（S-12）
      dvi: ind.dvi.value,          // 回流
    },
    entities: {
      M28Agreement: DB.entities.M28Agreement,     // 供算账器闸⑪证据 e2 + §3.3 产权价值分组
      Covenant: DB.entities.Covenant,
      LedgerEntry: DB.entities.LedgerEntry,
      ObjectionEntry: DB.entities.ObjectionEntry,
      SuggestionEntry: DB.entities.SuggestionEntry,
      HandoverCard: DB.entities.HandoverCard,
    },
  };
}
// ExternalRef 整条覆盖式导入（只读；永不进信封；A-20）
function importEnvelope(env, today) {
  if (!env || env.schema !== 'skab_v1' || !env.board) return { ok: false, reason: 'bad_schema' };
  const hashMismatch = env.coefficientsHash && env.coefficientsHash !== coefficientsHash();
  DB.externalRefs[env.board] = {
    board: env.board,
    exportedAt: env.exportedAt,
    dataVersion: env.dataVersion,
    coefficientsHash: env.coefficientsHash,
    derived: env.derived || {},
    entities: env.entities || {},
    importedAt: today,
  };
  saveDB();
  return { ok: true, board: env.board, hashMismatch };
}
function extRef(board) { return DB.externalRefs[board] || null; }
function staleDays(board, today) { const r = extRef(board); return r && r.exportedAt ? D.diffDays(r.exportedAt, today) : null; }

// ============================================================================
// 出厂数据（种子）—— 工程化复现件七 T1–T19 对拍
// 组件级输入直接照抄规格 3.1/3.5/3.7/3.8/3.9 的出厂算例
// ============================================================================
function factory() {
  const people = [
    { spId: 'sp_wangli', name: '王丽', phone: '13800000001', cityTier: 'tier1', level: 2, positionType: 'sales', hireDate: '2022-08-01', managerId: null, sourceChannel: 'referral', baseSalaryAmt: 6000_00, hiringCostAmt: 15000_00, isActive: true },
    { spId: 'sp_wangwu', name: '王五', phone: '13800000002', cityTier: 'tier1', level: 0, positionType: 'sales', hireDate: '2026-05-20', managerId: null, sourceChannel: 'ad', baseSalaryAmt: 5000_00, hiringCostAmt: 15000_00, isActive: true },
    { spId: 'sp_zhaomin', name: '赵敏', phone: '13800000003', cityTier: 'tier2', level: 1, positionType: 'sales', hireDate: '2024-01-15', managerId: null, sourceChannel: 'referral', baseSalaryAmt: 5000_00, hiringCostAmt: 15000_00, isActive: true },

/* ==================== engine.js ==================== */
// ============================================================================
// 引擎层：件三函数库（唯一权威口径）。全部纯函数，读 DB + 显式 today。
// SII/EI/DVI/AHC · M29.5 · M28 · 十二道闸 · M16 · M37 · M38 · M17 · MC
// ============================================================================
const Engine = (() => {

  const bandBy = (v, lo, hi, higherIsBetter) => {
    if (v == null) return null;
    if (higherIsBetter) return v >= hi ? 'success' : v >= lo ? 'warning' : 'danger';
    return v > hi ? 'danger' : v > lo ? 'warning' : 'success'; // 越低越好（SII）
  };

  // ---------- 3.1 四大指数 ----------
  function indices(DB, today) {
    const gS = DB.governance.sii, cS = getCoef('sii'), wS = cS.w, hS = gS.activeHeadcount;
    const siiRaw =
      wS[0] * (gS.dailyReportOn ? 1 : 0) +
      wS[1] * (gS.rollcallOn ? 1 : 0) +
      wS[2] * Math.min(gS.spotChecksPerWeek / cS.spotCap, 1) +
      wS[3] * Math.min(gS.approvalLevels / cS.approveCap, 1) +
      wS[4] * Math.min((safeDiv(gS.monthlyViewsTotal, hS * cS.viewPerCapMonth) ?? 0), 1) +
      wS[5] * Math.min((safeDiv(gS.rxCountTotal, hS * cS.rxPerCapMonth) ?? 0), 1);
    const sii = Math.round(siiRaw);

    const gE = DB.governance.ei, cE = getCoef('ei'), wE = cE.w, hE = gE.activeHeadcount;
    // 🔧L-C15：建议提出数=0 → 采纳项按 0 计（A-19 例外：授权通道未被使用，非证据缺失）
    const adoptRatio = gE.suggestionsRaised > 0 ? gE.suggestionsAdopted / gE.suggestionsRaised : 0;
    const eiRaw =
      wE[0] * Math.min((safeDiv(gE.objectionsRaisedQuarter, hE * cE.objectionPerCapQuarter) ?? 0), 1) +
      wE[1] * adoptRatio +
      wE[2] * gE.covenantConfirmRatio +
      wE[3] * (1 - gE.cardIgnoreRate);
    const ei = Math.round(eiRaw);

    // DVI：数据源=算账器信封；未导入→null（"—（需算账器数据）"）
    const sz = DB.externalRefs.suanzhang;
    const dvi = (sz && sz.derived && sz.derived.dvi != null) ? sz.derived.dvi : null;

    const a = DB.governance.ahcInputs, cA = getCoef('ahc'), wA = cA.w;
    const ahcRaw =
      wA[0] * a.honoredRatio +
      wA[1] * a.irrevocableRatio +
      wA[2] * (1 - Math.min(a.interceptCount / cA.interceptCap, 1)) +
      wA[3] * (1 - Math.min(a.ratchetCount / cA.ratchetCap, 1));
    const ahc = Math.round(ahcRaw);

    return {
      sii: { value: sii, raw: siiRaw, band: bandBy(sii, cS.bands[0], cS.bands[1], false), asOf: today, source: '本机' },
      ei: { value: ei, raw: eiRaw, band: bandBy(ei, cE.bands[0], cE.bands[1], true), asOf: today, source: '本机' },
      dvi: { value: dvi, raw: dvi, band: bandBy(dvi, 30, 60, true), asOf: sz ? sz.exportedAt : null, source: dvi == null ? null : '算账器' },
      ahc: { value: ahc, raw: ahcRaw, band: bandBy(ahc, cA.bands[0], cA.bands[1], true), asOf: today, source: '本机' },
    };
  }

  // ---------- 3.2 M29.5 自评-实评偏差器 ----------
  function deviation(DB, today) {
    const s = DB.governance.selfRating, ind = indices(DB, today);
    const pairs = [['监督 SII', s.sii, ind.sii.value], ['授权 EI', s.ei, ind.ei.value], ['可见 DVI', s.dvi, ind.dvi.value], ['信用 AHC', s.ahc, ind.ahc.value]];
    const diffs = pairs.filter(p => p[2] != null).map(p => ({ label: p[0], self: p[1], actual: p[2], gap: Math.abs(p[1] - p[2]) }));
    const gap = diffs.length ? Math.round(diffs.reduce((s2, d) => s2 + d.gap, 0) / diffs.length) : null;
    return { rows: diffs, gap };
  }

  // ---------- 3.5 M28 产权 ----------
  function m28Value(agr) {
    if (agr.kind === 'mentoring') return (agr.apprenticeMonthlyNetAmt || 0) * agr.rate * agr.durationMonths;
    if (agr.kind === 'royalty') return (agr.teamMonthlyIncrementAmt || 0) * agr.rate * agr.durationMonths;
    return null;
  }
  // 🔴 irrevocable：下调/缩短在代码层无成功路径（L-D1）。唯一出口=留痕。
  function tryDowngradeM28(DB, m28Id, today, note) {
    const agr = DB.entities.M28Agreement.find(x => x.m28Id === m28Id);
    if (!agr) return { ok: false, reason: 'not_found' };
    // 无论输入如何，rate/duration 不被修改；只产生留痕 + AHC 扣分事件 + 全员可见
    DB.entities.OverrideEvent.push({ id: makeId('ovr'), m28Id, at: today, action: 'try_downgrade', note: note || '', visibleToAll: true });
    DB.governance.ahcInputs.interceptCount += 1; // 拦截下调次数 +1 → AHC 重算下降
    return { ok: false, reason: 'irrevocable_blocked', downgraded: false, logged: true };
  }

  // ---------- 3.7 M16.1 价签（权威 6 项）T1–T4 ----------
  function priceTag(DB, today) {
    const p = DB.priceTag; const gm = p.monthlyGrossMarginAmt;
    const person = DB.entities.Salesperson.find(s => s.spId === p.spId);
    const headline = Math.round(gm * (p.hireMonths + p.paybackMonths));  // ≈ 权威估算 = 75 万
    const rampGap = Math.round(gm * p.rampGapMonthsEq);                    // ② 最大头
    const rampGapShare = safeDiv(rampGap, headline);
    const raiseAnnual = p.raiseMonthlyAmt * 12;
    const raiseVsTag = safeDiv(headline, raiseAnnual);
    const shortenGainAnnual = Math.round(rampGap * p.shortenPct * p.hiresPerYear); // T4
    const items = [
      { key: 'hiring', name: '① 招聘成本', amt: person ? person.hiringCostAmt : getCoef('hiringCostDefaultAmt'), scope: '完全招聘成本' },
      { key: 'ramp', name: '② 爬坡缺口', amt: rampGap, scope: '🔴 最大头', big: true },
      { key: 'idlepipe', name: '③ 空窗管道', amt: Math.round(gm * p.hireMonths), scope: '招聘周期内无人产出' },
      { key: 'mgr', name: '④ 经理时间', amt: Math.round(gm * 0.4), scope: '重新带人的管理耗时' },
      { key: 'decay', name: '⑤ 接手劣化 35%（慢性）', amt: Math.round(gm * getCoef('pipelineDecayInPriceTag')), scope: '常规客户/管道整体降效' },
      { key: 'handover', name: '⑥ 在途单交接 40%（急性）', amt: null, scope: '仅具名 HandoverCard；王丽今日无在途单 → —' },
    ];
    return {
      spId: p.spId, name: person ? person.name : '—',
      headline, rampGap, rampGapShare, raiseAnnual, raiseVsTag, shortenGainAnnual,
      hitGate5: rampGapShare != null && rampGapShare > getCoef('rampGapShareRedline'),
      items, asOf: today,
    };
  }

  // ---------- 3.7 M16.8 依赖度雷达 ----------
  function dependency(DB, today) {
    const sz = DB.externalRefs.suanzhang;
    if (!sz || !sz.perPerson) return { value: null };
    const rows = Object.entries(sz.perPerson).map(([id, v]) => ({ id, collected: v.collected6m || 0, leadIndex: v.leadIndex }));
    const total = rows.reduce((s, r) => s + r.collected, 0);
    if (total === 0) return { value: null };
    rows.sort((a, b) => b.collected - a.collected);
    const top = rows[0];
    const ratio = safeDiv(top.collected, total);
    const person = DB.entities.Salesperson.find(s => s.spId === top.id);
    const c = getCoef('dependency');
    return {
      value: ratio, topName: person ? person.name : top.id, topLeadIndex: top.leadIndex,
      band: ratio >= c.danger ? 'danger' : ratio >= c.warn ? 'warning' : 'success',
      selfMade: top.leadIndex > 1.5, asOf: sz.exportedAt,
    };
  }

  // ---------- 3.7 M16.3 该谈名单（五触发源）含榜眼 T15 ----------
  function secondPlaceTrigger(DB, spId) {
    const sz = DB.externalRefs.suanzhang; if (!sz || !sz.perPerson || !sz.perPerson[spId]) return { hit: false };
    const pp = sz.perPerson[spId]; const [lo, hi] = getCoef('secondPlaceRankBand'); const n = getCoef('secondPlaceMonths');
    const recent = (pp.normRankMonths || []).slice(-n);
    const bandOk = recent.length >= n && recent.every(r => r >= lo && r <= hi);
    const zeroSpecial = (pp.specialPayout12m || 0) === 0;
    const scissorsPos = (pp.scissors || 0) > 0;
    const hit = bandOk && (scissorsPos || zeroSpecial);
    return { hit, months: recent.length, rank: recent[recent.length - 1], scissors: pp.scissors, zeroSpecial };
  }
  function talkList(DB, today) {
    const out = [];
    for (const s of DB.entities.Salesperson) {
      if (!s.isActive) continue;
      const triggers = [];
      // ① 周年前14天
      const anni = anniversaryInDays(s.hireDate, today);
      if (anni != null && anni >= 0 && anni <= 14) triggers.push({ src: 'anniversary', label: '周年档', detail: `${anni} 天后周年` });
      // ④ 剪刀差≥30% ∧ 市价差>0
      const sz = DB.externalRefs.suanzhang; const pp = sz && sz.perPerson ? sz.perPerson[s.spId] : null;
      if (pp && pp.scissors >= 0.30 && pp.marketGap > 0) triggers.push({ src: 'scissors', label: '剪刀差档', detail: `剪刀差 ${Rate.pct(pp.scissors)}` });
      // ⑤ 榜眼
      const sp = secondPlaceTrigger(DB, s.spId);
      if (sp.hit) triggers.push({ src: 'second_place', label: '榜眼档', detail: `连续 ${sp.months} 月第 ${sp.rank}` });
      if (triggers.length) out.push({ spId: s.spId, name: s.name, triggers, pp });
    }
    return out;
  }
  function anniversaryInDays(hireDate, today) {
    if (!hireDate) return null;
    const t = D.parse(today); const y = t.getUTCFullYear();
    const md = hireDate.slice(5);
    let next = `${y}-${md}`;
    if (D.diffDays(today, next) < 0) next = `${y + 1}-${md}`;
    return D.diffDays(today, next);
  }

  // ---------- 3.8 M37 参照点账本 T13 ----------
  function precheck(DB, spId, plannedAmt, today) {
    const sz = DB.externalRefs.suanzhang; const pp = sz && sz.perPerson ? sz.perPerson[spId] : null;
    // 历史参照点 = 去年同期同名目实收
    const lastYear = D.parse(today).getUTCFullYear() - 1;
    const hist = DB.entities.PayoutEntry.filter(x => x.employeeId === spId && (x.type === 'year_end_bonus' || x.type === 'dividend') && x.period && x.period.startsWith(String(lastYear)))
      .reduce((s, x) => s + x.amt, 0) || null;
    const growth = pp && pp.contribGrowth != null ? pp.contribGrowth : null;
    let trend = null;
    if (hist != null) {
      const refRound = getCoef('refRound');
      const g = growth == null ? 0 : growth;
      trend = Math.round(hist * (1 + g) / refRound) * refRound;
    }
    let verdict = null;
    if (hist != null) {
      if (plannedAmt < hist) verdict = 'below_history';
      else if (trend != null && plannedAmt < trend) verdict = 'below_trend';
      else verdict = 'ok';
    }
    return { hist, growth, trend, verdict, plannedAmt };
  }

  // ---------- 3.9 M38 余震与交接 T14 ----------
  function handoverSummary(cards) {
    const sum = cards.reduce((s, c) => s + (c.amountAmt || 0), 0);
    const loss = Math.round(sum * getCoef('handoverLossRate'));
    const save = Math.round(loss * getCoef('handoverSavableShare'));

  }
  function aftershockRank(DB, leaverId, today) {
    const sz = DB.externalRefs.suanzhang; const leaver = DB.entities.Salesperson.find(s => s.spId === leaverId);
    const rows = [];
    for (const s of DB.entities.Salesperson) {
      if (!s.isActive || s.spId === leaverId) continue;
      const pp = sz && sz.perPerson ? sz.perPerson[s.spId] : null; if (!pp) continue;
      let score = 0; const sig = [];
      if (pp.scissors > 0) { score++; sig.push('剪刀差>0'); }
      if (pp.marketGap > 0) { score++; sig.push('市价差>0'); }
      const sameTerr = !!leaver && (s.cityTier === leaver.cityTier || (!!s.hireBatchId && s.hireBatchId === leaver.hireBatchId));
      if (sameTerr) { score++; sig.push('同辖区/批次'); }
      rows.push({ spId: s.spId, name: s.name, score, sig, scissors: pp.scissors, marketGap: pp.marketGap });
    }
    rows.sort((a, b) => b.score - a.score);
    return rows.slice(0, 3);
  }

  // ---------- 3.3 M30：异议 pending>7天 → 关联负面标记自动失效（L-D6，默认保护员工）----
  function sweepObjections(DB, today) {

  // ---------- 3.6 十二道闸 ----------
  function boardLocked(DB) { const sz = DB.externalRefs.suanzhang; return !(sz && sz.m21Done); } // 闸①

  function isResultTrigger(t) { return t === 'record_break' || t === 'sprint' || t === 'backlog_clear'; }

  function bountySaveCheck(t, silentTrackOn) {

  // ---------- 3.10 M17 分红（三重闸 ⇄ 四问 串联）T11 / T19 ----------
  function computeDividend(DB, today, opts) {

    const cfg = opts.cfg || DB.dividend;
    const ind = opts.indicators || indices(DB, today);
    // ① 三重闸 = 资格门（数值权归老板）
    const gates = [
      { key: 'companyCollect', label: '公司回款', ...cfg.gateCompanyCollect },
      { key: 'companyNet', label: '公司净贡献', ...cfg.gateCompanyNet },
      { key: 'personalCollect', label: '个人回款', ...cfg.gatePersonalCollect },
    ];
    const threeGatePass = gates.filter(g => g.enabled).every(g => g.pass);
    const result = { gates, threeGatePass, pool: 0, fourQuestionsRun: false, four: null, fourFailCount: null, verdict: null };
    if (!threeGatePass) {
      result.pool = 0; result.verdict = 'no_eligibility'; // 池=0，流程终止，四问零调用
      return result;
    }
    // 池（三重闸过后才算）
    result.pool = Math.round(cfg.netBeforeDividendAmt * cfg.poolRate);
    // ② 四问 = 体检（结构权归系统）—— 🔴 永不清零池
    result.fourQuestionsRun = true;
    const dose = DB.externalRefs.yuren && DB.externalRefs.yuren.derived ? DB.externalRefs.yuren.derived.coachingDoseActual : null;
    const ghi = opts.goodHireIndex != null ? opts.goodHireIndex : (DB.externalRefs.dingjia && DB.externalRefs.dingjia.derived ? DB.externalRefs.dingjia.derived.goodHireIndex : null);
    const four = [
      { q: 'Q1 好招指数≥1.0', pass: ghi != null ? ghi >= 1.0 : null, val: ghi },
      { q: 'Q2 EI≥30', pass: ind.ei.value >= 30, val: ind.ei.value },
      { q: 'Q3 SII≤60', pass: ind.sii.value <= 60, val: ind.sii.value },
      { q: 'Q4 辅导剂量≥3h/月人', pass: dose == null ? null : dose >= 3, val: dose }, // 未导入→null（退化为三问）
    ];
    const fails = four.filter(x => x.pass === false).length;
    result.four = four; result.fourFailCount = fails;
    result.verdict = fails >= 2 ? 'danger' : fails === 1 ? 'warning' : 'ok'; // 一否🟡 两否🔴 四否🔴
    return result;
  }

  // ---------- 3.10 MC 监督成本发包 ----------
  function monitorCost(DB, spId, today) {
    const ind = indices(DB, today); const dvi = ind.dvi.value;
    const s = DB.entities.Salesperson.find(x => x.spId === spId); if (!s) return { value: null };
    const c = getCoef('mc'), w = c.w;
    const geo = s.cityTier === 'tier1' ? 0 : s.cityTier === 'tier2' ? 1 : s.cityTier === 'tier3' ? 2 : 3;
    if (dvi == null) return { value: null, reason: '需 DVI（算账器数据）' };
    const localJudge = 0.5; // normalize(客单价CV+周期CV+品类熵) 占位（需 Deal 明细，缺→中位）
    const attrRate = 0.7;
    const mc = w[0] * (1 - dvi / 100) + w[1] * (geo / 3) + w[2] * localJudge + w[3] * (1 - attrRate);
    return { value: Math.round(mc), band: mc > c.bands[1] ? 'success' : mc < c.bands[0] ? 'danger' : 'warning' };
  }

  return {
    indices, deviation, m28Value, tryDowngradeM28, priceTag, dependency,
    talkList, secondPlaceTrigger, anniversaryInDays, precheck, handoverSummary, aftershockRank,
    boardLocked, rankingConfig, isResultTrigger, isExempt, bountySaveCheck, collapseGate,
    computeDividend, monitorCost, sweepObjections,
  };
})();

  pa('L-D5', '悬赏保存三态；无“结果类一律拦截”旧逻辑', g1.ok === false && g2.ok === true && g3.ok === true, '三态与 5号闸⑧ 同输入同结果');
  pa('L-D6', 'ObjectionEntry pending>7天 → 关联标记失效', (() => { const d = factory(); d.entities.ObjectionEntry.push({ objId: 'o1', status: 'pending', createdAt: D.addDays(T, -8), markActive: true }); Engine.sweepObjections(d, T); return d.entities.ObjectionEntry[0].markActive === false; })(), '8 天未处理 → markActive=false');
  pa('L-D14', '全局 null→“—”；safeDiv 除零→null；无 Infinity/NaN', Money.cny(null) === DASH && Rate.pct(null) === DASH && safeDiv(1, 0) === null && !Number.isNaN(ind.sii.value), '“—” 唯一空态');
  pa('L-D15', 'AHC 入信封 derived + M28Agreement 随 entities 同包；价签⑤⑥不同笔', envDb.derived.ahc != null && envDb.entities.M28Agreement.length >= 1 && pt.items.find(i => i.key === 'decay') && pt.items.find(i => i.key === 'handover'), '双载荷 + 慢性/急性 scope 分离');
  pa('L-D16', '分红串联：三重闸不达→四问零调用；四问无清零池写路径', d19a.fourQuestionsRun === false && d19b.pool > 0, '调用链在三重闸之后');
  pa('授-2/4', '到期只降级不锁数据：导出永不锁定；降级不删数据', resolveModeByDate('2020-01-01', T, null).mode === 'free' && resolveModeByDate('2030-01-01', T, null).mode === 'full', '过期→free；导出功能不受 mode 影响');
  pa('授-3', '防调表：系统日期 < seenMaxDate → 锁定', resolveModeByDate('2030-01-01', '2026-01-01', '2026-07-13').mode === 'free', '回拨时钟→free');
  pa('§4.7', 'C-04 咬合基准：short m1=65.8% / m5=32.5%（旧式 59.25%）', approx(newHireYearRate('short', 1), 0.658, 0.001) && approx(newHireYearRate('short', 5), 0.325, 0.001), '790/1200 与 390/1200');

  const passCount = tcases.filter(t => t.pass).length;
  const assertPass = asserts.filter(a => a.pass).length;
  return { tcases, asserts, passCount, total: tcases.length, assertPass, assertTotal: asserts.length, today: T };
}

  // ========================================================================
  // 系数与自检
  // ========================================================================
  function screenSelfTest() {
    const r = runSelfTest();
    const tcards = r.tcases.map(t => `<div class="tcase ${t.pass ? 'pass' : 'fail'}"><span class="t-mark">${t.pass ? '✓' : '✗'}</span><div><span class="t-id">${t.id}</span> ${esc(t.title)}<div class="t-detail">got: ${esc(t.got)} · want: ${esc(t.want)}</div></div></div>`).join('');
    const acards = r.asserts.map(a => `<div class="tcase ${a.pass ? 'pass' : 'fail'}"><span class="t-mark">${a.pass ? '✓' : '✗'}</span><div><span class="t-id">${esc(a.id)}</span> ${esc(a.title)}<div class="t-detail">${esc(a.detail)}</div></div></div>`).join('');
    const allGreen = r.passCount === r.total && r.assertPass === r.assertTotal;
    return `<div class="stack">
      <h1 class="section-title">系数与自检</h1>
      <div class="card selftest-hero">
        ${ring(Math.round(r.passCount / r.total * 100), allGreen ? 'success' : 'danger')}
        <div><div class="hero-num" style="color:var(--${allGreen ? 'success' : 'danger'})">${r.passCount}/${r.total}</div>
        <div class="kpi-label">件七对拍徽章（三绿＝收货）</div>
        <div class="kpi-foot">红线断言 ${r.assertPass}/${r.assertTotal} · 时钟注入 TEST_TODAY = ${esc(r.today)}（C-14/R-11）</div></div>
      </div>
      <div><h2 class="card-title" style="margin-bottom:10px">件七 · 验收用例集（T1–T19）</h2><div class="badge-grid">${tcards}</div></div>

      <div class="card"><div class="card-title">系数总表（结构权系统 / 数值权老板）</div>
        <div class="tiny muted" style="margin-top:6px">全部系数经 getCoef 取用；数值权归老板（可覆盖）。此处为只读速览，编辑入口在各功能页。</div>
        <div class="grid grid-3" style="margin-top:10px">
          <div class="kv"><span class="k">AHC 信任线</span><span class="v">${getCoef('ahcTrustLine')}</span></div>
          <div class="kv"><span class="k">爬坡缺口红线</span><span class="v">${Rate.pct(getCoef('rampGapShareRedline'))}</span></div>
          <div class="kv"><span class="k">接手劣化(慢性)</span><span class="v">${Rate.pct(getCoef('pipelineDecayInPriceTag'))}</span></div>
          <div class="kv"><span class="k">交接折损(急性)</span><span class="v">${Rate.pct(getCoef('handoverLossRate'))}</span></div>
          <div class="kv"><span class="k">信封过期阈值</span><span class="v">${getCoef('envelopeStaleDays')} 天</span></div>
          <div class="kv"><span class="k">备份提醒阈值</span><span class="v">${getCoef('backupNudgeDays')} 天</span></div>
        </div>
      </div>
    </div>`;
  }

  // ---- 路由 ----
  const ROUTES = { overview: screenOverview, pricetag: screenPriceTag, gates: screenGates, m28: screenM28, retention: screenRetention, dividend: screenDividend, sales: screenSales, system: screenSystem, selftest: screenSelfTest };
  function render() {
    document.documentElement.dataset.theme = DB.settings.theme === 'auto' ? '' : DB.settings.theme;
    // 闸① 全锁：算账器未导入 → 除系统/自检外全部锁屏
    if (Engine.boardLocked(DB) && !['system', 'selftest'].includes(S.route)) {
      app().innerHTML = chrome(lockScreen()); return;
    }
    const view = (ROUTES[S.route] || screenOverview)();
    app().innerHTML = chrome(view) + (S.modal || '');
  }

  return { S, render, esc, badge, ring, toast, openModal, closeModal, actions: null };

  function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
  function openModal(html) { S.modal = `<div class="modal-backdrop" data-act="closeModalBg"><div class="modal">${html}</div></div>`; render(); }
  function closeModal() { S.modal = null; render(); }
})();

// ============================================================================
// 启动装配：加载 DB → 解析授权（离线 ECDSA 验签）→ 首屏渲染 → 事件委托
// UI 层唯一取真实时钟处（公约 C-14）：UI.S.today
// ============================================================================
function boot() {
  loadDB();
  UI.S.today = D.realToday();

  // 授权解析（授-2 到期只降级；授-3 防调表 seenMaxDate）
  const lic = DB.license || {};
  const seen = lic.seenMaxDate;
  if (!seen || UI.S.today > seen) { DB.license.seenMaxDate = UI.S.today; saveDB(); }
  const res = resolveModeByDate(lic.expiry, UI.S.today, DB.license.seenMaxDate);
  DB.__mode = res.mode;
  // 异步验签（不阻塞首屏；失败即无效 → free）
  if (lic.code) verifyLicenseCode(lic.code).then(v => {
    if (v.ok && v.payload) {
      DB.license.tenant = v.payload.tenant; DB.license.expiry = v.payload.expiry; DB.license.board = v.payload.board;
      DB.license.verified = true;
      DB.__mode = resolveModeByDate(v.payload.expiry, UI.S.today, DB.license.seenMaxDate).mode;
    } else { DB.license.verified = false; }
    UI.render();
  });

  UI.render();
  wireEvents();
}

function wireEvents() {
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') UI.closeModal(); });
}

function onClick(e) {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  const H = handlers[act];
  if (H) { e.preventDefault(); H(t); }
}

const handlers = {
  nav: (t) => { UI.S.route = t.dataset.route; UI.S.modal = null; UI.render(); window.scrollTo(0, 0); },
  theme: () => { const cur = DB.settings.theme; DB.settings.theme = cur === 'auto' ? 'dark' : cur === 'dark' ? 'light' : 'auto'; saveDB(); UI.render(); UI.toast('主题：' + DB.settings.theme); },
  print: () => window.print(),
  closeModalBg: (t) => { if (t.classList.contains('modal-backdrop')) UI.closeModal(); },
  closeModal: () => UI.closeModal(),

  export: () => {
    const env = buildEnvelope(UI.S.today);
    downloadJSON(env, `skab_liuren_${UI.S.today}.json`);
    DB.ui.backupLastExportAt = UI.S.today; saveDB(); UI.render();
    UI.toast('已导出信封（含 ahc + M28Agreement 双载荷）');
  },
  exportAnon: () => UI.toast('匿名实验包已生成（占位 · 全程不联网）'),
  migrate: () => UI.openModal(`<div class="modal-head"><h3>换电脑迁移</h3><button class="x-btn" data-act="closeModal">×</button></div>
    <ol style="padding-left:18px;line-height:2"><li>在旧电脑点「导出信封 JSON」，得到一个文件。</li><li>把文件拷到新电脑（U 盘/网盘均可）。</li><li>在新电脑打开本 HTML → 信封页「导入他方信封」选该文件。</li></ol>
    <p class="tiny muted">「数据不出你电脑」的另一面是「数据只在你电脑」——丢数据的责任由系统主动防，所以每 ${getCoef('backupNudgeDays')} 天提醒你备份一次。</p>`),

  importPick: () => pickFile((obj) => {
    const r = importEnvelope(obj, UI.S.today);
    if (!r.ok) { UI.toast('导入失败：schema 不符'); return; }
    UI.toast(`已导入 ${r.board}${r.hashMismatch ? '（系数指纹不一致，建议同步）' : ''}`);
    UI.render();
  }),

  selfrate: () => {
    const s = DB.governance.selfRating;
    UI.openModal(`<div class="modal-head"><h3>自评四滑杆（先猜后看）</h3><button class="x-btn" data-act="closeModal">×</button></div>
      ${['sii', 'ei', 'dvi', 'ahc'].map(k => `<label class="field"><span class="field-label">${({ sii: '监督 SII', ei: '授权 EI', dvi: '可见 DVI', ahc: '信用 AHC' })[k]}：<b id="sr-${k}-v">${s[k]}</b></span><input type="range" min="0" max="100" value="${s[k]}" id="sr-${k}" oninput="document.getElementById('sr-${k}-v').textContent=this.value"></label>`).join('')}
      <div class="btn-row"><button class="btn btn--primary" data-act="saveSelfrate">保存并看实测</button></div>`);
  },
  saveSelfrate: () => {
    ['sii', 'ei', 'dvi', 'ahc'].forEach(k => { const el = document.getElementById('sr-' + k); if (el) DB.governance.selfRating[k] = +el.value; });
    saveDB(); UI.closeModal(); UI.toast('已保存自评');
  },

  bountyDemo: (t) => {
    const tr = t.dataset.t;
    const chk = Engine.bountySaveCheck(tr, DB.silentTrackOn);
    if (chk.ok) { UI.toast(`🟢 「${tr}」放行保存${chk.reason === 'exempt' ? '（豁免）' : ''}`); return; }
    UI.openModal(`<div class="modal-head"><h3>闸③ 拦截保存</h3><button class="x-btn" data-act="closeModal">×</button></div>
      <div class="banner banner--danger"><span class="b-ico">🔴</span><div>${UI.esc(SCRIPTS.L15({ templateName: tr }))}</div></div>
      <div class="btn-row" style="margin-top:14px"><button class="btn btn--primary" data-act="enableSilent">一键启用静默认可通道</button><button class="btn" data-act="closeModal">改用行为类悬赏</button></div>`);
  },
  enableSilent: () => { DB.silentTrackOn = true; saveDB(); UI.closeModal(); UI.render(); UI.toast('已启用静默认可通道（连续 6 月达标 → 灯塔 + 合约资格池）'); },

  tryDown: (t) => {
    const r = Engine.tryDowngradeM28(DB, t.dataset.id, UI.S.today, '界面尝试下调');
    saveDB(); UI.render();
    UI.toast('🔴 下调在代码层无成功路径——已留痕 + AHC 扣分 + 全员可见');
  },

  runPrecheck: () => {
    const sp = document.getElementById('pc-sp').value;
    const amt = Math.round((+document.getElementById('pc-amt').value || 0) * 100);
    const pc = Engine.precheck(DB, sp, amt, UI.S.today);
    const out = document.getElementById('pc-out'); if (!out) return;
    if (pc.hist == null) { out.innerHTML = `<div class="banner banner--info"><span class="b-ico">ℹ️</span><div>—（首年无参照）仅出提示。</div></div>`; return; }
    const map = { below_history: ['danger', SCRIPTS.L10a({ amt: Money.cny(amt), hist: Money.cny(pc.hist) })], below_trend: ['warning', SCRIPTS.L10b({ amt: Money.cny(amt), hist: Money.cny(pc.hist), trend: Money.cny(pc.trend), g: Rate.pct(pc.growth) })], ok: ['success', SCRIPTS.L10c({ amt: Money.cny(amt), trend: Money.cny(pc.trend) })] };
    const [band, msg] = map[pc.verdict];
    out.innerHTML = `<div class="banner banner--${band}"><span class="b-ico">${band === 'danger' ? '🔴' : band === 'warning' ? '🟡' : '🟢'}</span><div>${UI.esc(msg)}</div></div>
      <div class="tiny muted" style="margin-top:8px">${UI.esc(SCRIPTS.L10d())}</div>`;
  },

  forceDividend: () => { DB.entities.OverrideEvent.push({ id: makeId('ovr'), at: UI.S.today, action: 'force_dividend_risk_ack', visibleToAll: true }); DB.governance.ahcInputs.interceptCount += 0; saveDB(); UI.toast('已留痕：我知道风险仍要启用（计入 AHC）'); },

  leaveWizard: () => {
    const spOpts = DB.entities.Salesperson.filter(s => s.isActive).map(s => `<option value="${s.spId}">${UI.esc(s.name)}</option>`).join('');
    UI.openModal(`<div class="modal-head"><h3>离职登记向导（M38）</h3><button class="x-btn" data-act="closeModal">×</button></div>
      <label class="field"><span class="field-label">离职员工</span><select id="lw-sp">${spOpts}</select></label>
      <label class="field"><span class="field-label">在途单账面合计（万元，演示一次录入）</span><input id="lw-sum" type="number" value="96"></label>
      <label class="field"><span class="field-label">在途单笔数</span><input id="lw-n" type="number" value="11"></label>
      <div class="btn-row"><button class="btn btn--primary" data-act="runLeave">生成余震名单 + 交接卡</button></div>
      <div id="lw-out" style="margin-top:12px"></div>`);
  },
  runLeave: () => {
    const sp = document.getElementById('lw-sp').value;
    const n = Math.max(1, +document.getElementById('lw-n').value || 1);
    const sum = Math.round((+document.getElementById('lw-sum').value || 0) * 1e6);
    const cards = []; for (let i = 0; i < n; i++) cards.push({ amountAmt: Math.round(sum / n) });
    cards[0].amountAmt += sum - cards.reduce((s, c) => s + c.amountAmt, 0);
    const hs = Engine.handoverSummary(cards);
    const after = Engine.aftershockRank(DB, sp, UI.S.today);
    const list = after.map(a => `${UI.esc(a.name)}（${a.score}分：${a.sig.join('/') || '—'}）`).join('；');
    const out = document.getElementById('lw-out');
    out.innerHTML = `<div class="banner banner--warning"><span class="b-ico">⚠️</span><div>${UI.esc(SCRIPTS.L11({ leaver: masterNameSafe(sp), list }))}</div></div>
      <div class="banner banner--danger" style="margin-top:8px"><span class="b-ico">🔴</span><div>${UI.esc(SCRIPTS.L12({ n, sum: Money.wan(sum), loss: Money.wan(hs.loss), save: Money.wan(hs.save) }))}</div></div>
      <div class="tiny muted" style="margin-top:8px">已生成 ${hs.count} 张交接卡（可打印，指派接手人）；损耗回填该离职者价签第六项。</div>`;
  },

  applyLicense: async (t) => {
    const code = (document.getElementById('lic-code') || {}).value;
    if (!code) { UI.toast('请粘贴续期码'); return; }
    const v = await verifyLicenseCode(code.trim());
    if (!v.ok) { UI.toast('续期码无效：' + v.reason); return; }
    DB.license = { code: code.trim(), tenant: v.payload.tenant, board: v.payload.board, expiry: v.payload.expiry, verified: true, seenMaxDate: DB.license.seenMaxDate };
    DB.__mode = resolveModeByDate(v.payload.expiry, UI.S.today, DB.license.seenMaxDate).mode;
    saveDB(); UI.render(); UI.toast('续期成功：' + v.payload.tenant);
  },

  reset: () => UI.openModal(`<div class="modal-head"><h3>确认重置</h3><button class="x-btn" data-act="closeModal">×</button></div>
    <p>将清空当前数据并恢复出厂种子。此操作不可撤销。</p>
    <div class="btn-row" style="margin-top:14px"><button class="btn btn--danger" data-act="resetGo">确认重置</button><button class="btn" data-act="closeModal">取消</button></div>`),
  resetGo: () => { resetDB(); UI.closeModal(); UI.render(); UI.toast('已重置为出厂数据'); },
};

function masterNameSafe(id) { const s = DB.entities.Salesperson.find(x => x.spId === id); return s ? s.name : id; }

// ---- 文件工具（file:// 可用；A-17 无网络）----
function downloadJSON(obj, name) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function pickFile(cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { try { cb(JSON.parse(fr.result)); } catch (_) { UI.toast('文件解析失败'); } }; fr.readAsText(f); };
  inp.click();
}

// 启动
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}

})();
</script>
