<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销冠定价器 · v2.5</title>
<!--
  销冠定价器 v2.5 — 单 HTML 文件 · 无后端 · 无网络 · 无 CDN · localStorage
  技术栈冻结（0号公约§8）。计算层纯函数，系数只经 getCoef，日期显式注入（公约 C-14）。
  BUILD_MODE 双构建：'full' 全开 / 'free' 钩子版（合计可见、明细模糊上锁、导出不渲染）。
-->
<style>
:root{
  --bg:#eceef3; --bg2:#f4f5f9; --panel:#ffffff; --surface-2:#f7f8fc; --input-bg:#ffffff; --matrix-bg:#fffef8;
  --topbar-bg:rgba(255,255,255,.82);
  --ink:#0d1424; --ink2:#485265; --ink3:#8a94a6;
  --line:#e4e8ef; --line2:#eef1f6; --accent:#5b5bf0; --accent2:#7c5cf6; --accent-soft:#eeefff;
  --red:#e5484d; --red-soft:#fef1f1; --red-ink:#b42318; --amber:#e0900b; --amber-soft:#fff7ea; --amber-ink:#96570a;
  --green:#16a34a; --green-soft:#eafaf0; --green-ink:#0a7d38; --gold:#b7791f; --gold-soft:#fbf3d9; --gold-ink:#7c530a;
  --rail:#0b0f1c;
  --shadow:0 1px 2px rgba(13,21,38,.04),0 4px 14px rgba(13,21,38,.05);
  --shadow-lg:0 1px 2px rgba(13,21,38,.04),0 8px 26px rgba(13,21,38,.09);
  --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#0a0e18; --bg2:#0e1320; --panel:#141a28; --surface-2:#1b2231; --input-bg:#0f1524; --matrix-bg:#0f1524;
  --topbar-bg:rgba(15,20,33,.82);
  --ink:#e7ecf4; --ink2:#a6b0c1; --ink3:#6c7689;
  --line:#252d3f; --line2:#1d2433; --accent:#6f70f5; --accent2:#8b6cf6; --accent-soft:#20233f;
  --red-soft:#2c1719; --red-ink:#ff9a9a; --amber-soft:#2a2211; --amber-ink:#f3cd77;
  --green-soft:#0f2419; --green-ink:#68e3a3; --gold-soft:#241f11; --gold-ink:#e4c76b;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.4);
  --shadow-lg:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1;
}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
h1,h2,h3,h4{margin:0;font-weight:680;letter-spacing:-.01em}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ===== Shell ===== */
#app{display:flex;height:100vh;overflow:hidden}
#rail{width:240px;flex:0 0 240px;background:linear-gradient(180deg,#0d1220,#0a0e18);color:#c3ccdb;
  display:flex;flex-direction:column;height:100vh}
#rail .brand{display:flex;align-items:center;gap:11px;padding:19px 18px 17px;border-bottom:1px solid rgba(255,255,255,.06)}
#rail .brand .mark{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 12px rgba(99,102,241,.45)}
#rail .brand .logo{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em}
#rail .brand .ver{font-size:9.5px;color:#5d6a86;letter-spacing:.1em;margin-top:2px;font-weight:600}
#rail #nav{padding:14px 12px;flex:1;display:flex;flex-direction:column;gap:3px}
#rail #nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#98a3b8;
  font-size:14px;font-weight:550;cursor:pointer;position:relative;transition:.13s}
#rail #nav a .ico{display:inline-flex;opacity:.82}
#rail #nav a .ico svg{width:19px;height:19px;display:block}
#rail #nav a:hover{background:rgba(255,255,255,.05);color:#e6ebf3}
#rail #nav a.on{background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(124,92,246,.13));color:#fff}
#rail #nav a.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(#818cf8,#a78bfa)}
#rail #nav a.on .ico{opacity:1;color:#a5b4fc}
#rail .foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.06)}
#rail .lic-chip{display:flex;align-items:center;gap:7px;font-size:12px;color:#c3ccdb;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);padding:7px 10px;border-radius:8px}
#rail .lic-chip .lock{display:inline-flex;color:#6ee7b7}
#rail .lic-chip .lock svg{width:13px;height:13px}
#rail .foot-note{font-size:10.5px;color:#5d6a86;margin-top:8px;padding-left:2px}

main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{height:56px;flex:0 0 56px;background:var(--topbar-bg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20}
.tb-title{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.tb-ico{display:inline-flex;color:var(--accent)}
.tb-ico svg{width:18px;height:18px;display:block}
.tabs{display:flex;gap:3px;flex:1;overflow-x:auto;padding:0 4px}
.tabs::-webkit-scrollbar{height:0}
.tab{padding:6px 12px;border:none;background:transparent;color:var(--ink3);font-size:13px;font-weight:600;border-radius:8px;white-space:nowrap;transition:.12s}
.tab:hover{background:var(--surface-2);color:var(--ink2)}
.tb-actions{display:flex;align-items:center;gap:8px}
.tb-btn{padding:6px 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);transition:.12s}
.tb-btn:hover{border-color:var(--accent);color:var(--accent)}
.lic-chip-top{font-size:11.5px;color:var(--ink3);background:var(--surface-2);border:1px solid var(--line);padding:5px 11px;border-radius:20px;white-space:nowrap}
.scroll{flex:1;overflow-y:auto;background:var(--bg)}
.page{max-width:1000px;margin:0 auto;padding:24px 26px 40px}
.page.wide{max-width:1120px}

/* live footer bar */
#livebar{flex:0 0 auto;min-height:66px;background:linear-gradient(180deg,#111726,#0b0f1a);
  border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:stretch;box-shadow:0 -6px 22px rgba(0,0,0,.16);z-index:15}
.lb-status{display:flex;align-items:center;gap:8px;padding:0 16px 0 22px;color:#9aa6be;font-size:12px;font-weight:600;white-space:nowrap}
.pulse{width:8px;height:8px;border-radius:50%;background:#34d399;animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.lb-cells{display:flex;flex:1;overflow-x:auto}
.lb-cells::-webkit-scrollbar{height:0}
.lb-cell{padding:0 18px;border-left:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;justify-content:center;min-width:118px}
.lb-cell:first-child{border-left:none}
.lb-cell .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#7c8aa5;font-weight:600;display:flex;align-items:center;gap:5px}
.lb-cell .v{font-size:18px;font-weight:750;color:#eef2f8;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.01em}
.lb-cell .v.red{color:#ff6b6b}.lb-cell .v.amber{color:#fbbf24}.lb-cell .v.green{color:#34d399}.lb-cell .v.dim{color:#5d6a86;font-weight:600}
.lb-dot{display:inline-block;width:7px;height:7px;border-radius:50%}
.lb-cta{align-self:center;margin:0 16px;padding:10px 18px;background:linear-gradient(135deg,#6366f1,#7c5cf6);color:#fff;border:none;
  border-radius:9px;font-weight:650;font-size:13px;white-space:nowrap;box-shadow:0 3px 12px rgba(99,102,241,.4);transition:.12s}
.lb-cta:hover{filter:brightness(1.09)}
.lb-cta:disabled{background:#2a3346;color:#6b7689;box-shadow:none;cursor:not-allowed}

/* backup nudge */
#nudge{display:none;background:var(--amber-soft);border-bottom:1px solid #fde3ba;color:var(--amber-ink);
  padding:9px 24px;font-size:13px;align-items:center;gap:10px}
#nudge.show{display:flex}
#nudge b{font-weight:700}
#nudge button{margin-left:auto;background:#fff;border:1px solid #f5cf95;color:var(--amber-ink);padding:4px 12px;border-radius:7px;font-size:12px;font-weight:600}

/* generic */
.muted{color:var(--ink3)}
.hint{color:var(--ink3);font-size:12.5px;line-height:1.55}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;margin:0 0 12px}
/* 折叠区（渐进展开）*/
.collap{border:1px solid var(--line);border-radius:12px;margin:14px 0 0;overflow:hidden;background:var(--panel)}
.collap-head{display:flex;align-items:center;gap:9px;padding:12px 14px;cursor:pointer;user-select:none;font-size:15px;font-weight:700;color:var(--ink)}
.collap-head:hover{background:var(--surface-2)}
.collap-chev{display:inline-flex;transition:transform .16s ease;color:var(--ink3);font-size:12px}
.collap.open .collap-chev{transform:rotate(90deg)}
.collap-body{padding:0 14px 14px}
.btn{padding:11px 20px;border-radius:10px;border:1px solid transparent;background:linear-gradient(135deg,#5b5bf0,#7c5cf6);
  color:#fff;font-size:14px;font-weight:650;transition:filter .12s,box-shadow .12s;box-shadow:0 2px 8px rgba(91,91,240,.28)}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--panel);color:var(--ink2);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:9px}

/* home */
.hero{margin-bottom:8px}
.hero h1{font-size:25px;letter-spacing:-.02em}
.hero p{color:var(--ink2);margin:8px 0 0;font-size:14px;max-width:660px;line-height:1.6}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.groups{grid-template-columns:1fr}}
.grp{padding:16px 18px 4px}
.grp h3{font-size:12.5px;color:var(--ink2);margin-bottom:13px;font-weight:700;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.04em}
.grp h3::before{content:"";width:6px;height:6px;border-radius:2px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;color:var(--ink);font-weight:600;margin-bottom:6px}
.fld .unit{color:var(--ink3);font-weight:400;font-size:12px}
.fld input[type=number]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--input-bg);color:var(--ink);transition:border .12s,box-shadow .12s;outline:none}
.fld input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld input.err{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.fld .ref{font-size:11.5px;color:var(--ink3);margin-top:5px}
.fld .errmsg{font-size:11.5px;color:var(--red);margin-top:5px;display:none}
.fld .errmsg.show{display:block}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 12px;border:1px solid var(--line);background:var(--input-bg);border-radius:8px;font-size:13px;color:var(--ink2);font-weight:500;transition:all .12s}
.seg button:hover{border-color:var(--ink3)}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(91,91,240,.28)}
.actions{display:flex;gap:12px;margin-top:20px;align-items:center;flex-wrap:wrap}
.footnote{margin-top:22px;font-size:12px;color:var(--ink3);text-align:center}

/* dashboard */
.total-bar{background:linear-gradient(135deg,#191640,#2f2a6b 55%,#4a2f78);color:#fff;border-radius:16px;padding:22px 26px;
  margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(47,42,107,.28)}
.total-bar::after{content:"";position:absolute;right:-50px;top:-50px;width:220px;height:220px;background:radial-gradient(circle,rgba(139,92,246,.4),transparent 70%)}
.total-bar .lab{font-size:11.5px;color:#c4b5fd;font-weight:600;letter-spacing:.05em;text-transform:uppercase;position:relative}
.total-bar .big{font-size:40px;font-weight:800;letter-spacing:-.025em;margin:5px 0 9px;position:relative}
.total-bar .exp{font-size:13px;color:#c9c5ea;line-height:1.6;max-width:660px;position:relative}
.total-bar .splitbar{display:flex;height:7px;border-radius:6px;overflow:hidden;margin-top:14px;max-width:520px;position:relative}
.total-bar .splitbar span{display:block}
.total-bar .splitbar .s1{background:#f472b6}.total-bar .splitbar .s2{background:#a78bfa}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.dash-grid .span2{grid-column:1 / -1}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr}}
.dcard{overflow:hidden;transition:box-shadow .15s,border-color .15s}
.dcard:hover{box-shadow:var(--shadow-lg)}
.dcard .head{display:flex;align-items:center;gap:13px;padding:15px 18px;cursor:pointer;user-select:none}
.dcard .head .idx{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 3px 8px rgba(91,91,240,.3)}
.dcard .head .tt{flex:1;min-width:0}
.dcard .head .tt .nm{font-size:15px;font-weight:680}
.dcard .head .tt .sub{font-size:12px;color:var(--ink3);margin-top:1px}
.dcard .head .res{text-align:right}
.dcard .head .res .v{font-size:21px;font-weight:780;letter-spacing:-.01em}
.dcard .head .res .k{font-size:11px;color:var(--ink3)}
.dcard .head .chev{color:var(--ink3);transition:transform .16s;font-size:12px}
.dcard.open .head .chev{transform:rotate(90deg)}
.dcard .body{display:none;padding:0 18px 18px;border-top:1px solid var(--line2)}
.dcard.open .body{display:block}
.dcard .body .inner{padding-top:14px}
.killer{margin-top:13px;padding:11px 13px;background:var(--surface-2);border:1px solid var(--line2);border-radius:10px;font-size:12.5px;color:var(--ink2);line-height:1.6}
table.grid{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}
table.grid th,table.grid td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line2)}
table.grid th:first-child,table.grid td:first-child{text-align:left}
table.grid th{font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
table.grid td{font-variant-numeric:tabular-nums;color:var(--ink2)}
table.grid td:first-child{color:var(--ink);font-weight:500}
table.grid td.warn{color:var(--red);font-weight:600}
.compbar{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:9px 0;font-size:11px;color:#fff;font-weight:600}
.compbar .b{background:#6366f1;display:flex;align-items:center;justify-content:center}
.compbar .g{background:#f59e0b;display:flex;align-items:center;justify-content:center}
.compbar .l{background:#10b981;display:flex;align-items:center;justify-content:center}
.gates{display:flex;flex-direction:column;gap:8px;margin:13px 0}
.gate{display:flex;gap:10px;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.55;align-items:flex-start}
.gate .dot{flex:0 0 auto;font-size:13px;line-height:1.45}
.gate.red{background:var(--red-soft);color:var(--red-ink)}
.gate.amber{background:var(--amber-soft);color:var(--amber-ink)}
.gate.green{background:var(--green-soft);color:var(--green-ink)}
.gate.gold{background:var(--gold-soft);color:var(--gold-ink)}
.gate b{font-weight:700}
.gate .src{display:block;margin-top:5px;font-size:11.5px;opacity:.8}
.badge-idx{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.bi-red{background:var(--red-soft);color:var(--red-ink)}
.bi-amber{background:var(--amber-soft);color:var(--amber-ink)}
.bi-green{background:var(--green-soft);color:var(--green-ink)}
.bi-gold{background:var(--gold-soft);color:var(--gold-ink)}
.opbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.locked{position:relative}
.locked .lockable{filter:blur(8px);pointer-events:none;user-select:none;opacity:.6}
.lock-note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.lock-note .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px;max-width:440px;font-size:13px;color:var(--ink2);box-shadow:var(--shadow)}
.lock-note .box b{color:var(--ink);display:block;margin-bottom:6px}
body.mode-free .fullonly{display:none!important}

/* windtunnel */
.wt-block{margin-bottom:14px;overflow:hidden}
.wt-block .wt-head{padding:16px 20px;border-bottom:1px solid var(--line2)}
.wt-block .wt-head h3{font-size:15px}
.wt-block .wt-head p{font-size:12.5px;color:var(--ink3);margin:4px 0 0}
.wt-block .wt-body{padding:18px 20px}
.menu-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:720px){.menu-cards{grid-template-columns:1fr}}
.mc{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;position:relative;background:var(--surface-2)}
.mc.gold{border-color:#e6c667;background:var(--gold-soft)}
.mc .tier{font-size:11.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mc .q{font-size:22px;font-weight:780;margin:8px 0 2px}
.mc .b{font-size:15px;color:var(--accent);font-weight:680}
.mc .meta{font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.5}
.mc .lockicon{position:absolute;top:10px;right:12px}
.inrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px}
.inrow .fld{margin-bottom:0;flex:1;min-width:130px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;font-size:13px;cursor:pointer;transition:.12s}
.chk:hover{border-color:var(--ink3)}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{width:32px;height:32px;background:var(--input-bg);border:none;font-size:16px;color:var(--ink2)}
.stepper button:hover{background:var(--line2)}
.stepper span{width:42px;text-align:center;font-weight:600}
.leak-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.leak-tbl th,.leak-tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
.leak-tbl th{font-size:11.5px;color:var(--ink3);text-transform:uppercase}
.empty-state{text-align:center;padding:56px 24px;color:var(--ink3)}
.empty-state .ic{font-size:32px;margin-bottom:10px}

/* data & settings */
.list-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.list-row:last-child{border-bottom:none}
.list-row .info{flex:1;min-width:0}
.list-row .info .t{font-weight:600;font-size:14px}
.list-row .info .s{font-size:12px;color:var(--ink3)}
.matrix{overflow-x:auto}
.matrix table{border-collapse:collapse;font-size:13px;min-width:100%}
.matrix th,.matrix td{padding:6px 8px;border:1px solid var(--line2);text-align:center}
.matrix th{background:var(--surface-2);font-size:12px;color:var(--ink2);font-weight:600}
.matrix input{width:74px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;background:var(--matrix-bg);color:var(--ink)}
.matrix input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.matrix .sub{font-size:11px;color:var(--ink3)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

<script>
"use strict";
/* ============================================================================
   0. 构建模式与授权署名（公约【8】【11】）
   ========================================================================== */
const BUILD_MODE = 'full';            // 'free' | 'full' —— 同一代码，两个常量，双构建
const AUTHORIZED_CLIENT = '演示授权';  // 授-1 署名可见（页眉 + 打印页脚）
if(BUILD_MODE==='free') document.body.classList.add('mode-free');

/* ============================================================================
   1. 全局兜底（公约【3】）与工具
   ========================================================================== */
function safeDiv(a,b){ return (b===0||b==null||a==null)?null:a/b; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function roundTo(v,step){ return Math.round(v/step)*step; }
function roundYuanFen(fen){ return Math.round(fen/100)*100; } // 四舍五入到元（分单位）

// 日期：一律显式传参（公约 C-14）。Date.UTC 为确定性构造，不读系统时钟。
function dateNum(s){ const [y,m,d]=s.split('-').map(Number); return Math.floor(Date.UTC(y,m-1,d)/864e5); }
function numDate(n){ const dt=new Date(n*864e5);
  return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`; }
function daysBetween(a,b){ return dateNum(b)-dateNum(a); }      // b - a
function subDays(s,d){ return numDate(dateNum(s)-d); }
function firstDay(y,m){ return `${y}-${String(m).padStart(2,'0')}-01`; }

// 展示层格式（舍入只在展示层）
function yuan(fen){ return '¥'+Math.round(fen/100).toLocaleString('en-US'); }
function wan(fen){ return (fen/1e6).toFixed(1)+'万'; }
function pct(rate){ return rate==null?'—':(rate*100).toFixed(1)+'%'; }
const DASH='—';

/* ============================================================================
   2. 系数总表（公约§5 + 件二 2.4 权威清单）· 分/元/比率见注
   ========================================================================== */
const COEFFICIENTS = {
  cityBase:{tier1:500000,tier2:400000,tier34:300000},                 // 分/月
  levelMultiplier:{ sales:[1.0,1.5,1.8,2.0], manager:[2.0,2.5,3.0,3.5], executive:[3.0,4.0,4.5,5.0] }, // [warning,effective,efficient,leading]
  cycleFactor:{short:1.0000,regular:1.1500,midLong:1.3225,long:1.5606,ultraLong:2.0000},
  thresholdTTable:{ // 元/月（序=[warning,effective,efficient,leading]）
    tier1:{sales:[25000,30000,35000,40000],manager:[33000,40000,47000,54000],executive:[45000,54000,63000,72000]},
    tier2:{sales:[20000,24000,28000,32000],manager:[27000,32000,37000,43000],executive:[36000,43000,50000,57000]},
    tier34:{sales:[15000,18000,21000,24000],manager:[20000,24000,28000,32000],executive:[27000,32000,38000,43000]} },
  minWageTable:{tier1:242000,tier2:200000,tier34:170000},             // 分/月（2025 人社部保守下限）
  longTermRate:0.10,
  rampCurve12:{ // 全系统唯一 S 曲线（12 点月度产能%；1-indexed 于公式）
    short:   [0,12,25,42,60,73,85,93,100,100,100,100],
    regular: [0, 5,12,22,35,48,60,72, 82, 90, 96,100],
    midLong: [0, 0, 5,12,20,30,42,53, 63, 72, 80, 87],
    long:    [0, 0, 0, 5,10,18,27,36, 45, 54, 62, 70],
    ultraLong:[0,0, 0, 0, 5,10,16,23, 30, 37, 44, 50] },
  fullRampRatio:{smb:0.70,mid:0.67,ent:0.63,strategic:0.60},
  globalAttainRate:[0.43,0.51],
  turnoverCostOteRate:[1.5,2.0],
  recruitFeeDefaultAmt:500000,                                        // 分
  spanDefault:{manageTimeShare:0.30,weeklyHrs:40},
  fixedMeetingHrs:3, perHeadMgmtHrs:1.1, perHeadAdminHrs:0.6,
  midYearAttritionFactor:0.5,                                         // C-14 kEff
  socialCostRate:0.30,
  teamBonusTIS:{w:[0.4,0.3,0.3],sizeFull:8,sizeZero:20,complementEnum:{solo:0,partial:50,chained:100},green:70,red:40},
  burdenBand:[0.25,0.35],
  menuQuotaSteps:[0.8,1.0,1.2], menuAttainMid:0.47, menuAttainSlope:0.75,
  menuEquivalenceTolerance:0.03, menuRound:10000,                     // 10000 分 = 100 元
  p90ColdFactor:1.8,
  attainabilityRedline:1.3, hungerBufferRate:1.1,
  processRedlineWarnCount:3,
  SEGMENT_MAP:{short:'smb',regular:'smb',midLong:'mid',long:'ent',ultraLong:'strategic'}
};

/* ---- getCoef：结构权系统 / 数值权老板（Override）。全部计算只经此读取 ---- */
const OV_KEY='skab_dingjia_overrides';
let _overrides = loadJSON(OV_KEY,{});
let _resolved=null;
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function setDeep(obj,path,val){ const ks=path.split('.'); let o=obj;
  for(let i=0;i<ks.length-1;i++){ const k=/^\d+$/.test(ks[i])?+ks[i]:ks[i]; o=o[k]; }
  const last=ks[ks.length-1]; o[/^\d+$/.test(last)?+last:last]=val; }
function getDeep(obj,path){ const ks=path.split('.'); let o=obj;
  for(const k of ks){ if(o==null)return undefined; o=o[/^\d+$/.test(k)?+k:k]; } return o; }
function resolvedCoef(){ if(_resolved)return _resolved; const r=deepClone(COEFFICIENTS);
  for(const p in _overrides){ try{ setDeep(r,p,_overrides[p]); }catch(e){} } _resolved=r; return r; }
function getCoef(path){ return getDeep(resolvedCoef(),path); }
function setOverride(path,val){ _overrides[path]=val; _resolved=null; saveJSON(OV_KEY,_overrides); }
function clearOverrides(){ _overrides={}; _resolved=null; saveJSON(OV_KEY,_overrides); }

/* ---- StorageAdapter（v1 落 localStorage，预留 IndexedDB 切换位）---- */
const PREFIX='skab_dingjia_';
function loadJSON(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function genId(pre){ return `${pre}_${Date.now()}_${Math.random().toString(36).slice(2,6)}`; }
function genCovCode(){ const d=new Date(); const yy=String(d.getFullYear()).slice(2),
  mm=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  const r=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
  return `SK-${yy}${mm}${dd}-${r}`; }

/* ============================================================================
   3. 函数库（纯函数；对拍算例即验收）· 计算顺序 B→D→A→C→E→合计
   ========================================================================== */
const GRADE_IDX={effective:1,efficient:2,leading:3};
function gradeIndex(g){ return GRADE_IDX[g]!=null?GRADE_IDX[g]:1; }

// §4.7 头部和口径（C-04/C-06）；数组 1-indexed，m=1 时=全曲线，k(1) 不变
function newHireYearRate(cycle,m){ const arr=getCoef('rampCurve12.'+cycle);
  const upper=13-m; let s=0; for(let pos=1;pos<=upper&&pos<=12;pos++) s+=arr[pos-1]; return s/12/100; }
function calcRamp80(cycle){ const arr=getCoef('rampCurve12.'+cycle);
  for(let pos=1;pos<=12;pos++) if(arr[pos-1]>=80) return pos; return 12; } // fallback 封顶12

// F-00
function validateInputs(inp){
  const errors=[];
  const req=(f,label,cond,txt)=>{ const v=inp[f];
    if(v==null||v===''||Number.isNaN(v)||!cond(v)) errors.push({field:f,label,text:txt}); };
  const num=(f,label,min,max)=>req(f,label,v=>typeof v==='number'&&v>=min&&(max==null||v<=max),`需为 ${min}~${max==null?'∞':max}`);
  ['cityTier','cycleTier','tierGrade','complementLevel','attributableLevel'].forEach(f=>{
    if(!inp[f]) errors.push({field:f,label:LABELS[f],text:'请选择'}); });
  num('targetPersonalMonthlyGrossAmt',LABELS.targetPersonalMonthlyGrossAmt,1,null);
  num('nextYearTargetGrossAmt',LABELS.nextYearTargetGrossAmt,1,null);
  num('lastYearPerCapitaGrossAmt',LABELS.lastYearPerCapitaGrossAmt,1,null);
  num('salesCount',LABELS.salesCount,0,null);
  num('managerCount',LABELS.managerCount,0,null);
  req('attritionRate',LABELS.attritionRate,v=>v>=0&&v<=0.9,'0~0.9');
  num('hiringCycleDays',LABELS.hiringCycleDays,1,365);
  req('blendedMarginRate',LABELS.blendedMarginRate,v=>v>=0.01&&v<=0.95,'0.01~0.95');
  return {ok:errors.length===0,errors};
}

// 账单B（六步链，与 2号招人器 F1 同款；today/targetYear 注入）
function calcCardB(inp,today,targetYear){
  const cyc=inp.cycleTier,I5=inp.nextYearTargetGrossAmt,I6=inp.lastYearPerCapitaGrossAmt,
        I7=inp.salesCount,I9=inp.attritionRate,I10=inp.hiringCycleDays;
  if(!I6){ return {ok:false}; }
  const midF=getCoef('midYearAttritionFactor');
  const kEff=m=>newHireYearRate(cyc,m)*(1-I9*midF);
  const k1=newHireYearRate(cyc,1), kEff1=kEff(1);
  const fullCap=I5/I6;                                    // ① 满产当量
  const S1=Math.max(0,Math.ceil(fullCap)-I7);            // 天真
  const expAttr=I7*I9;                                   // ③ 预期流失（全额计入缺口）
  const gapCap=fullCap-I7+expAttr;                       // ④ 缺口当量
  const S6=Math.max(0,Math.ceil(safeDiv(gapCap,kEff1))); // 真实
  const overRate=safeDiv(S6-S1,S6);
  const exposeAmt=Math.max(0,(gapCap-S1*kEff1)*I6);
  const totalHeadTarget=I7+S6;
  let latestMonth=null;
  for(let m=12;m>=1;m--){ if(kEff(m)*S6>=gapCap){ latestMonth=m; break; } }
  let latestHire=null,isLate=false,lateDays=0;
  if(latestMonth){ latestHire=subDays(firstDay(targetYear,latestMonth),I10);
    lateDays=daysBetween(latestHire,today); isLate=lateDays>0; }
  const seg=getCoef('SEGMENT_MAP.'+cyc), frr=getCoef('fullRampRatio.'+seg);
  const stretch = safeDiv(I5,totalHeadTarget)!=null && safeDiv(I5,totalHeadTarget) > (I6/frr)*1.2;
  return {ok:true,k1,kEff1,S1,fullCap,expAttr,gapCap,S6,overRate,exposeAmt,
    totalHeadTarget,latestMonth,latestHire,isLate,lateDays,ramp80:calcRamp80(cyc),targetYear,stretch};
}

// 账单D
function calcCardD(inp,totalHeadTarget){
  const I8=inp.managerCount;
  const availH=getCoef('spanDefault.weeklyHrs')*getCoef('spanDefault.manageTimeShare')-getCoef('fixedMeetingHrs');
  const spanCap=Math.floor(availH/getCoef('perHeadMgmtHrs'));
  const heads=(totalHeadTarget!=null)?totalHeadTarget:inp.salesCount;
  const managerNeeded=Math.ceil(safeDiv(heads,spanCap));
  const gap=Math.max(0,managerNeeded-I8);
  const curSpan=safeDiv(heads,Math.max(I8,1));
  const coachMin=Math.round(Math.max(0,availH-heads*getCoef('perHeadAdminHrs'))/heads*60);
  return {availH,spanCap,heads,managerNeeded,gap,curSpan,coachMin};
}

// 账单A（三层全链 + 六道闸）
function calcCardA(inp,managerNeeded,totalHeadTarget){
  const I1=inp.cityTier,I2=inp.cycleTier,grade=inp.tierGrade,I4=inp.targetPersonalMonthlyGrossAmt,
        I5=inp.nextYearTargetGrossAmt,I11=inp.blendedMarginRate;
  const gi=gradeIndex(grade),gmi=gradeIndex(inp.mgrGrade),cityB=getCoef('cityBase.'+I1),cf=getCoef('cycleFactor.'+I2),
        social=getCoef('socialCostRate'),ltr=getCoef('longTermRate'),minW=getCoef('minWageTable.'+I1);
  const Bof=(lv,idx)=>roundYuanFen(cityB*getCoef('levelMultiplier.'+lv)[idx]*cf);
  const Tof=(lv,idx)=>getCoef('thresholdTTable.'+I1+'.'+lv)[idx]*100; // 元→分
  const Gof=lv=> lv==='sales'?I4 : lv==='manager'?safeDiv(I5,12*Math.max(managerNeeded,1)) : I5/12;
  const layers=['sales','manager','executive'];
  const count={sales:totalHeadTarget,manager:managerNeeded,executive:1};
  const rows=layers.map(lv=>{
    const idx=lv==='sales'?gi:gmi, B=Bof(lv,idx),T=Tof(lv,idx),G=Gof(lv);
    const longAmt=Math.round(T*ltr), gapAmt=Math.round(T*(1-ltr))-B;
    const blocked=B>=T*(1-ltr), r=blocked?null:safeDiv(gapAmt,G);
    const belowMinWage=B<minW, floatShare=safeDiv(gapAmt,T);
    return {level:lv,B,T,G,longAmt,gapAmt,blocked,r,belowMinWage,floatShare,count:count[lv]};
  });
  const sales=rows[0], Bwarn=Bof('sales',0), Twarn=Tof('sales',0);
  const goodHire=Math.min(sales.B/Bwarn, sales.T/Twarn);
  const comp=ratio3(sales.B,sales.gapAmt,sales.longAmt);
  const burdenNum=rows.reduce((s,r)=>s+(r.count||0)*r.gapAmt*12,0);
  const burdenRate=safeDiv(burdenNum,I5);
  const fullNum=rows.reduce((s,r)=>s+(r.count||0)*(Math.round(r.B*(1+social))+r.gapAmt+r.longAmt)*12,0);
  const fullBurden=safeDiv(fullNum,I5), fullRev=fullBurden!=null?fullBurden*I11:null;
  // 闸
  const gates=[];
  const anyBlocked=rows.some(r=>r.blocked);
  if(anyBlocked) gates.push({id:1,light:'red',code:'W-02',row:rows.find(r=>r.blocked)});
  if(I11<0.20) gates.push({id:2,light:'red',code:'W-01'});
  if(sales.B<Bwarn) gates.push({id:3,light:'red',code:'W-03'});
  if(sales.floatShare!=null&&sales.floatShare>=0.65) gates.push({id:4,light:'amber',code:'W-04'});
  if(burdenRate!=null){ if(burdenRate>0.35) gates.push({id:5,light:'red',code:'W-05'});
    else if(burdenRate<0.25) gates.push({id:5,light:'amber',code:'W-06'});
    else gates.push({id:5,light:'green',code:'ok'}); }
  rows.forEach(r=>{ if(r.belowMinWage) gates.push({id:6,light:'red',code:'W-29',row:r,minW}); });
  return {rows,sales,Bwarn,Twarn,goodHire,comp,burdenRate,fullBurden,fullRev,marginRate:I11,
    hungerBait:sales.B<Bwarn,gates,anyBlocked};
}
function ratio3(a,b,c){ const t=a+b+c; if(t<=0)return[0,0,0];
  let x=[Math.round(a/t*100),Math.round(b/t*100),Math.round(c/t*100)];
  const diff=100-(x[0]+x[1]+x[2]); x[1]+=diff; return x; }

// 账单C
function calcCardC(inp){
  const I1=inp.cityTier,I2=inp.cycleTier,I6=inp.lastYearPerCapitaGrossAmt,
        I7=inp.salesCount,I9=inp.attritionRate,I10=inp.hiringCycleDays;
  const monthPer=I6/12, idle=monthPer*I10/30, arr=getCoef('rampCurve12.'+I2);
  let sumGap=0; for(let pos=1;pos<=12;pos++) sumGap+=(1-arr[pos-1]/100);
  const rampGap=monthPer*sumGap, recruitFee=getCoef('recruitFeeDefaultAmt'), tag=idle+rampGap+recruitFee;
  const Tsales=getCoef('thresholdTTable.'+I1+'.sales')[1]*100; // effective
  const oteLow=Tsales*12*getCoef('turnoverCostOteRate')[0], oteHigh=Tsales*12*getCoef('turnoverCostOteRate')[1];
  const annual=tag*I7*I9;
  return {idle,rampGap,recruitFee,tag,oteLow,oteHigh,annual,sumGap};
}
// 账单E
function calcCardE(inp){
  const I7=inp.salesCount,I12=inp.complementLevel,I13=inp.attributableLevel,tis=getCoef('teamBonusTIS');
  const sizeScore=100*clamp(1-(I7-tis.sizeFull)/(tis.sizeZero-tis.sizeFull),0,1);
  const compScore=tis.complementEnum[I12], visScore={no:0,partial:50,yes:100}[I13];
  const TIS=tis.w[0]*sizeScore+tis.w[1]*compScore+tis.w[2]*visScore;
  const light=TIS>=tis.green?'green':(TIS>=tis.red?'amber':'red');
  return {sizeScore,compScore,visScore,TIS,light};
}
// 合计
function calcTotalLine(B,C){ return {total:(C?C.annual:0)+(B?B.exposeAmt:0),annual:C?C.annual:0,expose:B?B.exposeAmt:0}; }

/* 风洞 */
function generateMenu(baseQuotaAmt,baseBonusAmt,gate3Active){
  if(gate3Active) return {blocked:true,code:'W-19'};
  if(!(baseQuotaAmt>0)||!(baseBonusAmt>0)) return null;
  const steps=getCoef('menuQuotaSteps'),mid=getCoef('menuAttainMid'),slope=getCoef('menuAttainSlope'),
        round=getCoef('menuRound'),E=mid*baseBonusAmt,P=x=>clamp(mid+slope*(1-x),0.05,0.95);
  let tiers=steps.map(x=>{ const quota=baseQuotaAmt*x; let bonus=roundTo(E/P(x),round);
    return {x,quota,bonus,P:P(x)}; });
  // 校验二（激励相容）：bonus/quota 严格递增；低档违反→下调（脚注 W-28）
  let adjusted=false;
  for(let i=1;i<tiers.length;i++){ if(tiers[i].bonus/tiers[i].quota<=tiers[i-1].bonus/tiers[i-1].quota){
    tiers[i-1].bonus=roundTo(0.98*(tiers[i].bonus/tiers[i].quota)*tiers[i-1].quota,round); adjusted=true; } }
  tiers=tiers.map(t=>({...t,unitReturn:t.bonus/t.quota,dev:Math.abs(t.P*t.bonus-E)/E}));
  return {tiers,E,adjusted};
}
function gateFraudRisk(audit,inp,env){
  const I1=inp.cityTier,I2=inp.cycleTier,I5=inp.nextYearTargetGrossAmt,I6=inp.lastYearPerCapitaGrossAmt,I7=inp.salesCount;
  const p90Eff=(env&&env.realP90Factor!=null)?env.realP90Factor:getCoef('p90ColdFactor');
  const ratioCur=safeDiv(safeDiv(I5,I7),I6*p90Eff);
  const Bwarn=roundYuanFen(getCoef('cityBase.'+I1)*getCoef('levelMultiplier.sales')[0]*getCoef('cycleFactor.'+I2));
  const hunger=audit.currentBaseSalaryAmt<Bwarn*getCoef('hungerBufferRate');
  const rl=getCoef('attainabilityRedline'); let light,code;
  if(ratioCur!=null&&ratioCur>rl&&hunger){light='red';code='W-20';}
  else if(ratioCur!=null&&ratioCur>rl&&!hunger){light='amber';code='W-20b';}
  else {light='green';code='ok';}
  return {p90Eff,ratioCur,Bwarn,hunger,light,code};
}

   ========================================================================== */
// 老板通常只知道「回款额」、不知道「毛利额」——故三项金额按回款填写；
// 但一切账单/提成一律按毛利口径计（本系统铁律），此处用综合毛利率折算：毛利 = 回款 × 毛利率。
const RECEIPT_TO_GROSS=['targetPersonalMonthlyGrossAmt','nextYearTargetGrossAmt','lastYearPerCapitaGrossAmt'];
function resolveInputs(raw){
  const r=raw.blendedMarginRate;
  if(r==null||isNaN(r)||r<=0) return raw;      // 毛利率未填时不折算，交给校验拦截
  const o={...raw};
  RECEIPT_TO_GROSS.forEach(k=>{ if(o[k]!=null&&!isNaN(o[k])) o[k]=o[k]*r; });
  return o;
}
function compute(today){
  const v=validateInputs(app.inputs);
  app.errors={}; v.errors.forEach(e=>app.errors[e.field]=e.text);
  if(!v.ok){ app.results=null; return false; }
  const ty=currentTargetYear();
  const I=resolveInputs(app.inputs);           // 回款→毛利折算后供内部计算
  const B=calcCardB(I,today,ty);
  const D=calcCardD(I,B.ok?B.totalHeadTarget:null);
  const A=calcCardA(I,D.managerNeeded,B.ok?B.totalHeadTarget:I.salesCount);
  const C=calcCardC(I);
  const E=calcCardE(I);
  const total=calcTotalLine(B,C);
  app.results={A,B,C,D,E,total};
  return true;
}

const PAL_ACTIONS=[
  ['输入面板','页面','input',()=>nav('home')],
  ['五张账单','页面','dash',()=>{ app.results=liveResults(REAL_TODAY); nav('dash'); }],

  ['恢复出厂系数','操作','settings',()=>{ if(confirm('清空所有覆盖，恢复出厂系数？')){ clearOverrides(); if(app.results&&app.results.A)compute(REAL_TODAY); render(); toast('已恢复出厂'); } }]
];
let palSel=0, palFiltered=[];
function openPalette(){ $('#palette').classList.add('open'); const i=$('#palInput'); i.value=''; palFilter(''); setTimeout(()=>i.focus(),0); }
function closePalette(){ $('#palette').classList.remove('open'); }
function palOpen(){ return $('#palette').classList.contains('open'); }
function palFilter(q){ q=(q||'').trim().toLowerCase();
  palFiltered=PAL_ACTIONS.filter(a=>!q||a[0].toLowerCase().includes(q)||a[1].includes(q)); palSel=0; palRender(); }
function palRender(){ const list=$('#palList');
  if(!palFiltered.length){ list.innerHTML='<div class="pal-empty">没有匹配的命令</div>'; return; }
  list.innerHTML=palFiltered.map((a,i)=>`<div class="pal-item${i===palSel?' sel':''}" data-i="${i}"><span class="pi-ico">${ICON(a[2],16)}</span>${a[0]}<span class="pi-cat">${a[1]}</span></div>`).join('');
  list.querySelectorAll('.pal-item').forEach(it=>{ it.onmousemove=()=>{ if(palSel!==+it.dataset.i){palSel=+it.dataset.i; palRender();} }; it.onclick=()=>palRun(+it.dataset.i); });
  const sel=list.querySelector('.pal-item.sel'); if(sel) sel.scrollIntoView({block:'nearest'}); }
function palRun(i){ const a=palFiltered[i]; if(!a)return; closePalette(); a[3](); }
function onKey(e){
  if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); palOpen()?closePalette():openPalette(); return; }
  if(palOpen()){
    if(e.key==='Escape'){ closePalette(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); palSel=Math.min(palFiltered.length-1,palSel+1); palRender(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); palSel=Math.max(0,palSel-1); palRender(); }
    else if(e.key==='Enter'){ e.preventDefault(); palRun(palSel); }
    return;
  }
  if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')) return;
  if(e.key>='1'&&e.key<='5'){ nav(['home','dash','wt','data','settings'][+e.key-1]); }
  else if(e.key==='t'||e.key==='T'){ toggleTheme(); }
  else if(e.key==='d'||e.key==='D'){ fillDemo(); }
  else if(e.key==='?'){ toast('快捷键：1–5 切换页面 · '+(IS_MAC?'⌘':'Ctrl')+'K 命令面板 · T 主题 · D 示例数据'); }
}

/* ---- 迷你数据可视化：meter / sparkline / count-up ---- */
function meterBar(fillPct,color,bandFrom,bandTo){
  let h='<div class="meter">';
  if(bandFrom!=null) h+=`<span class="band" style="left:${bandFrom*100}%;width:${(bandTo-bandFrom)*100}%"></span>`;
  h+=`<span class="mf" style="width:${clamp(fillPct,0,1)*100}%;background:${color}"></span></div>`;
  return h;
}
function sparkline(points,mark){
  const n=points.length,w=100,h=40,pts=points.map((v,i)=>`${(i/(n-1))*w},${(h-(v/100)*h).toFixed(2)}`).join(' ');
  const area=`0,${h} ${pts} ${w},${h}`;
  const mx=mark!=null?((mark-1)/(n-1))*w:null;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".26"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#sg)"/>
    ${mx!=null?`<line x1="${mx.toFixed(2)}" y1="0" x2="${mx.toFixed(2)}" y2="${h}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>`:''}
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
function animateWan(elm,targetFen){ if(!elm||typeof performance==='undefined'){ if(elm)elm.textContent=wan(targetFen); return; }
  const dur=650,t0=performance.now();
  function step(t){ const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3); elm.textContent=wan(targetFen*e); if(p<1)requestAnimationFrame(step); }
  requestAnimationFrame(step); }
function lbMeter(fillPct,color){ return `<div class="lb-meter"><i style="width:${clamp(fillPct,0,1)*100}%;background:${color}"></i></div>`; }

/* ---- 实时结果（局部计算，footer 用；不写 app.results，不打断输入焦点）---- */
function liveResults(today){
  const I=resolveInputs(app.inputs),R={};
  const ok=(...fs)=>fs.every(f=>{const v=I[f]; return v!=null&&v!==''&&!(typeof v==='number'&&isNaN(v));});
  try{ if(ok('cityTier','cycleTier','nextYearTargetGrossAmt','lastYearPerCapitaGrossAmt','blendedMarginRate','salesCount','attritionRate','hiringCycleDays')&&I.lastYearPerCapitaGrossAmt>0){
    const b=calcCardB(I,today,currentTargetYear()); if(b.ok)R.B=b; } }catch(e){}
  try{ if(R.B||I.salesCount!=null) R.D=calcCardD(I,R.B?R.B.totalHeadTarget:I.salesCount); }catch(e){}
  try{ if(ok('cityTier','cycleTier','tierGrade','targetPersonalMonthlyGrossAmt','nextYearTargetGrossAmt','blendedMarginRate')&&I.targetPersonalMonthlyGrossAmt>0){
    R.A=calcCardA(I,R.D?R.D.managerNeeded:1,R.B?R.B.totalHeadTarget:(I.salesCount!=null?I.salesCount:1)); } }catch(e){}
  try{ if(ok('cityTier','cycleTier','lastYearPerCapitaGrossAmt','blendedMarginRate','salesCount','attritionRate','hiringCycleDays')&&I.lastYearPerCapitaGrossAmt>0) R.C=calcCardC(I); }catch(e){}
  try{ if(ok('salesCount','complementLevel','attributableLevel')) R.E=calcCardE(I); }catch(e){}
  if(R.B||R.C) R.total=calcTotalLine(R.B||null,R.C||null);
  return R;
}
function updateFooter(){
  const cells=$('#lbCells'); if(!cells)return;
  const R=liveResults(REAL_TODAY);
  const col=c=>c==='red'?'#ff6b6b':c==='amber'?'#fbbf24':c==='green'?'#34d399':'#5d6a86';
  const bCls=R.A&&R.A.burdenRate!=null?(R.A.burdenRate>0.35?'red':R.A.burdenRate<0.25?'amber':'green'):'dim';
  const eCls=R.E?(R.E.light==='green'?'green':R.E.light==='amber'?'amber':'red'):'dim';
  const dGap=R.D&&R.D.gap!=null&&!isNaN(R.D.gap);
  const cell=(k,cls,v,meter)=>`<div class="lb-cell"><div class="k">${k}</div><div class="${cls}">${v}</div>${meter||''}</div>`;
  let h='';
  h+=cell('今年漏损', R.total?'v red':'v dim', R.total?wan(R.total.total):'—');
  h+=cell('该招人数', R.B?'v':'v dim', R.B?R.B.S6+' 人':'—');
  h+=cell('销售提成率', R.A?'v':'v dim', R.A?(R.A.sales.r!=null?pct(R.A.sales.r):'—'):'—');
  h+=cell('主管缺口', dGap?'v':'v dim', dGap?R.D.gap+' 人':'—');
  h+=cell('全链负担', R.A&&R.A.burdenRate!=null?('v '+bCls):'v dim', R.A&&R.A.burdenRate!=null?pct(R.A.burdenRate):'—',
    R.A&&R.A.burdenRate!=null?lbMeter(R.A.burdenRate/0.5,col(bCls)):'');
  h+=cell('团队奖 TIS', R.E?('v '+eCls):'v dim', R.E?R.E.TIS.toFixed(0):'—', R.E?lbMeter(R.E.TIS/100,col(eCls)):'');
  cells.innerHTML=h;
  const cta=$('#lbCta'), ready=!!(R.A||R.B); cta.disabled=!ready; cta.textContent=ready?'查看五张账单 →':'填数据即出结果';
}
function renderNudge(){
  const last=loadJSON(PREFIX+'last_export',null); const n=$('#nudge');
  const nudgeDays=14, hasData=listScenarios().length>0||listCovenants().length>0;
  let stale=null; if(last) stale=daysBetween(last,REAL_TODAY);
  if(hasData && (!last || (stale!=null&&stale>nudgeDays))){
    n.classList.add('show');
    $('#nudgeText').innerHTML = last
      ? `你已 <b>${stale}</b> 天没备份数据了——导出一份信封 JSON，只要 10 秒。`
      : `数据只在你这台电脑上——导出一份信封 JSON 备份，只要 10 秒。`;
  } else n.classList.remove('show');
}

function tierTable(){

  const cityB=getCoef('cityBase.'+I1), cf=getCoef('cycleFactor.'+I2);
  const Bof=(lv,idx)=>roundYuanFen(cityB*getCoef('levelMultiplier.'+lv)[idx]*cf);
  const Tof=(lv,idx)=>getCoef('thresholdTTable.'+I1+'.'+lv)[idx]*100;
  const cityLab=ENUMS.cityTier.find(x=>x[0]===I1)[1], cycLab=ENUMS.cycleTier.find(x=>x[0]===I2)[1];

  ['effective','efficient','leading'].forEach(g=>{ const idx=gradeIndex(g), sel=app.inputs.tierGrade===g;

    tr.innerHTML=`<td><b>销售·${GRADE_SHORT[g]}</b><span class="gt">（${GRADE_TECH[g]}）</span></td>
      <td class="mono">${yuan(Bof('sales',idx))}</td><td class="mono">${yuan(Tof('sales',idx))}</td><td class="gd">${GRADE_DESC[g]}</td>`;
    tr.onclick=()=>{ app.inputs.tierGrade=g; app.gradeBaseInput=null; if(app.results)compute(REAL_TODAY); render(); };
    tbl.appendChild(tr); });
  wrap.appendChild(tbl);
  // 自定义（反查的是销售档）——紧跟销售档表底下
  const custom=el('div','grade-custom');
  custom.innerHTML=`<label>不确定选哪档？直接输入你现在给销售的月底薪，系统帮你反查</label>

    <span id="gBaseOut"></span>`;
  wrap.appendChild(custom);
  // 主管/高管——配套参考，做成可收可展（默认收起，密度更高）
  const {section:mgrSec, body:mgrBody}=collapsible('tier.mgr',
    `<span class="collap-chev">▸</span><span class="n">2</span> 主管 / 高管档位 <span class="lh">（管理层单独定档，点此展开 / 收起）</span>`, false);
  const mgrCur=app.inputs.mgrGrade||'effective';
  const mgrSeg=el('div','seg'); mgrSeg.style.margin='2px 0 10px';
  [['effective','有效'],['efficient','高效'],['leading','领先']].forEach(([g,lab])=>{

    b.onclick=()=>{ app.inputs.mgrGrade=g; if(app.results)compute(REAL_TODAY); render(); };
    mgrSeg.appendChild(b); });

function segInto(sel,enumKey,auditKey){ const host=$(sel); if(!host)return; host.innerHTML='';

function refreshGates(){ const out=$('#gateOut'); if(!out||!app.results)return; out.innerHTML='';

function wtSandbox(free){
  const c=el('div','card wt-block');
  c.appendChild(el('div','wt-head','<h3>④ 漏水导流沙盘</h3><p>你堵一个洞，水就从别处漏。选一个付得起的出口，让它可见、可归因。</p>'));
  const b=el('div','wt-body');
  const grid=el('div',null,'');
  CONTROLS.forEach(([v,l])=>{ const chk=el('label','chk');
    chk.innerHTML=`<input type="checkbox" data-m="${v}" ${app.audit.controlMeasures.includes(v)?'checked':''}><span>${l}</span>`;
    grid.appendChild(chk); });
  b.appendChild(grid);
  const out=el('div',null,''); b.appendChild(out);
  const renderLeak=()=>{ out.innerHTML='';
    const rows=leakSandbox(app.audit.controlMeasures);
    if(rows.length===0){ out.appendChild(el('div','gate green',`<span class="dot">💧</span><div>${W_TEXT['W-26']()}</div>`)); return; }
    const t=el('table','leak-tbl');
    t.innerHTML=`<tr><th>控制手段</th><th>泄漏出口</th><th>出口价格</th><th>认领监测</th></tr>`+
      rows.map(r=>`<tr><td>${labelOf(r.measure)}</td><td>${r.exit}</td><td>${r.price}</td>
        <td><label class="chk" style="margin:0;padding:5px 8px"><input type="checkbox" data-claim="${r.measure}" ${app.audit.claimedOutlets.includes(r.measure)?'checked':''}><span style="font-size:12px">${r.watch}</span></label></td></tr>`).join('');
    out.appendChild(t);
    out.appendChild(el('div','gate amber',`<span class="dot">🚰</span><div>${W_TEXT['W-25']({n:rows.length})}</div>`));
    out.querySelectorAll('[data-claim]').forEach(x=>x.onchange=()=>{ const m=x.dataset.claim;
      if(x.checked){ if(!app.audit.claimedOutlets.includes(m)) app.audit.claimedOutlets.push(m); }
      else app.audit.claimedOutlets=app.audit.claimedOutlets.filter(y=>y!==m); toast('监测清单已更新'); }); };
  grid.querySelectorAll('[data-m]').forEach(x=>x.onchange=()=>{ const m=x.dataset.m;
    if(x.checked){ if(!app.audit.controlMeasures.includes(m)) app.audit.controlMeasures.push(m); }
    else { app.audit.controlMeasures=app.audit.controlMeasures.filter(y=>y!==m); app.audit.claimedOutlets=app.audit.claimedOutlets.filter(y=>y!==m); }
    renderLeak(); });
  renderLeak();
  c.appendChild(b);
  return lockAll(c,free);
}
function labelOf(v){ const f=CONTROLS.find(x=>x[0]===v); return f?f[1]:v; }
function lockAll(node,free){ if(!free)return node; return lockWrap(node.querySelector('.wt-body')?node:node,free); }

  sc.appendChild(el('div',null,'<div style="padding:16px 18px;border-bottom:1px solid var(--line2)"><h3 style="font-size:15px">已保存场景</h3></div>'));

    const load=el('button','btn ghost sm','载入'); load.onclick=()=>{ loadScenario(s.scenarioId); compute(REAL_TODAY); nav('dash'); toast('已载入并重算'); };
    const del=el('button','btn ghost sm','删除'); del.onclick=()=>{ if(confirm('删除该场景？')){ deleteScenario(s.scenarioId); render(); } };
    r.appendChild(load); r.appendChild(del); sc.appendChild(r); });
  p.appendChild(sc);

  env.appendChild(el('div',null,'<div style="padding:16px 18px;border-bottom:1px solid var(--line2)"><h3 style="font-size:15px">数据信封（导入 / 导出）</h3><p class="hint" style="margin-top:4px">跨板块交换用 skab_v1 信封 JSON。导出功能永不锁定（授-2）。</p></div>'));
  const eb=el('div',null,''); eb.style.padding='16px 18px';
  const exp=el('button','btn sm','导出信封 JSON'); exp.onclick=exportEnvelope;
  const imp=el('button','btn ghost sm','导入信封 JSON'); imp.style.marginLeft='10px'; imp.onclick=()=>$('#fileImp').click();
  eb.appendChild(exp); eb.appendChild(imp);
  const fi=el('input'); fi.type='file'; fi.id='fileImp'; fi.accept='.json'; fi.style.display='none';
  fi.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=()=>{ try{ const r=importEnvelope(JSON.parse(rd.result)); toast(r.msg); render(); }catch(err){ toast('JSON 解析失败'); } }; rd.readAsText(f); };
  eb.appendChild(fi);
  if(app.externalRef) eb.appendChild(el('div','hint',`已缓存算账器信封：realP90Factor=${app.externalRef.realP90Factor!=null?app.externalRef.realP90Factor:'（无）'}（数据截至 ${app.externalRef.exportedAt||'—'}）`));
  env.appendChild(eb); p.appendChild(env);
  // 信用书重打
  const cov=el('div','card'); cov.id='a-cov';
  cov.appendChild(el('div',null,'<div style="padding:16px 18px;border-bottom:1px solid var(--line2)"><h3 style="font-size:15px">招聘信用书</h3></div>'));
  const covs=listCovenants();
  if(covs.length===0) cov.appendChild(el('div','list-row','<div class="info"><div class="s">还没有签发的信用书。到「五张账单」点“签发招聘信用书”。</div></div>'));
  covs.forEach(cv=>{ const r=el('div','list-row');
    r.innerHTML=`<div class="info"><div class="t">${escapeHtml(cv.candidateName)} · ${cv.code}</div><div class="s">底薪 ${yuan(cv.snapshot.baseSalaryAmt)} · 达标 ${yuan(cv.snapshot.thresholdTAmt)} · ${cv.issuedDate}</div></div>`;
    const pr=el('button','btn ghost sm','重打'); pr.onclick=()=>printCovenant(cv); r.appendChild(pr); cov.appendChild(r); });
  p.appendChild(cov);
  return p;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function exportEnvelope(){ const env=buildEnvelope(); const blob=new Blob([JSON.stringify(env,null,2)],{type:'application/json'});

function eqWan(fen,exp){ return (fen/1e6).toFixed(1)===exp; }

    const A1=calcCardA(inpA,2,10);
    ok('T-A1', eqPct(A1.rows[0].r,'19.5')&&eqPct(A1.rows[1].r,'4.7')&&eqPct(A1.rows[2].r,'2.9')
      &&eqPct(A1.burdenRate,'27.1')&&eqPct(A1.fullBurden,'47.0'),
      `r=${pct(A1.rows[0].r)}/${pct(A1.rows[1].r)}/${pct(A1.rows[2].r)} 负担=${pct(A1.burdenRate)} 全口径=${pct(A1.fullBurden)}`);
    /* T-A2：底薪吃穿现金目标（B≥T×0.9）→闸①W-02拦截，该层 r 不渲染 */
    setOverride('cityBase.tier1',2000000); // 20000元 → 销售 B=20000×1.5×1.0=30000 ≥ T×0.9=27000 → blocked
    const A2=calcCardA({cityTier:'tier1',cycleTier:'short',tierGrade:'effective',targetPersonalMonthlyGrossAmt:W(9),nextYearTargetGrossAmt:W(1200),blendedMarginRate:0.3,salesCount:10},2,10);
    clearOverrides();

    /* T-B4：跨板块咬合 */

      &&t[0].unitReturn<t[1].unitReturn&&t[1].unitReturn<t[2].unitReturn,
