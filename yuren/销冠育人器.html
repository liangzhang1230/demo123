<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销冠育人器 v2.3</title>
<style>
/* ============================================================
   设计系统 · 双极简
   系统极简：零框架、零依赖、零网络；一套令牌、一种卡片、一个渲染循环
   用户极简：每屏一件事；空态即教学；证据即出处；null 即 "—"
   ============================================================ */
:root{
  --ink:#1a1c1e; --ink2:#55585c; --ink3:#8a8d92; --hair:#e6e4df;
  --paper:#faf9f6; --card:#ffffff;
  --accent:#3451b2; --accent-soft:#eef1fb;
  --green:#1f7a4d; --green-soft:#e9f5ee;
  --amber:#9a6700; --amber-soft:#fff4d6;
  --red:#b3261e;   --red-soft:#fdeceb;
  --gold:#8a6d1d;  --gold-soft:#faf3dc;
  --radius:10px; --shadow:0 1px 2px rgba(26,28,30,.05),0 4px 14px rgba(26,28,30,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:14px;line-height:1.65;color:var(--ink);background:var(--paper);min-width:1080px}
::selection{background:var(--accent-soft)}
h1,h2,h3,h4{font-weight:600;line-height:1.35}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--hair);border-radius:6px;
  padding:7px 10px;background:#fff;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
table{border-collapse:collapse;width:100%}
th{font-weight:500;color:var(--ink2);text-align:left;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--hair);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* —— 布局 —— */
#app{display:flex;min-height:100vh}
.side{width:216px;flex:none;background:var(--card);border-right:1px solid var(--hair);
  padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:2px 10px 14px}
.brand b{font-size:16px;letter-spacing:.5px}
.brand small{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
.nav-sec{margin-top:14px}
.nav-sec>span{display:block;font-size:11px;color:var(--ink3);letter-spacing:1px;padding:0 10px 6px}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--ink2);
  text-decoration:none;font-size:13.5px;margin-bottom:1px}
.nav a:hover{background:var(--paper)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav a .no{font-size:11px;color:var(--ink3);width:15px;text-align:center;flex:none}
.nav a.on .no{color:var(--accent)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;background:var(--card);border-bottom:1px solid var(--hair);
  padding:10px 28px;position:sticky;top:0;z-index:20}
.topbar .lic{font-size:12.5px;color:var(--ink2)}
.topbar .lic b{color:var(--ink)}
.topbar .sp{flex:1}
.topbar .today{font-size:12.5px;color:var(--ink3)}
.content{padding:26px 28px 60px;max-width:1120px;width:100%;margin:0 auto}
.ph{margin-bottom:20px}
.ph h1{font-size:19px}
.ph p{color:var(--ink2);font-size:13px;margin-top:3px;max-width:760px}

/* —— 卡片与元件 —— */
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card>h3{font-size:14.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;
  border:1px solid var(--hair);background:#fff;color:var(--ink);transition:all .15s}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{color:var(--red);border-color:#eecfcd}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;white-space:nowrap}
.tag.g{background:var(--green-soft);color:var(--green)}
.tag.a{background:var(--amber-soft);color:var(--amber)}
.tag.r{background:var(--red-soft);color:var(--red)}
.tag.b{background:var(--accent-soft);color:var(--accent)}
.tag.n{background:var(--paper);color:var(--ink3)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.kpi{display:flex;gap:14px;flex-wrap:wrap}
.kpi .k{flex:1;min-width:150px;background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);padding:14px 16px}
.kpi .k label{font-size:12px;color:var(--ink3);display:block}
.kpi .k b{font-size:22px;font-weight:600;display:block;margin-top:2px}
.kpi .k small{font-size:11.5px;color:var(--ink3)}
.src{display:block;font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.55}
.asof{font-size:11px;color:var(--ink3)}
.asof.stale{color:var(--amber)}
.gray{color:var(--ink3);font-size:12px}
.hr{border:none;border-top:1px solid var(--hair);margin:12px 0}
.quote{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;
  font-size:13px;margin:10px 0}
.alert{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px;border:1px solid transparent}
.alert.r{background:var(--red-soft);color:var(--red);border-color:#f3d3d1}
.alert.a{background:var(--amber-soft);color:#6e4d00;border-color:#f0e0b0}
.alert.g{background:var(--green-soft);color:var(--green)}
.banner{padding:9px 28px;font-size:13px;background:var(--amber-soft);color:#6e4d00;border-bottom:1px solid #f0e0b0;
  display:flex;align-items:center;gap:12px}
.banner.r{background:var(--red-soft);color:var(--red);border-color:#f3d3d1}

/* —— 锁定 / 空态 —— */
.lockcard{border:1px dashed var(--hair);border-radius:var(--radius);background:#fff;
  padding:34px 24px;text-align:center;margin-bottom:16px}
.lockcard .ic{font-size:26px}
.lockcard h4{font-size:14.5px;margin:8px 0 4px}
.lockcard p{color:var(--ink2);font-size:13px;max-width:520px;margin:0 auto 12px}
.locked{position:relative;pointer-events:none;user-select:none}
.locked::after{content:"完整版功能 · 输入授权码解锁";position:absolute;inset:0;background:rgba(250,249,246,.82);
  backdrop-filter:blur(2.5px);display:flex;align-items:center;justify-content:center;
  color:var(--ink2);font-size:13px;border-radius:var(--radius);z-index:5}

/* —— 徽章 / 自检 —— */
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);border-radius:8px;
  padding:5px 10px;font-size:12px;background:#fff}
.badge.ok{border-color:#bfe0cd;background:var(--green-soft);color:var(--green)}
.badge.no{border-color:#f3d3d1;background:var(--red-soft);color:var(--red)}
.badge b{font-weight:600}

/* —— PLV 工作台 —— */
.plv-lay{display:grid;grid-template-columns:1fr 300px;gap:16px}
.plv-check{font-size:13px}
.plv-check .li{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--hair)}
.plv-check .li:last-child{border-bottom:none}
textarea.rx{width:100%;min-height:110px;resize:vertical;line-height:1.7}

/* —— 散点图 —— */
.scatter{width:100%;height:auto;display:block}
.scatter .dot{cursor:pointer}
.scatter text{font-size:10px;fill:var(--ink3)}

/* —— 节奏四区 —— */
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.zone{border:1px solid var(--hair);border-radius:var(--radius);background:#fff;padding:12px 14px;min-height:120px}
.zone h4{font-size:13px;display:flex;justify-content:space-between;align-items:center}
.zone .p{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--hair)}
.zone .p:last-child{border-bottom:none}

/* —— 销售端 —— */
.sales-wrap{max-width:560px;margin:0 auto}
.rx-card{border-left:4px solid var(--accent)}
.rx-card .seg{margin-bottom:10px}
.rx-card .seg label{font-size:11.5px;color:var(--accent);letter-spacing:1px}
.rx-card .seg p{font-size:13.5px}
.footnote{font-size:11.5px;color:var(--ink3);border-top:1px dashed var(--hair);padding-top:8px;margin-top:10px}

/* —— 打印 —— */
.print-only{display:none}
@media print{
  body{background:#fff;min-width:0}
  .side,.topbar,.banner,.no-print,.nav{display:none!important}
  .content{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
  .print-only{display:block}
  .print-footer{position:fixed;bottom:0;left:0;right:0;font-size:10.5px;color:#777;
    border-top:1px solid #ddd;padding-top:4px;text-align:center}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================================================================
   销冠育人器 v2.3 —— 单文件交付（HTML+CSS+JS 内联）
   依据：《0号·销冠算盘全局公约 v1.5》+《5号·销冠育人器完整规格 v2.3》
   铁律：无后端 / 无网络 / 无 CDN / localStorage（前缀 skab_yuren_）
         计算层纯函数 + today 显式注入（公约 C-14）；除法只经 safeDiv；
         系数只经 getCoef；跨板块数据只经信封导入，只读（A-20）。
   ================================================================ */

/* ========= 0. 构建常量（双构建：'free' | 'full'，同一代码两个常量） ========= */
const BUILD_MODE = 'full';
const APP_VERSION = 'v2.3';
const BOARD = 'yuren';
const LS_PREFIX = 'skab_yuren_';

/* ========= 1. COEFFICIENTS（结构权归系统·数值权归老板 ✏️·启用权归老板） ========= */
/* 两级架构（公约 C-03）：共享系数=公约【5】；本板块增补=本件二 2.3。 */
const COEF_DEFAULTS = {
  // —— 公约【5.2】共享（本板块用到的子集）——
  minSampleDefault: 5,
  envelopeStaleDays: 90,          // ✏️ 信封新鲜度标注阈值（只标注不阻断）
  ahcTrustLine: 60,               // ✏️ AHC 信任线（闸③，与算账器闸⑪双侧同改 R-04）
  backupNudgeDays: 14,            // ✏️ 备份提醒阈值（A-24）
  momentumTrigger: { lossStreak: 3, score: 0.6 },
  coachingDose: { floorHrsMonth: 3, ceilHrsMonth: 5, weeklyMin: 0.5 },
  // —— 本板块件二 2.3 增补 ——
  recipeGate: { topN: 3, uerMin: 0, discountLeMean: true, complaintLeMean: true },
  plvBanned: ["态度","心态","性格","狼性","拼劲","不够努力","意识","格局","悟性","主动性",
    "责任心","上进心","你这个人","不用心","不上心","没激情","抗压能力","逆商","企图心",
    "不行","不专业","笨","懒","没脑子","态度端正"],   // ✏️ 只增不删
  rxRules: { volumeLt: 0.70, qualityLt: 0.60, doseGe: 0.70, ratioGe: 0.80, speedX: 1.5 },
  psi: { w: [25,25,25,25], targeting: { top: 1.0, second: 0.6, other: 0.2 },
         benchmark: { source: 1.0, teamMean: 0.5, generic: 0 }, bands: [40,70] },
  newbieWindow: { days: 7, thresholdRate: 0.80, redStreakDays: 3, redLine: 0.60, holdDays: 3 },
  effectiveScore: { newbieBandFactor: 0.60 },
  spotCheck: { weeklyK: 2, kRange: [0,5], flagWeight: 3 },
  backlogAlert: { managerDays: 30, bossDays: 60, surgeUp: 0.50, dropDown: 0.30 },
  joltRule: { stallX: 1.5, discountX: 1.5 },
  floorLift: { minEach: 3, windowDays: 90 },
  m40: { coachTopN: 3, learnerBand: [0.20, 0.80], pairWeeksMax: 3, sessionMinutes: 20,
         queueSort: "近3月归一化净贡献增幅升序" },
  m41: { lossStreakTrigger: 3, scoreTrigger: 0.60, w: [0.6, 0.4], streakCap: 5,
         winRateWindowDays: 30, smallDealAovX: 0.5 },
  m42: { laggardBand: 1/3, trajMonths: 6, matchNowBand: "≥中1/3" },
  m43: { accel: [0.60, 0.95], quitLt: 0.40, protectBigDealShare: 0.50, subGoalX: 1.1,
         middleCoachWeight: 0.60 },
  m44: { tenureYears: 2, neglectRatioLt: 0.5 },
  cullGuard: { leadsIndexLt: 0.70, practice14Min: 50 },   // 汰前三拦截阈值（3.6）
  momentumBannedWords: ["冲","拼","必须拿下"],             // M41③ 动量期 PLV 加强词
};
// 可编辑白名单（✏️ 数值权归老板；结构不可改）
const COEF_EDITABLE = [
  ['ahcTrustLine','AHC 信任线（闸③）','分'],
  ['envelopeStaleDays','信封过期标注阈值','天'],
  ['backupNudgeDays','备份提醒阈值','天'],
  ['coachingDose.floorHrsMonth','辅导剂量下限','小时/月'],
  ['coachingDose.ceilHrsMonth','辅导剂量上限','小时/月'],
  ['newbieWindow.thresholdRate','新人阈值（基准×）','0–1'],
  ['spotCheck.weeklyK','每周抽检张数','张'],
  ['m40.pairWeeksMax','配对连续周上限','周'],
  ['m43.subGoalX','弃赛区子目标系数','倍'],
];

/* ========= 2. 工具（公约【2】【3】：金额分 int / 比率 0–1 / 舍入只在展示层） ========= */
function safeDiv(a, b) { return (b === 0 || b == null || a == null) ? null : a / b; }

function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }

function fmtInt(n) { return n == null ? '—' : Math.round(n).toLocaleString('zh-CN'); }
function fmtAmt(cents) {   // 分 → 整数元 ¥12,480
  return cents == null ? '—' : '¥' + Math.round(cents / 100).toLocaleString('zh-CN');
}
function fmtWan(cents) {   // 分 → 万元保留 1 位
  return cents == null ? '—' : (cents / 1000000).toFixed(1) + ' 万';
}
function fmtRate(r) { return r == null ? '—' : (r * 100).toFixed(1) + '%'; }
function fmtNum(n, d) { return n == null ? '—' : Number(n).toFixed(d == null ? 1 : d); }
function roundTo(x, unit) { return x == null ? null : Math.round(x / unit) * unit; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function uid(prefix) {
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
}
// 日期：字符串直算，避免时区裁量；周期比较左闭右闭
function dParse(s) { const p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function dStr(ms) { const d = new Date(ms); return d.toISOString().slice(0, 10); }
function addDays(s, n) { return dStr(dParse(s) + n * 86400000); }
function diffDays(a, b) { return Math.round((dParse(a) - dParse(b)) / 86400000); }  // a − b
function weekdayOf(s) { return new Date(dParse(s)).getUTCDay(); }                    // 0=周日
function monthKey(s) { return s.slice(0, 7); }
function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null; }
function stddev(arr) {
  if (arr.length < 2) return null;
  const m = mean(arr);
  return Math.sqrt(arr.reduce((s, x) => s + (x - m) * (x - m), 0) / (arr.length - 1));
}
// 展示保险丝（A-10 / Y-D14）：任何非有限数一律 "—"
function safeShow(v, fmt) {
  if (v == null || (typeof v === 'number' && !isFinite(v))) return '—';
  return fmt ? fmt(v) : String(v);
}

/* ========= 3. CALC —— 计算层（全部纯函数；含日期者一律显式收 today） ========= */
/* 公约 §4.7 全系统唯一 S 曲线（本板块用于 M15 基准语境与"S曲线右移"提示；改动须过 R-05 双基准） */
const rampCurve12 = {
  short:    [0,12,25,42,60,73,85,93,100,100,100,100],
  regular:  [0, 5,12,22,35,48,60,72, 82, 90, 96,100],
  midLong:  [0, 0, 5,12,20,30,42,53, 63, 72, 80, 87],
  long:     [0, 0, 0, 5,10,18,27,36, 45, 54, 62, 70],
  ultraLong:[0, 0, 0, 0, 5,10,16,23, 30, 37, 44, 50],
};
const CALC = {
  // 🔧C-04：入职月 m 的当年贡献率 = 在职 tenure 的头部和 Σ[1..(13−m)]，不是尾部和
  newHireYearRate(cycle, m) {
    const arr = rampCurve12[cycle];
    if (!arr || m < 1 || m > 12) return null;
    let s = 0;
    for (let i = 0; i < 13 - m; i++) s += arr[i];
    return s / 12 / 100;
  },

  /* —— 3.2 闸① PLV 处方语言校验器（三层全拦截） —— */
  plvCheck(text, opts) {
    opts = opts || {};
    const t = String(text || '').trim();
    const banned = (opts.banned || COEF_DEFAULTS.plvBanned)
      .concat(opts.momentum ? (opts.momentumBanned || COEF_DEFAULTS.momentumBannedWords) : []);
    // 第一层：拦截词库
    const hits = banned.filter(w => t.includes(w));
    const l1 = { pass: hits.length === 0, hits };
    // 第二层：去人名测试——删人名/你/他/她后，句子仍指向任务（含数字或业务环节词）才算成立
    let residual = t.replace(/你|他|她|您/g, '');
    (opts.names || []).forEach(n => { residual = residual.split(n).join(''); });
    const TASK_WORDS = ['电话','线索','意向','样品','签约','需求','拜访','报价','跟进','复盘',
      '话术','异议','分钟','客户','单','转化','演示','确认'];
    const l2 = { pass: /\d/.test(residual) || TASK_WORDS.some(w => residual.includes(w)) };
    // 第三层：三槽位（行为数据 + 具体动作 + 可测基准，缺一拦截）
    const hasBehaviorData = /\d/.test(t) && TASK_WORDS.some(w => t.includes(w));
    const hasAction = /(试试|改成|下次|先|把|问|打|加上|换成|今天|本周|再|多做|列出|准备)/.test(t);
    const hasBenchmark = /(基准|配方源|团队均值|上周|上月|参考|对标)/.test(t) && /[\d％%]/.test(t);
    const l3 = { pass: hasBehaviorData && hasAction && hasBenchmark,
                 slots: { behaviorData: hasBehaviorData, action: hasAction, benchmark: hasBenchmark } };
    return { l1, l2, l3, passed: l1.pass && l2.pass && l3.pass };
  },

  /* —— 3.3 闸② PSI 个性化指数（parts ∈ [0,1]，逐项 25 分制四舍五入后求和） —— */
  psiScore(parts) {
    if (!parts) return null;
    const w = COEF_DEFAULTS.psi.w;
    const keys = ['targeting', 'benchmark', 'dataRef', 'ackRate'];
    let sum = 0;
    for (let i = 0; i < 4; i++) {
      const v = parts[keys[i]];
      if (v == null) return null;
      sum += Math.round(w[i] * v);
    }
    return sum;
  },
  psiBand(score) {
    if (score == null) return null;
    const b = COEF_DEFAULTS.psi.bands;
    return score > b[1] ? 'green' : (score >= b[0] ? 'amber' : 'red');
  },

  /* —— 3.1 闸④ 配方源资格（硬闸：四条同时满足；M21 未运行 → 整体锁定） —— */
  recipeGateCheck(p, ctx) {
    // p: {rankNorm, uer, discountRate, complaintCount}  ctx: {m21Done, teamDiscountMean, teamComplaintMean, coef}
    const coef = (ctx && ctx.coef) || COEF_DEFAULTS.recipeGate;
    if (!ctx || !ctx.m21Done) return { locked: true, qualified: false, fails: ['m21_missing'] };
    const fails = [];
    if (p.rankNorm == null || p.rankNorm > coef.topN) fails.push('rank');
    if (p.uer == null || p.uer < coef.uerMin) fails.push('uer');
    if (coef.discountLeMean && (p.discountRate == null || ctx.teamDiscountMean == null
        || p.discountRate > ctx.teamDiscountMean)) fails.push('discount');
    if (coef.complaintLeMean && (p.complaintCount == null || ctx.teamComplaintMean == null
        || p.complaintCount > ctx.teamComplaintMean)) fails.push('complaint');
    return { locked: false, qualified: fails.length === 0, fails };
  },

  /* —— 闸③ 产权前提：无 M28 ∨ AHC<信任线 → 锁定；UER 趋势 <−0.5σ → 「他开始藏了」 —— */
  propertyGate(p, coef) {
    // p: {hasM28, ahc}
    const line = (coef && coef.ahcTrustLine) != null ? coef.ahcTrustLine : COEF_DEFAULTS.ahcTrustLine;
    if (!p.hasM28) return { locked: true, reason: 'no_m28' };
    if (p.ahc == null) return { locked: true, reason: 'ahc_missing' };
    if (p.ahc < line) return { locked: true, reason: 'ahc_low' };
    return { locked: false, reason: null };
  },
  hidingCheck(uerSeries, minSample) {
    // 上线后配方源 UER 趋势监测：最新值相对此前均值下滑 < −0.5σ → hiding
    const min = minSample || COEF_DEFAULTS.minSampleDefault;
    if (!uerSeries || uerSeries.length < min) return { hiding: null };  // 样本不足不下结论（A-19）
    const prev = uerSeries.slice(0, -1), last = uerSeries[uerSeries.length - 1];
    const sd = stddev(prev);
    if (sd == null || sd === 0) return { hiding: null };
    return { hiding: (last - mean(prev)) < -0.5 * sd };
  },

  /* —— 3.7 闸⑩ 认知鸿沟 = 1 − 确认/上报；>30% 红 —— */
  cognitiveGap(reportedHrs, confirmedHrs) {
    const r = safeDiv(confirmedHrs, reportedHrs);
    return r == null ? null : 1 - r;
  },

  /* —— 3.5 M14 第三闸 · 有效动作分（刷量不增分 → 虚报数学收益归零） —— */
  effectiveLeads(leads, intents, convLowerBand) {
    if (leads == null) return null;
    if (intents == null || convLowerBand == null || convLowerBand <= 0) return leads;
    return Math.min(leads, intents / convLowerBand);
  },
  effectiveChain(counts, bands) {
    // counts:{leads,intents,samples,contracts} bands:{lead2intent,intent2sample,sample2contract}（个人近90天下限带宽）
    const eLeads   = CALC.effectiveLeads(counts.leads,   counts.intents,   bands && bands.lead2intent);
    const eIntents = CALC.effectiveLeads(counts.intents, counts.samples,   bands && bands.intent2sample);
    const eSamples = CALC.effectiveLeads(counts.samples, counts.contracts, bands && bands.sample2contract);
    return { leads: eLeads, intents: eIntents, samples: eSamples, contracts: counts.contracts };
  },

  /* —— 3.6 M15 汰前三道拦截（任一命中 → 汰建议渲染前拦截；兜底默认「留」） —— */
  cullInterceptors(ctx, coef) {
    // ctx: {leadsIndex, practice14, ackConfirmedCount}
    const c = coef || COEF_DEFAULTS.cullGuard;
    const blocks = [];
    if (ctx.leadsIndex != null && ctx.leadsIndex < c.leadsIndexLt) blocks.push('no_leads');
    if (ctx.practice14 != null && ctx.practice14 < c.practice14Min) blocks.push('no_practice');
    if (ctx.ackConfirmedCount === 0) blocks.push('no_coaching');
    return blocks;
  },

  /* —— 3.4 M13 闸⑧ 挤出对冲（三态；与 4号闸③、公约 A-12 逐字同源，R-04） —— */
  isResultTrigger(t) { return ['record_break', 'sprint', 'backlog_clear'].indexOf(t) >= 0; },
  isExempt(t) { return ['first_deal', 'hire'].indexOf(t) >= 0; },
  bountyGate(template, silentTrackOn) {
    if (CALC.isExempt(template)) return { allow: true, state: 'exempt' };
    if (CALC.isResultTrigger(template) && !silentTrackOn)
      return { allow: false, state: 'blocked', talk: 'Y-13' };
    return { allow: true, state: 'pass' };
  },

  /* —— 3.8 M25 JOLT 闸⑫ —— */
  joltCheck(d, coef) {
    // d:{stayDays, categoryMedianStayDays, hasDiscountDuring, personDiscountRate, othersDiscountRate}
    const c = coef || COEF_DEFAULTS.joltRule;
    const high = (d.stayDays != null && d.categoryMedianStayDays != null)
      ? d.stayDays > d.categoryMedianStayDays * c.stallX : null;
    const pressure = high === true && !!d.hasDiscountDuring;
    let ratioRed = null;
    const ratio = safeDiv(d.personDiscountRate, d.othersDiscountRate);
    if (ratio != null) ratioRed = ratio > c.discountX;
    return { highHesitation: high, pressure, ratioRed };
  },

  /* —— 3.9 M26 地板抬升计量器（前后对比，非随机对照） —— */
  floorLift(group, coef) {
    // group: {members:[{beforeMonthlyAmt, afterMonthlyAmt}], windowDaysOk:bool}
    const c = coef || COEF_DEFAULTS.floorLift;
    if (!group || !group.members || group.members.length < c.minEach || !group.windowDaysOk)
      return { annualLiftAmt: null, insufficient: true };
    let lift = 0;
    for (const m of group.members) {
      if (m.beforeMonthlyAmt == null || m.afterMonthlyAmt == null) return { annualLiftAmt: null, insufficient: true };
      lift += m.afterMonthlyAmt - m.beforeMonthlyAmt;
    }
    return { annualLiftAmt: lift * 12, monthlyLiftAmt: lift, insufficient: false };
  },
  recipeRoi(annualLiftAmt, monthlyCostAmt) {
    return safeDiv(annualLiftAmt, monthlyCostAmt == null ? null : monthlyCostAmt * 12);
  },

  /* —— 3.10 M40 配对传帮带排班器 —— */
  m40Pairing(input, coef) {
    // input: {people:[{spId,name,rankNorm,growth3m}], gate4PassIds:[], m28SignedIds:[], prevWeeks:{ 'coach|learner': n }}
    const c = coef || COEF_DEFAULTS.m40;
    const n = input.people.length;
    const byId = {};
    input.people.forEach(p => byId[p.spId] = p);
    const coachCand = input.people
      .filter(p => p.rankNorm != null && p.rankNorm <= c.coachTopN)
      .filter(p => input.gate4PassIds.indexOf(p.spId) >= 0)
      .sort((a, b) => a.rankNorm - b.rankNorm);
    const frozen = coachCand.filter(p => input.m28SignedIds.indexOf(p.spId) < 0);
    const coaches = coachCand.filter(p => input.m28SignedIds.indexOf(p.spId) >= 0);
    const coachIds = coachCand.map(p => p.spId);
    const lo = n * c.learnerBand[0], hi = n * c.learnerBand[1];
    const learners = input.people
      .filter(p => p.rankNorm != null && p.rankNorm > lo && p.rankNorm <= hi)
      .filter(p => coachIds.indexOf(p.spId) < 0)
      .sort((a, b) => (a.growth3m == null ? 1 : b.growth3m == null ? -1 : a.growth3m - b.growth3m));
    const pairs = [], queued = [];
    let li = 0;
    for (const coach of coaches) {
      // 轮换铁律：同一对 consecutiveWeeks ≥ pairWeeksMax → 第 4 周强制轮换（跳过该学员）
      while (li < learners.length) {
        const cw = (input.prevWeeks || {})[coach.spId + '|' + learners[li].spId] || 0;
        if (cw >= c.pairWeeksMax) { queued.push(learners[li].spId); li++; continue; }
        break;
      }
      if (li >= learners.length) break;
      pairs.push({ coachId: coach.spId, learnerId: learners[li].spId });
      li++;
    }
    for (; li < learners.length; li++) queued.push(learners[li].spId);
    return { pairs, queued, frozenCoachIds: frozen.map(p => p.spId) };
  },
  pairAllowed(consecutiveWeeks, coef) {
    const max = (coef && coef.pairWeeksMax) || COEF_DEFAULTS.m40.pairWeeksMax;
    return consecutiveWeeks < max;
  },

  /* —— 3.11 M41 动量连败干预器 —— */
  momentum(lossStreak, prevWinRate, curWinRate, coef) {
    const c = coef || COEF_DEFAULTS.m41;
    const dropRatio = (prevWinRate == null || curWinRate == null || prevWinRate <= 0) ? null
      : Math.max(0, (prevWinRate - curWinRate) / prevWinRate);
    if (lossStreak == null && dropRatio == null) return { score: null, triggered: null };
    const s = c.w[0] * Math.min((lossStreak || 0) / c.streakCap, 1)
            + c.w[1] * Math.min(dropRatio == null ? 0 : dropRatio, 1);
    const score = Math.round(s * 100) / 100;
    return { score, triggered: (lossStreak || 0) >= c.lossStreakTrigger || score >= c.scoreTrigger };
  },

  /* —— 3.12 M42 深板凳榜样匹配（轨迹距离，万元） —— */
  trajDistance(a, b) {
    if (!a || !b || a.length !== b.length || !a.length) return null;
    let s = 0;
    for (let i = 0; i < a.length; i++) {
      if (a[i] == null || b[i] == null) return null;
      s += Math.abs(a[i] - b[i]);
    }
    return s;
  },
  m42Match(laggardTraj, candidates) {
    // candidates: [{spId, traj, nowBandOk}]；匹配集为空 → null（"—"，绝不硬凑）
    let best = null;
    for (const cand of candidates || []) {
      if (!cand.nowBandOk) continue;
      const d = CALC.trajDistance(laggardTraj, cand.traj);
      if (d == null) continue;
      if (!best || d < best.dist) best = { spId: cand.spId, dist: d };
    }
    return best;
  },

  /* —— 3.13 M43 分层节奏引擎 —— */
  paceZone(completion, opts, coef) {
    // completion = 周期回款 ÷ 个人配额（null → 整模块 "—"）
    if (completion == null) return null;
    const c = coef || COEF_DEFAULTS.m43;
    const o = opts || {};
    const bigDealProtect = (o.inFlightBigDealAmt != null && o.monthQuotaAmt != null
      && o.inFlightBigDealAmt > o.monthQuotaAmt * c.protectBigDealShare);
    if (completion >= 1.0 || bigDealProtect) return 'protect';
    if (completion < c.quitLt) return 'quit_risk';
    if (completion >= c.accel[0] && completion < c.accel[1]) return 'accel';
    return 'normal';
  },
  subGoalAmt(remainWorkdays, dailyAvgAmt, coef) {
    // 子目标 = roundTo(剩余工作日 × 个人历史日均回款 × 1.1, 百元)；只影响推送节奏，不写配额/提成
    const c = coef || COEF_DEFAULTS.m43;
    if (remainWorkdays == null || dailyAvgAmt == null) return null;
    return roundTo(remainWorkdays * dailyAvgAmt * c.subGoalX, 10000);  // 百元 = 10000 分
  },

  /* —— 3.13 M44a 资历忽视检测 —— */
  m44aRatio(veteranAvgDoseHrs, teamAvgDoseHrs) {
    return safeDiv(veteranAvgDoseHrs, teamAvgDoseHrs);
  },

  /* —— 闸⑪ 辅导剂量（人均月 confirmed 时长；导出信封供留人器闸⑧Q4，Y-C02/Y-D15） —— */
  coachingDoseActual(acks, activeCount, windowDays, today) {
    // acks: [{status, durationHrs, date}]；只计 confirmed；按 windowDays 折算为"人均月"
    if (!activeCount || !windowDays) return null;
    const from = addDays(today, -windowDays);
    let total = 0;
    for (const a of acks || []) {
      if (a.status === 'confirmed' && a.durationHrs != null && a.date > from && a.date <= today)
        total += a.durationHrs;
    }
    const perCapitaMonthly = safeDiv(total, activeCount) == null ? null
      : (total / activeCount) * (30 / windowDays);
    return perCapitaMonthly == null ? null : Math.round(perCapitaMonthly * 10) / 10;
  },

  /* —— 休息日规则：分母/连续计数/催报/插卡四处全部排除（Y-D8） —— */
  isWorkday(dateStr, shiftConfig, spId) {
    // shiftConfig: {spId 或 '*': [0..6 为休息的星期]}；默认周日休
    const sc = shiftConfig || {};
    const rest = sc[spId] || sc['*'] || [0];
    return rest.indexOf(weekdayOf(dateStr)) < 0;
  },

  /* —— M14 ① 挂账爆破 + 量增质塌 —— */
  backlogCheck(d, today, coef) {
    // d:{contractDate, paidDate|null}
    const c = coef || COEF_DEFAULTS.backlogAlert;
    if (d.paidDate) return null;
    const days = diffDays(today, d.contractDate);
    if (days > c.bossDays) return 'boss';
    if (days > c.managerDays) return 'manager';
    return null;
  },
  surgeCollapse(cur, prev, coef) {
    // 量增质塌：计数 +50% ∧ 转化 −30% → 抽检加权 ×3
    const c = coef || COEF_DEFAULTS.backlogAlert;
    const up = safeDiv(cur.leads - prev.leads, prev.leads);
    const down = safeDiv(prev.conv - cur.conv, prev.conv);
    if (up == null || down == null) return null;
    return up >= c.surgeUp && down >= c.dropDown;
  },
};

/* ========= 5. StorageAdapter（v1 落 localStorage，预留 IndexedDB 切换位；C-15） ========= */
const StorageAdapter = {
  read(key, fallback) {
    try {
      const raw = localStorage.getItem(LS_PREFIX + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  write(key, value) {
    try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); return true; }
    catch (e) { return false; }  // 配额超限 → 调用方提示导出归档
  },
  probe() {   // 启动配额自检：占用估算 + 写入探针（公约【8】C-15）
    let used = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        used += k.length + (localStorage.getItem(k) || '').length;
      }
      localStorage.setItem(LS_PREFIX + '__probe', 'x');
      localStorage.removeItem(LS_PREFIX + '__probe');
      return { ok: true, usedBytes: used * 2 };   // UTF-16 估算
    } catch (e) { return { ok: false, usedBytes: used * 2 }; }
  },
};

/* ========= 6. 信封（公约【7】skab_v1：导出 / 导入 / 新鲜度） ========= */
const KNOWN_BOARDS = ['dingjia', 'zhaoren', 'suanzhang', 'liuren', 'yuren'];
const ENTITY_WHITELIST = ['Salesperson','CompPlanScenario','TeamStructure','CovenantDoc','Covenant','Deal',
  'Category','PayoutEntry','RefundEntry','DiscountEntry','LeadAssignment','DailyReport','CoachingAck',
  'CoachTask','Prescription','Bounty','HiringCriteria','Candidate','InterviewScorePack','PracticeLog',
  'HireBatch','ManagerChangeEvent','LedgerEntry','ObjectionEntry','SuggestionEntry','M28Agreement',
  'MenuChoice','OverrideEvent','Experiment','HandoverCard','CallMetrics','M21Norm'];

function coefficientsHash(coef) {   // 简易指纹（不一致→提示同步，不阻断）
  const s = JSON.stringify(coef);
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return 'c' + (h >>> 0).toString(16);
}

function buildEnvelope(db, today, coefResolved) {
  const activeCount = db.salespeople.filter(p => p.isActive).length;
  const dose = CALC.coachingDoseActual(db.coachingAcks, activeCount, 30, today);
  return {
    schema: 'skab_v1',
    board: BOARD,
    exportedAt: today,
    dataVersion: 1,
    coefficientsHash: coefficientsHash(coefResolved),
    derived: { coachingDoseActual: dose },   // 🔧Y-C02：供留人器分红闸⑧ Q4
    entities: {
      DailyReport: db.dailyReports,
      CoachingAck: db.coachingAcks,
      CoachTask: db.coachTasks,
      Prescription: db.prescriptions,
      Bounty: db.bounties,
    },
  };
}

function importEnvelope(db, json, today) {
  if (!json || json.schema !== 'skab_v1') return { ok: false, err: '不是 skab_v1 信封' };
  if (KNOWN_BOARDS.indexOf(json.board) < 0) return { ok: false, err: '未知 board：' + json.board };
  if (json.board === BOARD) return { ok: false, err: '这是育人器自己的信封，无需导入' };
  const entities = {};
  Object.keys(json.entities || {}).forEach(k => {
    if (ENTITY_WHITELIST.indexOf(k) >= 0) entities[k] = json.entities[k];   // 未知实体静默跳过（向前兼容）
  });
  // dataVersion 不匹配 → 迁移升级，禁止报错拒收（公约 7.1③；v1 即当前版，直接收）
  db.externalRef[json.board] = {   // 🔴 整条覆盖，不做字段级合并（ExternalRef 铁律③）
    exportedAt: json.exportedAt, dataVersion: json.dataVersion || 1,
    coefficientsHash: json.coefficientsHash || null,
    derived: json.derived || {}, entities, importedAt: today,
  };

function resolveCoef(db) {
  const out = JSON.parse(JSON.stringify(COEF_DEFAULTS));
  Object.keys((db && db.coefOverrides) || {}).forEach(path => {
    const v = db.coefOverrides[path];
    const parts = path.split('.');
    let o = out;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    if (o && typeof o === 'object') o[parts[parts.length - 1]] = v;
  });
  return out;
}

/* ========= 7. 授权与降级（公约【11】·C-13 ECDSA P-256 非对称验签，离线） ========= */
/* HTML 内唯一密钥材料 = 公钥（授-5）。演示公钥；正式发布前作者本地重新生成密钥对。 */
const LICENSE_PUBKEY_JWK = { kty:'EC', crv:'P-256',
  x:'8FG4KihCQkZrG64-Z8wH8Z8QkYOfY7bnkuf0z17lQ18',
  y:'H5IagwmMbjMtdeqgsQKgguObP1mcsdkYaPWtj_oJ11w' };

function b64uToBytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function verifyLicense(code, todayReal) {
  // 码形：SKAB-<b64u(payloadJSON)>.<b64u(sig)>；payload={tenant,board,expiry}
  try {
    if (!code || code.indexOf('SKAB-') !== 0) return { ok: false, err: '格式不对' };
    const body = code.slice(5).trim();
    const dot = body.indexOf('.');
    if (dot < 0) return { ok: false, err: '格式不对' };
    const payloadBytes = b64uToBytes(body.slice(0, dot));
    const sig = b64uToBytes(body.slice(dot + 1));
    const key = await crypto.subtle.importKey('jwk', LICENSE_PUBKEY_JWK,
      { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    const valid = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, sig, payloadBytes);
    if (!valid) return { ok: false, err: '签名无效' };
    const payload = JSON.parse(new TextDecoder().decode(payloadBytes));
    if (payload.board !== BOARD) return { ok: false, err: '此码属于板块 ' + payload.board + '，不是育人器' };
    // 防调表：localStorage 记录 seenMaxDate；系统日期倒退 → 锁定
    const seen = StorageAdapter.read('seenMaxDate', null);
    if (seen && todayReal < seen) return { ok: false, err: '系统日期异常（早于最近使用日 ' + seen + '）' };
    if (!seen || todayReal > seen) StorageAdapter.write('seenMaxDate', todayReal);
    if (todayReal > payload.expiry) return { ok: false, expired: true, payload,
      err: '授权已于 ' + payload.expiry + ' 到期（功能回落体验版；数据与信封导出永不锁定）' };
    return { ok: true, payload };
  } catch (e) { return { ok: false, err: '无法解析授权码' }; }
}

function runSelfTests() {

function plvRewriteHint(plvResult) {
  // 改写建议 = 三槽位写作脚手架（不是替老板下结论，A-19）
  const s = plvResult.l3.slots || {};
  const parts = [];
  if (!plvResult.l1.pass) parts.push('去掉指向"人"的词（' + plvResult.l1.hits.join('、') + '），改说他做了什么');
  if (!s.behaviorData) parts.push('补一条行为数据：昨天/上周他在哪个环节、多少次');
  if (!s.action) parts.push('补一个今天就能做的具体动作（"试试在第 3 分钟问…"）');
  if (!s.benchmark) parts.push('补一个可测基准：配方源或团队均值的数字');
  return parts;
}

function savePrescription(db, rx, today) {
  const coef = resolveCoef(db);
  const names = db.salespeople.map(p => p.name).filter(Boolean);
  const plv = CALC.plvCheck(rx.text, { banned: coef.plvBanned, names,
    momentum: !!rx.momentumMode, momentumBanned: coef.momentumBannedWords });
  if (!plv.passed && !rx.insist) return { ok: false, plv, hints: plvRewriteHint(plv) };
  if (!plv.passed && rx.insist) {
    db.settings.insistLog.push({ date: today, spId: rx.employeeId || null, text: rx.text });  // 坚持原文留痕→认知鸿沟风险
  }
  db.prescriptions.push({
    rxId: uid('rx'), employeeId: rx.employeeId || null, date: today,
    type: rx.type || 'volume', target: rx.target || 'self',
    slotData: rx.slotData || null, text: rx.text,
    psiParts: rx.psiParts || null, plvPassed: plv.passed, coachAckId: null,
  });
  return { ok: true, plv };
}

function saveBounty(db, b, today) {
  const gate = CALC.bountyGate(b.template, db.settings.silentTrackOn);
  if (!gate.allow) return { ok: false, talk: gate.talk, state: gate.state };   // 🔴 拦截保存（表单校验层）
  const activeCount = db.bounties.filter(x => x.active).length;
  if (activeCount >= 3) return { ok: false, err: '同时活动的悬赏 ≤ 3' };
  db.bounties.push({ bountyId: uid('bt'), template: b.template, params: b.params || {},
    amountAmt: b.amountAmt || null, active: true, createdAt: today, achievedEvents: [] });
  return { ok: true, state: gate.state };
}

function saveDailyReport(db, r) {
  const dup = db.dailyReports.find(x => x.employeeId === r.spId && x.date === r.date);

    samples: r.counts.samples | 0, contracts: r.counts.contracts | 0 };

  db.dailyReports.push({ drId: uid('dr'), employeeId: r.spId, date: r.date,
    counts, submittedAt: r.date });
  return { ok: true };
}

function reportsFor(db, spId, from, to) {

/* —— 个人近90天转化率下限带宽（周桶最小值；桶<3 → null） —— */
function convBands(db, spId, today) {
  const from = addDays(today, -90);
  const buckets = {};
  for (const r of reportsFor(db, spId, from, today)) {
    const wk = Math.floor(diffDays(today, r.date) / 7);
    const b = buckets[wk] || (buckets[wk] = { leads:0, intents:0, samples:0, contracts:0 });
    b.leads += r.counts.leads; b.intents += r.counts.intents;
    b.samples += r.counts.samples; b.contracts += r.counts.contracts;
  }
  const ratios = { lead2intent: [], intent2sample: [], sample2contract: [] };
  Object.keys(buckets).forEach(k => {
    const b = buckets[k];
    if (b.leads > 0) ratios.lead2intent.push(b.intents / b.leads);
    if (b.intents > 0) ratios.intent2sample.push(b.samples / b.intents);
    if (b.samples > 0) ratios.sample2contract.push(b.contracts / b.samples);
  });
  const band = arr => arr.length >= 3 ? Math.min.apply(null, arr) : null;
  return { lead2intent: band(ratios.lead2intent), intent2sample: band(ratios.intent2sample),
    sample2contract: band(ratios.sample2contract) };
}
function bandsFor(db, spId, today) {
  // 新人：用配方源带宽 × newbieBandFactor(0.60)（3.5③）
  const coef = resolveCoef(db);
  const t = tenureDays(db, spId, today);
  if (t != null && t < 30 && db.recipeSource) {
    const src = convBands(db, db.recipeSource.sourceIds[0], today);
    const f = coef.effectiveScore.newbieBandFactor;
    return { lead2intent: src.lead2intent == null ? null : src.lead2intent * f,
      intent2sample: src.intent2sample == null ? null : src.intent2sample * f,
      sample2contract: src.sample2contract == null ? null : src.sample2contract * f };
  }
  return convBands(db, spId, today);
}
function sumCounts(reports) {
  const s = { leads:0, intents:0, samples:0, contracts:0 };
  for (const r of reports) { s.leads += r.counts.leads; s.intents += r.counts.intents;
    s.samples += r.counts.samples; s.contracts += r.counts.contracts; }
  return s;
}

/* —— M12 三张牌（剂量 / 配比 / 节奏；每月日切自动重算，零新增录入） —— */
function threeCards(db, today) {
  if (!db.recipeSource) return null;
  const ids = db.recipeSource.sourceIds;
  const from = addDays(today, -180);
  const per = ids.map(id => {
    const reps = reportsFor(db, id, from, today);
    const wd = Math.max(1, reps.length);   // 有报工作日
    const s = sumCounts(reps);
    const deals = XREF.deals(db).filter(d => d.spId === id && d.status === 'won')
      .sort((a, b) => a.contractDate < b.contractDate ? -1 : 1);
    let gaps = [];
    for (let i = 1; i < deals.length; i++) gaps.push(diffDays(deals[i].contractDate, deals[i-1].contractDate));
    const catCount = {};
    deals.forEach(d => catCount[d.category] = (catCount[d.category] || 0) + 1);
    const topCat = Object.keys(catCount).sort((a, b) => catCount[b] - catCount[a])[0] || null;
    const p = db.salespeople.find(x => x.spId === id);
    return {
      dose: { leads: s.leads / wd, intents: s.intents / wd, samples: s.samples / wd, contracts: s.contracts / wd },
      mix: { l2i: safeDiv(s.intents, s.leads), i2s: safeDiv(s.samples, s.intents), s2c: safeDiv(s.contracts, s.samples) },
      pace: { firstDealDays: (deals.length && p) ? diffDays(deals[0].contractDate, p.hireDate) : null,
        gapMedian: gaps.length ? gaps.sort((a, b) => a - b)[Math.floor(gaps.length / 2)] : null,
        topCat, topCatShare: deals.length ? (catCount[topCat] || 0) / deals.length : null },
    };
  });
  const avg = key1 => {
    const out = {};
    Object.keys(per[0][key1]).forEach(k => {
      const vals = per.map(x => x[key1][k]).filter(v => v != null && typeof v === 'number');
      out[k] = vals.length ? mean(vals) : per[0][key1][k];
    });
    return out;
  };
  return { dose: avg('dose'), mix: avg('mix'), pace: per[0].pace, nSources: ids.length };
}

/* —— 首N天基准（配方源+历史达标者的入职期数据；样本<3 → 单人+标注） —— */
function firstNDaysBaseline(db, today) {
  if (!db.recipeSource) return null;
  const coef = resolveCoef(db);
  const N = coef.newbieWindow.days;
  const samples = [];
  for (const id of db.recipeSource.sourceIds) {
    const p = db.salespeople.find(x => x.spId === id);
    if (!p) continue;
    const reps = reportsFor(db, id, p.hireDate, addDays(p.hireDate, N - 1));
    if (reps.length >= 3) {
      const s = sumCounts(reps);
      samples.push({ leads: s.leads / reps.length, intents: s.intents / reps.length, samples: s.samples / reps.length });
    }
  }
  if (!samples.length) return { missing: true };
  return {
    missing: false, singleSample: samples.length < 3, n: samples.length,
    daily: { leads: mean(samples.map(s => s.leads)), intents: mean(samples.map(s => s.intents)),
             samples: mean(samples.map(s => s.samples)) },
  };
}

/* —— 量×质散点（横轴=有效动作分/工作日；纵轴=签约转化） —— */
function scatterData(db, today) {
  const from = addDays(today, -90);
  return activeSps(db).map(p => {
    const reps = reportsFor(db, p.spId, from, today);
    if (!reps.length) return null;
    const s = sumCounts(reps);
    const eff = CALC.effectiveChain(s, bandsFor(db, p.spId, today));
    const x = safeDiv(eff.leads, reps.length);
    const y = safeDiv(s.contracts, s.leads);
    return (x == null || y == null) ? null : { spId: p.spId, name: p.name, x, y };
  }).filter(Boolean);
}

/* —— 处方诊断（量差/质差/速差三型按 rxRules 取偏差最大；A-19 证据不全不下结论） —— */
function rxDiagnose(db, spId, today) {
  const cards = threeCards(db, today);
  if (!cards) return { none: true, reason: '未设定配方源' };
  const from = addDays(today, -30);
  const reps = reportsFor(db, spId, from, today);
  if (reps.length < 5) return { none: true, reason: '近 30 天填报不足 5 天，证据不全，不下结论' };
  const s = sumCounts(reps);
  const myDose = s.leads / reps.length;
  const myMix = safeDiv(s.contracts, s.leads);
  const srcMix = (cards.mix.l2i != null && cards.mix.i2s != null && cards.mix.s2c != null)
    ? cards.mix.l2i * cards.mix.i2s * cards.mix.s2c : null;
  const coef = resolveCoef(db).rxRules;
  const doseRatio = safeDiv(myDose, cards.dose.leads);
  const mixRatio = safeDiv(myMix, srcMix);
  const dev = [];
  if (doseRatio != null && doseRatio < coef.volumeLt) dev.push({ type:'volume', gap: coef.volumeLt - doseRatio, doseRatio });
  if (mixRatio != null && mixRatio < coef.qualityLt) dev.push({ type:'quality', gap: coef.qualityLt - mixRatio, mixRatio });
  const myDeals = XREF.deals(db).filter(d => d.spId === spId && d.status === 'won');
  const gapDays = [];
  const sorted = myDeals.slice().sort((a, b) => a.contractDate < b.contractDate ? -1 : 1);
  for (let i = 1; i < sorted.length; i++) gapDays.push(diffDays(sorted[i].contractDate, sorted[i-1].contractDate));
  const myGap = gapDays.length ? mean(gapDays) : null;
  if (myGap != null && cards.pace.gapMedian != null && myGap > cards.pace.gapMedian * coef.speedX)
    dev.push({ type:'speed', gap: myGap / cards.pace.gapMedian - coef.speedX, myGap });
  if (!dev.length) return { none: true, reason: '三型偏差均未触发（量/质/速都在带内）' };
  dev.sort((a, b) => b.gap - a.gap);
  return { none: false, top: dev[0], all: dev,
    facts: { myDose, srcDose: cards.dose.leads, myMix, srcMix, myGap, srcGap: cards.pace.gapMedian, days: reps.length } };
}
function rxAutoText(db, spId, today) {
  const d = rxDiagnose(db, spId, today);
  if (d.none) return null;
  const f = d.facts;
  if (d.top.type === 'volume')
    return `近 ${f.days} 个工作日你日均 ${f.myDose.toFixed(1)} 条线索，配方源基准 ${f.srcDose.toFixed(1)} 条。` +
      `今天试试先把老客户名单里 3 个未跟进的联系一遍，本周把日均线索补到 ${(f.srcDose * 0.8).toFixed(0)} 条。`;
  if (d.top.type === 'quality')
    return `近 30 天你的线索→签约转化 ${fmtRate(f.myMix)}，配方源基准 ${fmtRate(f.srcMix)}。` +
      `今天试试在第 3 分钟问"您现在最头疼的是什么？"，把需求确认做在报价前——已为你生成带教任务。`;
  return `你的出单间隔约 ${f.myGap.toFixed(0)} 天，配方源基准 ${f.srcGap} 天。` +
    `今天先挑 1 个停在样品环节超 2 周的客户，把下一步动作约到本周内。`;
}

/* —— M15 新人筛选看板 —— */
function newbieBoard(db, today) {
  const coef = resolveCoef(db);
  const base = firstNDaysBaseline(db, today);
  return activeSps(db).filter(p => {
    const t = diffDays(today, p.hireDate);
    return t >= 0 && t <= 30;
  }).map(p => {
    const t = diffDays(today, p.hireDate);
    const reps = reportsFor(db, p.spId, p.hireDate, today);
    const days = [];
    let redStreak = 0, maxStreak = 0;
    if (base && !base.missing) {
      for (let d = p.hireDate; d <= today && diffDays(d, p.hireDate) < coef.newbieWindow.days; d = addDays(d, 1)) {
        if (!CALC.isWorkday(d, db.shiftConfig, p.spId)) continue;   // 休息日不计（Y-D8）
        const r = reps.find(x => x.date === d);
        const eff = r ? CALC.effectiveChain(r.counts, bandsFor(db, p.spId, today)) : null;
        const att = eff ? safeDiv(eff.leads, base.daily.leads * coef.newbieWindow.thresholdRate) : 0;
        const red = att == null || att < coef.newbieWindow.redLine;
        days.push({ date: d, att, red });
        redStreak = red ? redStreak + 1 : 0;
        maxStreak = Math.max(maxStreak, redStreak);
      }
    }
    const s = sumCounts(reps);
    const monthlyLeads = t > 0 ? Math.round(s.leads * (30 / Math.max(1, t))) : s.leads;
    const teamLeadMean = mean(activeSps(db).filter(x => x.spId !== p.spId).map(x => {
      const rr = reportsFor(db, x.spId, addDays(today, -30), today);
      return rr.length ? sumCounts(rr).leads : null;
    }).filter(v => v != null));
    const leadsIndex = safeDiv(monthlyLeads, teamLeadMean);
    const acks = db.coachingAcks.filter(a => a.spId === p.spId && a.status === 'confirmed');
    const ctx = { leadsIndex, practice14: XREF.practice14(db, p.spId), ackConfirmedCount: acks.length };
    const blocks = CALC.cullInterceptors(ctx, coef.cullGuard);
    const suggestCull = base && !base.missing && maxStreak >= coef.newbieWindow.redStreakDays;
    return { sp: p, tenure: t, days, maxStreak, suggestCull, blocks, ctx,
      verdict: DEFAULT_CULL_VERDICT, baselineMissing: !base || base.missing,
      singleSample: base && base.singleSample };
  });
}

/* —— M41 动量（从算账器 Deal 事件流派生；MomentumState 为派生视图，无独立存储） —— */
function momentumStates(db, today) {
  const coef = resolveCoef(db).m41;
  return activeSps(db).map(p => {
    const closed = XREF.deals(db).filter(d => d.spId === p.spId && d.closeDate)
      .sort((a, b) => a.closeDate < b.closeDate ? -1 : 1);
    if (!closed.length) return null;
    let streak = 0;
    for (let i = closed.length - 1; i >= 0; i--) {
      if (closed[i].status === 'lost') streak++; else break;
    }
    const win = (from, to) => {
      const w = closed.filter(d => d.closeDate > from && d.closeDate <= to);
      return w.length >= 5 ? w.filter(d => d.status === 'won').length / w.length : null;
    };
    const cur = win(addDays(today, -coef.winRateWindowDays), today);
    const prev = win(addDays(today, -2 * coef.winRateWindowDays), addDays(today, -coef.winRateWindowDays));
    const m = CALC.momentum(streak, prev, cur, coef);
    return m.triggered ? { sp: p, streak, prev, cur, score: m.score } : null;
  }).filter(Boolean);
}
function smallDealLeads(db, spId, today) {
  // ① 高把握小单：历史赢率最高品类中，金额 ≤ aov×0.5 的在库线索/意向
  const coef = resolveCoef(db).m41;
  const deals = XREF.deals(db).filter(d => d.spId === spId);
  const byCat = {};
  deals.filter(d => d.closeDate).forEach(d => {
    const b = byCat[d.category] || (byCat[d.category] = { won:0, n:0 });
    b.n++; if (d.status === 'won') b.won++;
  });
  const bestCat = Object.keys(byCat).sort((a, b) => (byCat[b].won / byCat[b].n) - (byCat[a].won / byCat[a].n))[0];
  const wonAmts = deals.filter(d => d.status === 'won').map(d => d.amountAmt);
  const aov = wonAmts.length ? mean(wonAmts) : null;
  if (!bestCat || aov == null) return { bestCat: null, list: [] };
  return { bestCat, aov,
    list: deals.filter(d => !d.closeDate && d.category === bestCat && d.amountAmt <= aov * coef.smallDealAovX) };
}

/* —— M42 深板凳（榜样匹配） —— */
function m42Board(db, today) {
  const ref = XREF.suanzhang(db);
  if (!ref || !ref.entities.M21Norm) return null;
  const rows = ref.entities.M21Norm.slice().sort((a, b) => a.rankNorm - b.rankNorm);
  const n = rows.length;
  const laggards = rows.filter(r => r.rankNorm > n * (1 - COEF_DEFAULTS.m42.laggardBand));
  const midLine = n * (2 / 3);
  return laggards.map(lag => {
    if (!lag.traj6) return { lag, best: null };
    const candidates = rows.filter(r => r.spId !== lag.spId && r.trajEarly)
      .map(r => ({ spId: r.spId, traj: r.trajEarly, nowBandOk: r.rankNorm <= midLine }));
    return { lag, best: CALC.m42Match(lag.traj6, candidates) };
  });
}

/* —— M43 节奏台 —— */
function paceBoard(db, today) {
  const coef = resolveCoef(db).m43;
  const monthStart = today.slice(0, 8) + '01';
  return activeSps(db).map(p => {
    const q = XREF.quota(db, p.spId);
    if (!q) return { sp: p, zone: null };
    const paid = XREF.deals(db).filter(d => d.spId === p.spId && d.paidDate
      && d.paidDate >= monthStart && d.paidDate <= today);
    const paidAmt = paid.reduce((s, d) => s + d.amountAmt, 0);
    const completion = safeDiv(paidAmt, q.amt);
    const inFlightBig = Math.max(0, ...XREF.deals(db)
      .filter(d => d.spId === p.spId && !d.closeDate && d.contractDate == null)
      .map(d => d.amountAmt), 0);
    const zone = CALC.paceZone(completion, { inFlightBigDealAmt: inFlightBig, monthQuotaAmt: q.amt }, coef);
    // 弃赛区子目标：剩余工作日 × 90 天日均回款 × 1.1
    let sub = null;
    if (zone === 'quit_risk') {
      const monthEnd = addDays(monthStart.slice(0, 8) + '28', 4).slice(0, 8) + '01';
      const remainWd = workdaysIn(db, p.spId, addDays(today, 1), addDays(monthEnd, -1));
      const past = XREF.deals(db).filter(d => d.spId === p.spId && d.paidDate
        && d.paidDate > addDays(today, -90) && d.paidDate <= today);
      const wd90 = workdaysIn(db, p.spId, addDays(today, -90), today);
      const dailyAvg = safeDiv(past.reduce((s, d) => s + d.amountAmt, 0), wd90);
      sub = CALC.subGoalAmt(remainWd, dailyAvg, coef);
    }
    return { sp: p, completion, zone, quota: q, sub };
  });
}

function doseStats(db, today) {
  const coef = resolveCoef(db);
  const from = addDays(today, -30);
  const per = activeSps(db).map(p => {
    const hrs = db.coachingAcks.filter(a => a.spId === p.spId && a.status === 'confirmed'
      && a.date > from && a.date <= today).reduce((s, a) => s + (a.durationHrs || 0), 0);
    return { sp: p, hrs };
  });
  const teamAvg = mean(per.map(x => x.hrs));
  const vets = per.filter(x => {
    const t = tenureDays(db, x.sp.spId, today);
    return t != null && t > coef.m44.tenureYears * 365;
  });
  const vetAvg = vets.length ? mean(vets.map(x => x.hrs)) : null;
  const ratio = CALC.m44aRatio(vetAvg, teamAvg);
  const reported = db.coachingAcks.filter(a => a.date > from && a.date <= today)
    .reduce((s, a) => s + (a.reportedHrs || a.durationHrs || 0), 0);
  const confirmed = db.coachingAcks.filter(a => a.status === 'confirmed' && a.date > from && a.date <= today)
    .reduce((s, a) => s + (a.durationHrs || 0), 0);
  return { per, teamAvg, vetAvg, ratio, vetsCount: vets.length,

function joltBoard(db, today) {
  const ref = XREF.suanzhang(db);
  if (!ref) return [];
  const cats = {};
  (ref.entities.Category || []).forEach(c => cats[c.name] = c.medianStayDays);
  const out = [];
  for (const p of activeSps(db)) {
    const mine = XREF.deals(db).filter(d => d.spId === p.spId);
    const discounted = mine.filter(d => d.discountRate > 0);
    const pRate = mine.length ? discounted.length / mine.length : null;
    for (const d of mine.filter(d => !d.closeDate && d.intentDate)) {
      const median = cats[d.category];
      const r = CALC.joltCheck({ stayDays: diffDays(today, d.intentDate), categoryMedianStayDays: median,
        hasDiscountDuring: d.discountRate > 0, personDiscountRate: pRate,
        othersDiscountRate: teamDiscountRateExcept(db, p.spId) }, resolveCoef(db).joltRule);
      if (r.highHesitation) out.push({ sp: p, deal: d, check: r, median });

  const others = XREF.deals(db).filter(d => d.spId !== spId);

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function renderScatter(pts) {
  if (!pts.length) return '<p class="gray">—（近 90 天日报不足）</p>';
  const W = 660, H = 300, pad = 40;
  const mx = Math.max(...pts.map(p => p.x)) * 1.15 || 1;
  const my = Math.max(...pts.map(p => p.y)) * 1.3 || 1;
  const medX = pts.map(p => p.x).sort((a, b) => a - b)[Math.floor(pts.length / 2)];
  const medY = pts.map(p => p.y).sort((a, b) => a - b)[Math.floor(pts.length / 2)];
  const X = v => pad + (v / mx) * (W - pad - 10);
  const Y = v => H - 30 - (v / my) * (H - 50);
  return `<svg class="scatter" viewBox="0 0 ${W} ${H}">
    <line x1="${pad}" y1="${H - 30}" x2="${W - 5}" y2="${H - 30}" stroke="#ddd"/>
    <line x1="${pad}" y1="10" x2="${pad}" y2="${H - 30}" stroke="#ddd"/>
    <line x1="${X(medX)}" y1="10" x2="${X(medX)}" y2="${H - 30}" stroke="#eee" stroke-dasharray="4 4"/>
    <line x1="${pad}" y1="${Y(medY)}" x2="${W - 5}" y2="${Y(medY)}" stroke="#eee" stroke-dasharray="4 4"/>
    <text x="${W - 60}" y="${H - 12}">量（有效）</text><text x="8" y="20">质</text>
    ${pts.map(p => `<g class="dot" data-act="goto-rx" data-sp="${p.spId}">
      <circle cx="${X(p.x)}" cy="${Y(p.y)}" r="6" fill="var(--accent)" opacity=".75"/>
      <text x="${X(p.x) + 9}" y="${Y(p.y) + 4}">${esc(p.name)}</text></g>`).join('')}
  </svg>`;
}

    benchmark: text.indexOf('配方源') >= 0 ? 1.0 : (text.indexOf('均值') >= 0 ? 0.5 : 0),
    dataRef: /\d/.test(text) ? 1.0 : 0,
    ackRate,
  };

  if (!text) return '<p class="gray" style="margin-top:6px">开始输入，三层校验实时亮灯。</p>';
  const li = (ok, label, extra) => `<div class="li">${ok ? '<span class="tag g">过</span>' : '<span class="tag r">拦</span>'}<span><b>${label}</b>${extra ? ' · ' + esc(extra) : ''}</span></div>`;
  const hints = plvRewriteHint(plv);
  return `<div class="plv-check" style="margin-top:8px">
    ${li(plv.l1.pass, '第一层 · 拦截词库', plv.l1.hits.length ? '命中：' + plv.l1.hits.join('、') : '')}
    ${li(plv.l2.pass, '第二层 · 去人名测试', plv.l2.pass ? '删掉"你/他"后句子仍指向任务' : '删掉"你/他"后句子失去意义——它说的是人，不是事')}

    ${!plv.passed && hints.length ? '<div style="margin-top:6px"><b>系统改写建议：</b>' + hints.map(h => '<div class="gray">· ' + esc(h) + '</div>').join('') + '</div>' : ''}

}

function parseRoute() {
  const h = (location.hash || '#/s1').slice(2);
  const [pathQ, query] = h.split('?');
  const [route, sub] = pathQ.split('/');
  APP.route = SCREENS[route] ? route : 's1';
  APP.sub = sub || null;
  APP.query = {};
  (query || '').split('&').forEach(kv => {

    if (k) APP.query[k] = decodeURIComponent(v || '');
  });

function handleAction(act, el) {
  const db = APP.db, today = APP.today;
  switch (act) {
    case 'seed-demo': seedDemo(db, today); persist(); render(); break;
    case 'wipe': {
      if (!confirm('清空本机全部育人器数据？（不影响其他板块）')) return;
      APP.db = emptyDB(); APP.db.settings.firstRunAt = today; persist(); render(); break;
    }
    case 'set-source': {
      const r = setRecipeSource(db, [el.dataset.sp], today);
      if (r.ok) { persist(); render(); } else alert('闸④未过：' + r.check.fails.join(','));
      break;
    }
    case 'insist-source':
      db.settings.insistLog.push({ date: today, type: 'source', spId: el.dataset.sp });
      persist(); alert('已留痕。系统仍不会把不合格者设为配方源——这不是复制销冠，是把漏水规模化。'); break;
    case 'goto-rx': location.hash = '#/s5?sp=' + el.dataset.sp; break;
    case 'adopt-auto': {
      const sp = document.getElementById('rx-sp').value;
      APP.plvDraft = rxAutoText(db, sp, today) || '';
      render(); break;
    }
    case 'save-rx': case 'save-rx-insist': {
      const sp = document.getElementById('rx-sp').value;
      const text = document.getElementById('rx-text').value.trim();
      if (!text) return;
      const diag = rxDiagnose(db, sp, today);
      const r = savePrescription(db, { employeeId: sp, text, insist: act === 'save-rx-insist',
        type: diag.none ? 'volume' : diag.top.type,
        psiParts: psiPartsFor(db, sp, text, diag) }, today);
      if (r.ok) { APP.plvDraft = ''; persist(); render(); }
      else render();
      break;
    }
    case 'dispatch-auto': {
      const sp = document.getElementById('rx-sp').value;
      const text = rxAutoText(db, sp, today);
      if (!text) return;
      const diag = rxDiagnose(db, sp, today);
      savePrescription(db, { employeeId: sp, text, type: diag.none ? 'volume' : diag.top.type,
        psiParts: psiPartsFor(db, sp, text, diag) }, today);
      persist(); render(); break;
    }
    case 'gen-pairs': {
      const input = m40WeeklyInput(db, today);
      const r = CALC.m40Pairing(input, resolveCoef(db).m40);
      const old = {};
      db.pairAssignments.forEach(pa => { if (pa.status === 'active') old[pa.coachId + '|' + pa.learnerId] = pa.consecutiveWeeks; });
      db.pairAssignments.forEach(pa => { if (pa.status === 'active') pa.status = 'rotated'; });
      r.pairs.forEach(p => db.pairAssignments.push({ pairId: uid('pair'), weekOf: today,
        coachId: p.coachId, learnerId: p.learnerId, topicStage: topicFor(db, p.learnerId, today).stage,
        status: 'active', consecutiveWeeks: (old[p.coachId + '|' + p.learnerId] || 0) + 1, coachAckId: null }));
      persist(); render(); break;
    }
    case 'send-oxygen': {
      const board = m42Board(db, today) || [];
      const entry = board.find(x => x.lag.spId === el.dataset.sp);
      db.settings['oxygen_' + el.dataset.sp] = el.dataset.model;
      persist(); alert('供氧卡已放入 ' + spName(db, el.dataset.sp) + ' 的销售端（只显榜样曲线，无对比）。'); break;
    }
    case 'save-report': {
      const sp = el.dataset.sp;
      const d = el.dataset.date || (document.getElementById('fill-date') || {}).value || today;
      const counts = {};
      ['leads','intents','samples','contracts'].forEach(k => {
        counts[k] = parseInt((document.getElementById('c-' + sp + '-' + k) || {}).value || '0', 10) || 0;
      });
      saveDailyReport(db, { spId: sp, date: d, counts });
      persist(); render(); break;
    }
    case 'save-quota': {
      const v = (document.getElementById('q-' + el.dataset.sp) || {}).value;
      if (v === '') delete db.paceConfig.manualQuotaBySp[el.dataset.sp];
      else db.paceConfig.manualQuotaBySp[el.dataset.sp] = Math.round(parseFloat(v) * 100);
      persist(); render(); break;
    }
    case 'enable-silent': db.settings.silentTrackOn = true; persist(); location.hash = '#/s8/bounty'; render(); break;
    case 'save-bounty': {
      const template = document.getElementById('bt-template').value;
      const amountYuan = parseFloat(document.getElementById('bt-amount').value || '0');
      const r = saveBounty(db, { template, amountAmt: Math.round(amountYuan * 100) }, today);
      if (r.ok) { persist(); location.hash = '#/s8/bounty'; render(); }
      else if (r.talk === 'Y-13') { location.hash = '#/s8/bounty?blocked=' + template; render(); }
      else alert(r.err || '未保存');
      break;
    }
    case 'gen-spot': {
      const k = resolveCoef(db).spotCheck.weeklyK;
      const sps = activeSps(db);
      for (let i = 0; i < k && sps.length; i++) {
        const p = sps[Math.floor(Math.random() * sps.length)];
        const stage = ['leads','intents','samples'][Math.floor(Math.random() * 3)];
        const r = db.dailyReports.filter(x => x.employeeId === p.spId && diffDays(today, x.date) < 7);
        db.spotChecks.push(makeSpotCheckCard(p.spId, today, stage, sumCounts(r)[stage]));
      }
      persist(); render(); break;
    }
    case 'export-env': {
      const env = buildEnvelope(db, today, resolveCoef(db));
      const blob = new Blob([JSON.stringify(env, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'skab_yuren_' + today + '.json';
      a.click();
      db.settings.lastExportAt = today; persist(); render(); break;
    }
    case 'import-env-paste': {
      try {
        const r = importEnvelope(db, JSON.parse(document.getElementById('env-paste').value), today);
        persist(); render();
        if (!r.ok) document.getElementById('env-msg').textContent = r.err;
        else if (r.hashMismatch) document.getElementById('env-msg').textContent = '已导入 ' + r.board + '；⚠ 系数指纹不一致（提示同步，不阻断）';
      } catch (e) { document.getElementById('env-msg').textContent = '不是合法 JSON'; }
      break;
    }
    case 'save-coef': {
      const path = el.dataset.path;
      const v = (document.getElementById('coef-' + path.replace(/\./g, '_')) || {}).value;
      if (v === '') delete db.coefOverrides[path];
      else db.coefOverrides[path] = parseFloat(v);
      persist(); render(); break;
    }
    case 'add-banned': {
      const w = (document.getElementById('plv-add') || {}).value.trim();
      if (w && COEF_DEFAULTS.plvBanned.indexOf(w) < 0) COEF_DEFAULTS.plvBanned.push(w);   // 只增不删
      persist(); render(); break;
    }
    case 'apply-license': {
      const code = (document.getElementById('lic-code') || {}).value.trim();
      verifyLicense(code, APP.today).then(r => {
        APP.license = r;
        if (r.ok) StorageAdapter.write('licenseCode', code);
        render();
      });
      break;
    }
    case 'ack-rx': {
      const rx = db.prescriptions.find(x => x.rxId === el.dataset.rx);
      if (rx) rx.ackedAt = today;
      persist(); render(); break;
    }
    case 'ack-pair': {
      const pa = db.pairAssignments.find(x => x.pairId === el.dataset.pair);
      if (pa) {
        const ack = { ackId: uid('ack'), spId: pa.learnerId, coachId: pa.coachId, date: today,
          durationHrs: resolveCoef(db).m40.sessionMinutes / 60,
          reportedHrs: resolveCoef(db).m40.sessionMinutes / 60, status: 'confirmed' };
        db.coachingAcks.push(ack);
        pa.coachAckId = ack.ackId;
      }
      persist(); render(); break;
    }
    case 'print': window.print(); break;
    case 'noop': alert('该动作在整合期由对应板块承接（占位，不指名消费方）。'); break;
  }
}

function boot() {
  APP.today = new Date().toISOString().slice(0, 10);   // UI 层唯一一处取真实时钟并下传
  const stored = StorageAdapter.read('db', null);
  APP.db = Object.assign(emptyDB(), stored || {});
  ['settings','paceConfig','shiftConfig','externalRef','coefOverrides'].forEach(k => {
    APP.db[k] = Object.assign(emptyDB()[k], (stored || {})[k] || {});
  });
  if (!APP.db.settings.firstRunAt) { APP.db.settings.firstRunAt = APP.today; persist(); }
  const probe = StorageAdapter.probe();
  if (!probe.ok) APP.quotaFail = true;
  parseRoute();
  window.addEventListener('hashchange', () => { parseRoute(); APP.plvDraft = APP.route === 's5' ? APP.plvDraft : ''; render(); });
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el) { e.preventDefault(); handleAction(el.dataset.act, el); }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'rx-text') {
      APP.plvDraft = e.target.value;
      const db = APP.db;
      const plv = CALC.plvCheck(APP.plvDraft, { banned: resolveCoef(db).plvBanned,
        names: db.salespeople.map(p => p.name) });
      const panel = document.getElementById('plv-panel');
      if (panel) panel.innerHTML = renderPlvPanel(plv, APP.plvDraft);
      const btn = document.querySelector('[data-act="save-rx"]');
      if (btn) btn.disabled = !(plv.passed && APP.plvDraft);
    }
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-act-change]');
    if (!el) return;
    const db = APP.db;
    switch (el.dataset.actChange) {
      case 'rx-sp': location.hash = '#/s5?sp=' + el.value; break;
      case 'sales-sp': APP.salesSp = el.value; render(); break;
      case 'fill-date': location.hash = '#/s8/fill?d=' + el.value; break;
      case 'shift': {
        const day = parseInt(el.dataset.day, 10);
        const rest = db.shiftConfig['*'] || [];
        db.shiftConfig['*'] = el.checked ? rest.concat(day) : rest.filter(x => x !== day);
        persist(); render(); break;
      }
      case 'import-env': {
        const f = el.files && el.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const r = importEnvelope(db, JSON.parse(reader.result), APP.today);
            persist(); render();
            const msg = document.getElementById('env-msg');
            if (msg && !r.ok) msg.textContent = r.err;
          } catch (err) {
            const msg = document.getElementById('env-msg');
            if (msg) msg.textContent = '不是合法 JSON';
          }
        };
        reader.readAsText(f);
        break;
      }
    }
  });
  const storedCode = StorageAdapter.read('licenseCode', null);
  if (storedCode && BUILD_MODE !== 'full') {
    verifyLicense(storedCode, APP.today).then(r => { APP.license = r; render(); });
  }
  render();
}
if (typeof document !== 'undefined') boot();

</script>
</body>
</html>
