<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --red:#E23636; --deepred:#B4232A; --ink:#1E1B18; --sub:#5B534D;
    --cream:#FBF6F0; --paper:#FFFFFF; --line:#EADFD3; --gold:#C79A4B;
  }
  body{ font-family:"WenQuanYi Zen Hei","Noto Sans CJK SC",sans-serif; background:#ccc; }
  .card{
    width:1080px; height:1440px; position:relative; overflow:hidden;
    background:var(--cream); color:var(--ink); padding:96px 86px 78px;
    display:flex; flex-direction:column;
  }
  .card.dark{ background:#201A17; color:#F6EFE7; }
  .card.dark .brand,.card.dark .foot{ color:#B9AA9A; }
  .card.dark .sub{ color:#C9BBAC; }
  .card.dark .divider{ background:#3A302A; }
  /* top brand */
  .brand{ display:flex; align-items:center; gap:16px; font-size:26px; letter-spacing:2px;
    color:var(--sub); font-weight:bold; }
  .brand .dot{ width:20px; height:20px; border-radius:50%; background:var(--red); flex:none; }
  .brand .tag{ margin-left:auto; font-size:22px; color:#fff; background:var(--red);
    padding:8px 20px; border-radius:999px; letter-spacing:1px; }
  .card.dark .brand .tag{ background:var(--gold); color:#201A17; }
  /* body area */
  .main{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .kicker{ font-size:34px; color:var(--red); font-weight:bold; margin-bottom:22px; letter-spacing:1px; }
  .card.dark .kicker{ color:var(--gold); }
  h1{ font-size:104px; line-height:1.12; font-weight:bold; letter-spacing:1px; }
  h1.mid{ font-size:82px; }
  h1.sm{ font-size:66px; line-height:1.18; }
  .lead{ font-size:40px; line-height:1.6; color:var(--ink); margin-top:14px; }
  .card.dark .lead{ color:#F0E7DC; }
  .divider{ height:6px; width:120px; background:var(--red); border-radius:3px; margin:30px 0; }
  /* two column */
  .cols{ display:flex; gap:34px; margin-top:20px; }
  .col{ flex:1; background:var(--paper); border:3px solid var(--line); border-radius:26px; padding:40px 36px; }
  .col.bad{ border-color:#E7C9C3; }
  .col.good{ border-color:#CFE3C9; background:#F4F9F1; }
  .col h3{ font-size:44px; margin-bottom:18px; }
  .col.bad h3{ color:var(--deepred); }
  .col.good h3{ color:#3C7A34; }
  .col p{ font-size:31px; line-height:1.55; color:var(--sub); }
  /* list */
  .list{ display:flex; flex-direction:column; gap:30px; margin-top:14px; }
  .item{ background:var(--paper); border-radius:22px; padding:34px 38px;
    box-shadow:0 6px 22px rgba(120,80,40,.06); border-left:12px solid var(--red); }
  .card.dark .item{ background:#2B2320; border-left-color:var(--gold); }
  .item .q{ font-size:38px; font-weight:bold; line-height:1.4; }
  .item .a{ font-size:32px; color:var(--sub); margin-top:10px; line-height:1.5; }
  .card.dark .item .a{ color:#C9BBAC; }
  .item .a b{ color:var(--red); }
  .card.dark .item .a b{ color:var(--gold); }
  /* numbered layers */
  .layers{ display:flex; flex-direction:column; gap:20px; margin-top:10px; }
  .layer{ display:flex; align-items:center; gap:28px; font-size:37px; }
  .layer .n{ width:66px; height:66px; flex:none; border-radius:50%; background:var(--red); color:#fff;
    font-weight:bold; display:flex; align-items:center; justify-content:center; font-size:36px; }
  .card.dark .layer .n{ background:var(--gold); color:#201A17; }
  .layer .t{ font-weight:bold; }
  .layer .d{ color:var(--sub); font-size:31px; }
  .card.dark .layer .d{ color:#C9BBAC; }
  /* toc */
  .toc{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:14px; }
  .vol{ background:var(--paper); border-radius:20px; padding:26px 30px; display:flex; flex-direction:column; }
  .card.dark .vol{ background:#2B2320; }
  .vol .no{ font-size:29px; font-weight:bold; color:var(--red); flex:none; margin-bottom:8px; }
  .card.dark .vol .no{ color:var(--gold); }
  .vol .nm{ font-size:32px; font-weight:bold; line-height:1.25; }
  .vol .ds{ font-size:26px; color:var(--sub); margin-top:10px; line-height:1.4; }
  .card.dark .vol .ds{ color:#C9BBAC; }
  .vol .txt{ display:flex; flex-direction:column; }
  /* switches */
  .sw{ display:flex; flex-direction:column; gap:26px; margin-top:10px; }
  .swi{ background:var(--paper); border-radius:22px; padding:32px 36px; }
  .card.dark .swi{ background:#2B2320; }
  .swi .h{ font-size:40px; font-weight:bold; }
  .swi .h span{ color:var(--red); }
  .card.dark .swi .h span{ color:var(--gold); }
  .swi .p{ font-size:31px; color:var(--sub); margin-top:10px; line-height:1.5; }
  .card.dark .swi .p{ color:#C9BBAC; }
  /* cta */
  .fork{ display:flex; gap:30px; margin-top:26px; }
  .fside{ flex:1; border-radius:24px; padding:40px 34px; }
  .fside.a{ background:#F3EBE4; }
  .fside.b{ background:var(--red); color:#fff; }
  .card.dark .fside.a{ background:#2B2320; }
  .fside .lbl{ font-size:34px; font-weight:bold; margin-bottom:16px; }
  .fside.a .lbl{ color:var(--deepred); }
  .fside p{ font-size:30px; line-height:1.5; }
  .fside.a p{ color:var(--sub); }
  .card.dark .fside.a p{ color:#C9BBAC; }
  .cta-line{ margin-top:34px; text-align:center; font-size:40px; font-weight:bold; }
  .cta-line .pill{ display:inline-block; background:var(--red); color:#fff; padding:14px 40px;
    border-radius:999px; margin-top:20px; }
  .card.dark .cta-line .pill{ background:var(--gold); color:#201A17; }
  .bignum{ font-size:150px; font-weight:bold; color:var(--red); line-height:1; }
  .card.dark .bignum{ color:var(--gold); }
  /* footer */
  .foot{ display:flex; align-items:center; font-size:24px; color:var(--sub); letter-spacing:1px;
    border-top:2px solid var(--line); padding-top:22px; }
  .card.dark .foot{ border-top-color:#3A302A; }
  .foot .pg{ margin-left:auto; font-weight:bold; }
  .note{ font-size:27px; color:var(--sub); margin-top:16px; line-height:1.5; }
  .card.dark .note{ color:#C9BBAC; }
  .hl{ color:var(--red); font-weight:bold; }
  .card.dark .hl{ color:var(--gold); }
</style>
</head>
