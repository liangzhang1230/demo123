<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  :root{
    --ink:#17130D; --ivory:#F5EFE1; --paper:#FBF7EC;
    --red:#E1322A; --reddark:#B7241D; --gold:#CBA24A; --goldlt:#E4C578;
    --muted:#7C7264; --mutedD:#A99E8C;
  }
  html{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif;}
  body{background:#999;}
  .card{ width:1080px; height:1440px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; padding:84px 84px 70px; }
  .blk{font-weight:900;} .med{font-weight:500;} .reg{font-weight:400;}
  /* ---------- shared header / footer ---------- */
  .hd{ display:flex; align-items:center; gap:18px; z-index:5; }
  .hd .bar{ width:52px; height:9px; border-radius:5px; background:var(--red); }
  .hd .kick{ font-weight:900; font-size:31px; letter-spacing:4px; }
  .hd .idx{ margin-left:auto; font-weight:900; font-size:30px; letter-spacing:2px; opacity:.5; }
  .ft{ margin-top:auto; display:flex; align-items:center; padding-top:26px; font-weight:500;
    font-size:25px; letter-spacing:1px; border-top:2px solid rgba(0,0,0,.12); z-index:5; }
  .ft .pg{ margin-left:auto; font-weight:900; letter-spacing:3px; }
  .body{ flex:1; display:flex; flex-direction:column; justify-content:center; z-index:5; }

  /* ---------- LIGHT theme (精选十条) ---------- */
  .light{ background:var(--ivory); color:var(--ink); }
  .light .hd .kick{ color:var(--reddark); }
  .light .ft{ color:var(--muted); border-color:rgba(23,19,13,.14); }

  /* ---------- FULL-BLEED RED cover/CTA ---------- */
  .redbleed{ background:
      radial-gradient(120% 90% at 82% -8%, #F0483F 0%, var(--red) 46%, var(--reddark) 100%);
    color:#FFF3EE; }
  .redbleed .hd .bar{ background:#FFF3EE; } .redbleed .hd .kick{ color:#FFE7E0; }
  .redbleed .hd .idx{ color:#FFF; opacity:.55; }
  .redbleed .ft{ color:#FFD9D0; border-color:rgba(255,255,255,.28); }

  /* ---------- DARK theme (138条) ---------- */
  .dark{ background:radial-gradient(130% 100% at 78% -10%, #241E16 0%, #16120D 55%, #100C08 100%);
    color:var(--ivory); }
  .dark .hd .bar{ background:var(--gold); } .dark .hd .kick{ color:var(--goldlt); }
  .dark .hd .idx{ color:#EDE3D0; opacity:.4; }
  .dark .ft{ color:var(--mutedD); border-color:rgba(255,255,255,.14); }

  /* ---------- type utilities ---------- */
  .hero{ font-weight:900; font-size:360px; line-height:.8; letter-spacing:-10px; }
  .hero.g{ color:var(--goldlt); } .hero.w{ color:#FFF3EE; }
  .tt{ font-weight:900; line-height:1.02; letter-spacing:-1px; }
  .s150{ font-size:150px; } .s132{ font-size:132px; } .s118{ font-size:118px; }
  .s104{ font-size:104px; } .s92{ font-size:92px; } .s84{ font-size:84px; }
  .lead{ font-weight:500; font-size:44px; line-height:1.55; }
  .light .lead{ color:#3B342A; } .redbleed .lead{ color:#FFE7E0; } .dark .lead{ color:#D8CDB9; }
  .muted{ font-weight:500; font-size:32px; letter-spacing:1px; }
  .light .muted{ color:var(--muted); } .dark .muted{ color:var(--mutedD); } .redbleed .muted{ color:#FFD2C8; }
  .red{ color:var(--red); } .dark .gold{ color:var(--goldlt); }
  .under{ background:linear-gradient(transparent 62%, rgba(225,50,42,.30) 62%); }

  .chip{ display:inline-block; font-weight:900; font-size:38px; padding:16px 34px; border-radius:999px;
    background:var(--red); color:#fff; letter-spacing:1px; }
  .chip.o{ background:transparent; border:4px solid rgba(255,255,255,.6); color:#fff; }
  .dark .chip{ background:var(--gold); color:#16120D; }
  .chip.gline{ background:transparent; border:4px solid var(--gold); color:var(--goldlt); }

  .watermark{ position:absolute; font-weight:900; z-index:1; pointer-events:none; }

  /* rows list */
  .rows{ display:flex; flex-direction:column; gap:34px; margin-top:10px; }
  .row{ display:flex; gap:34px; align-items:flex-start; }
  .row .rn{ flex:none; width:96px; height:96px; border-radius:26px; background:var(--red); color:#fff;
    font-weight:900; font-size:52px; display:flex; align-items:center; justify-content:center; }
  .dark .row .rn{ background:var(--gold); color:#16120D; }
  .row .rt{ font-weight:900; font-size:52px; line-height:1.18; }
  .row .rd{ font-weight:500; font-size:34px; line-height:1.4; margin-top:8px; }
  .light .row .rd{ color:var(--muted); } .dark .row .rd{ color:var(--mutedD); }

  /* two-block */
  .duo{ display:flex; flex-direction:column; gap:30px; margin-top:8px; }
  .blkcard{ border-radius:30px; padding:44px 46px; }
  .light .blkcard.a{ background:#EDE3CE; } .light .blkcard.b{ background:var(--ink); color:var(--ivory); }
  .blkcard .bl{ font-weight:900; font-size:46px; margin-bottom:16px; }
  .light .blkcard.a .bl{ color:var(--reddark); } .blkcard.b .bl{ color:var(--goldlt); }
  .blkcard p{ font-weight:500; font-size:36px; line-height:1.5; }
  .light .blkcard.a p{ color:#4A4030; }

  /* grid (toc) */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:8px; }
  .cell{ border-radius:24px; padding:34px 36px; }
  .dark .cell{ background:rgba(255,255,255,.045); border:2px solid rgba(203,162,74,.22); }
  .cell .cno{ font-weight:900; font-size:30px; color:var(--goldlt); margin-bottom:12px; letter-spacing:2px; }
  .cell .cnm{ font-weight:900; font-size:40px; line-height:1.2; }
  .cell .cds{ font-weight:500; font-size:29px; color:var(--mutedD); margin-top:12px; line-height:1.4; }

  /* switches / features */
  .feat{ display:flex; flex-direction:column; gap:26px; margin-top:8px; }
  .fitem{ display:flex; gap:30px; align-items:baseline; }
  .fitem .fn{ font-weight:900; font-size:44px; color:var(--goldlt); flex:none; width:150px; letter-spacing:2px; }
  .fitem .fx{ font-weight:900; font-size:46px; }
  .fitem .fd{ font-weight:500; font-size:32px; color:var(--mutedD); margin-top:6px; line-height:1.42; }

  .pillrow{ display:flex; flex-wrap:wrap; gap:18px; margin-top:6px; }
  .pill{ font-weight:900; font-size:38px; padding:16px 32px; border-radius:18px; }
  .light .pill{ background:#EAE0CB; color:var(--ink); }
  .light .pill.hot{ background:var(--red); color:#fff; }
  .dark .pill{ background:rgba(203,162,74,.14); color:var(--goldlt); border:2px solid rgba(203,162,74,.35); }

  .cta{ display:inline-flex; align-items:center; gap:24px; background:#fff; color:var(--red);
    font-weight:900; font-size:52px; padding:26px 52px; border-radius:999px; }
  .dark .cta{ background:var(--gold); color:#16120D; }
  .redbleed .cta{ background:#FFF3EE; color:var(--reddark); }
  .pricetag{ font-weight:900; font-size:120px; letter-spacing:-2px; }
</style></head><body>
<div id="root"></div>
