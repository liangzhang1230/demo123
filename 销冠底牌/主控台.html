<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂</text></svg>">
<title>销冠底牌 · 主控台</title>
<style>
/* ————— 视觉：销售天天看的表单（台账/化验单家族），不做课程页 ————— */
:root{
  --paper:#f4f2ec; --card:#fffdf8; --line:#d8d3c6; --line2:#e8e4da;
  --ink:#26241f; --ink2:#6b665a; --ink3:#98917f;
  --red:#c1272d; --red-bg:#faf0ef; --green:#2e6e4e; --green-bg:#eef4ef;
  --amber:#8a6d1a; --amber-bg:#f7f2e2; --blue:#2f5b6e; --blue-bg:#e9f0f2;
  --mono:"SF Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  --song:"Songti SC","STSong","SimSun",serif;
  --hei:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--hei);font-size:15px;line-height:1.65;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(0,0,0,.018) 28px)}
h1,h2,h3{font-family:var(--song);font-weight:700;letter-spacing:.02em}
.num,td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;background:none;border:none;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:no-preference){
  .view{animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
}
/* 头部 */
header.mast{border-bottom:3px double var(--line);background:var(--card);padding:14px 16px 10px}
.mast-in{max-width:1060px;margin:0 auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mast h1{font-size:21px}
.mast .sub{color:var(--ink2);font-size:12.5px}
.stamp{margin-left:auto;font-family:var(--song);font-size:12px;color:var(--red);border:1.5px solid var(--red);
  border-radius:4px;padding:1px 8px;transform:rotate(-2deg);opacity:.85;user-select:none;white-space:nowrap}
/* 导航 */
nav.tabs{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
.tabs-in{max-width:1060px;margin:0 auto;display:flex;gap:2px;padding:0 8px}
.tab{padding:10px 13px;white-space:nowrap;color:var(--ink2);border-bottom:2.5px solid transparent;font-size:14.5px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red);font-weight:600}
.tab .k{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-right:4px;border:1px solid var(--line);
  border-radius:3px;padding:0 3.5px;vertical-align:1px}
@media (max-width:640px){.tab .k{display:none}}
/* 布局 */
main{max-width:1060px;margin:0 auto;padding:18px 14px 90px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;
  box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card h2{font-size:16.5px;padding-bottom:8px;border-bottom:1px solid var(--line2);margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.card h2 .tag{font-size:11.5px;color:var(--ink3);font-family:var(--hei);font-weight:400;margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--ink2)}.small{font-size:12.5px}.tiny{font-size:11.5px;color:var(--ink3)}
/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:600;text-align:left;color:var(--ink2);font-size:12px;border-bottom:1.5px solid var(--line);padding:5px 8px}
td{border-bottom:1px solid var(--line2);padding:6.5px 8px;vertical-align:top}
tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto}
/* 徽章 */
.b{display:inline-block;font-size:11px;line-height:1;border-radius:3px;padding:3.5px 6px;white-space:nowrap;font-weight:500}
.b-red{color:var(--red);background:var(--red-bg);border:1px solid #e5c8c6}
.b-green{color:var(--green);background:var(--green-bg);border:1px solid #c6d8cb}
.b-amber{color:var(--amber);background:var(--amber-bg);border:1px solid #e2d5a8}
.b-blue{color:var(--blue);background:var(--blue-bg);border:1px solid #c3d4da}
.b-gray{color:var(--ink2);background:#f1efe8;border:1px solid var(--line2)}
/* 总览 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.2}
.stat .l{font-size:12px;color:var(--ink2);margin-top:2px}
.bar{height:8px;background:#ece9e0;border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--red);border-radius:4px}
.pill-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line2)}
.pill-row:last-child{border-bottom:none}
.pill-row .pn{width:11.5em;flex:none;font-size:13px}
.pill-row .bar{flex:1;margin-top:0}
.pill-row .pv{width:5.5em;flex:none;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
@media (max-width:560px){.pill-row .pn{width:7.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
/* 台账 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.search{flex:1;min-width:190px;display:flex;align-items:center;gap:6px;background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.search input{border:none;background:none;flex:1;font-size:14.5px;color:var(--ink);outline:none;min-width:0}
.search .k{font-family:var(--mono);font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:4px 11px;font-size:12.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ammo{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.a-row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.a-row:last-child{border-bottom:none}
.a-row:hover{background:#faf8f1}
.a-row .id{font-family:var(--mono);font-size:12.5px;color:var(--ink2);flex:none;padding-top:2px}
.a-row .tx{flex:1;font-size:14px;min-width:0}
.a-row .tx .missing{color:var(--ink3);font-style:italic}
.a-row .use{flex:none;display:flex;gap:4px;flex-direction:column;align-items:flex-end}
.a-row .ck{flex:none;width:17px;height:17px;border:1.5px solid var(--line);border-radius:3px;margin-top:3px;
  display:grid;place-items:center;font-size:11px;color:#fff}
.a-row.sel{background:var(--red-bg)}
.a-row.sel .ck{background:var(--red);border-color:var(--red)}
.a-empty{padding:26px;text-align:center;color:var(--ink3)}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:#f3f1ea;display:none}
.cartbar.on{display:block}
.cartbar-in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:11px 16px}
.cartbar .n{font-family:var(--mono);font-weight:600}
.cartbar button{border:1px solid #6a6558;border-radius:5px;padding:6px 13px;color:#f3f1ea;font-size:13.5px}
.cartbar button.go{background:var(--red);border-color:var(--red);font-weight:600}
/* 产品线 */
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
.pack{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--card)}
.pack .nm{font-family:var(--song);font-weight:700;font-size:15px;margin-bottom:2px}
.pack .gate{font-size:12.5px;color:var(--ink2);min-height:2.6em}
.pack .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.stars{color:var(--red);font-size:11px;letter-spacing:1px}
.callout{border-left:3px solid var(--red);background:var(--red-bg);border-radius:0 6px 6px 0;padding:10px 13px;margin:12px 0;font-size:13.5px}
.callout.blue{border-left-color:var(--blue);background:var(--blue-bg)}
.callout.amber{border-left-color:var(--amber);background:var(--amber-bg)}
/* 验收台 */
textarea.scan{width:100%;min-height:170px;border:1px solid var(--line);border-radius:6px;background:var(--card);
  padding:11px;font-size:13.5px;font-family:var(--hei);color:var(--ink);resize:vertical}
.btn{display:inline-block;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:7px 15px;font-size:13.5px;font-weight:500}
.btn:hover{background:#f6f4ed}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#a92026}
.scan-out{margin-top:12px}
.rule{border:1px solid var(--line2);border-radius:6px;padding:9px 12px;margin-bottom:8px;font-size:13.5px}
.rule .h{display:flex;gap:8px;align-items:baseline}
.rule .h .st{font-weight:700;flex:none}
.rule.ok .st{color:var(--green)} .rule.bad{border-color:#e0b7b5;background:var(--red-bg)} .rule.bad .st{color:var(--red)}
.rule.warn{border-color:#ddcea0;background:var(--amber-bg)} .rule.warn .st{color:var(--amber)}
.rule .hits{margin-top:5px;font-size:12.5px;color:var(--ink2)}
.rule .hits code{font-family:var(--mono);background:#fff;border:1px solid var(--line2);border-radius:3px;padding:0 4px;font-size:11.5px}
.ck-group{margin-bottom:14px}
.ck-group>.g{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.ck-item{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed var(--line2);cursor:pointer}
.ck-item input{margin-top:4px;accent-color:var(--red);width:15px;height:15px;flex:none;cursor:pointer}
.ck-item span{font-size:13.5px}
.ck-item.done span{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.verdict{margin-top:12px;padding:11px 13px;border-radius:6px;font-family:var(--song);font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
.verdict.pass{background:var(--green-bg);color:var(--green);border:1px solid #c6d8cb}
.verdict.fail{background:var(--red-bg);color:var(--red);border:1px solid #e5c8c6}
input.name-in{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:7px 10px;font-size:14px;color:var(--ink);min-width:0}
/* 规范速查 */
details.spec{border:1px solid var(--line);border-radius:6px;background:var(--card);margin-bottom:9px;overflow:hidden}
details.spec summary{cursor:pointer;padding:11px 14px;font-family:var(--song);font-weight:700;font-size:15px;list-style:none;display:flex;gap:8px;align-items:baseline}
details.spec summary::-webkit-details-marker{display:none}
details.spec summary::before{content:"＋";color:var(--ink3);font-family:var(--mono)}
details.spec[open] summary::before{content:"－"}
details.spec .bd{padding:2px 14px 13px;border-top:1px solid var(--line2);font-size:13.5px}
.bd p{margin:8px 0}
.bd ol,.bd ul{margin:6px 0 6px 1.4em}
.bd li{margin:4px 0}
blockquote.law{border-left:3px solid var(--amber);background:var(--amber-bg);padding:9px 12px;border-radius:0 6px 6px 0;font-size:13px;margin:8px 0}
.chipset{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.chipset .w{font-size:12px;background:var(--red-bg);color:var(--red);border:1px solid #e5c8c6;border-radius:3px;padding:2px 7px}
/* 弹窗 */
dialog{border:none;border-radius:8px;padding:0;max-width:640px;width:calc(100vw - 28px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(30,28,22,.45)}
.dlg-h{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line2)}
.dlg-h h3{font-size:16px}
.dlg-h button{margin-left:auto;font-size:19px;color:var(--ink3);line-height:1;padding:2px 6px}
.dlg-b{padding:14px 16px;max-height:60vh;overflow:auto}
.dlg-b pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all;background:#f6f4ed;
  border:1px solid var(--line2);border-radius:6px;padding:11px;line-height:1.55}
.dlg-f{padding:12px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end}
/* 其他 */
footer.foot{border-top:1px solid var(--line);color:var(--ink3);font-size:12px;text-align:center;padding:18px 14px 24px}
.selfcheck{display:none;background:var(--red);color:#fff;padding:9px 16px;font-size:13px;text-align:center}
.selfcheck.on{display:block}
.toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  border-radius:6px;padding:8px 16px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.quote{font-family:var(--song);font-size:15px;border-left:3px solid var(--ink);padding:8px 14px;background:#f6f4ed;border-radius:0 6px 6px 0;margin:10px 0}
</style>
</head>

<header class="mast">

  if (ALL.length !== 127) errs.push("条目总数 " + ALL.length + " ≠ 127");
  if (USED_N !== 37) errs.push("已动用数 " + USED_N + " ≠ 37");
  if (VALID_IDS.size !== ALL.length) errs.push("存在重复编号");
  STOPPED.forEach(s => { if (VALID_IDS.has(s)) errs.push("停用号 " + s + " 出现在台账中"); });

  PILLARS.forEach(p => {
    const un = p.items.filter(it => it[2] === 0).length;
    const [et, eu] = expect[p.k];
    if (p.items.length !== et) errs.push(p.k + " 总数 " + p.items.length + " ≠ " + et);
    if (un !== eu) errs.push(p.k + " 未动用 " + un + " ≠ " + eu);
  });
  OVERLAP.forEach(id => {
    const e = ALL.find(a => a.id === id);
    if (!e || e.u !== 3) errs.push("重叠条目 " + id + " 未标记为双包共用");

  }
})();

function toast(msg){

function copyText(text, doneMsg){
  const done = () => toast(doneMsg || "已复制");
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ toast("复制失败，请手动选择文本"); }
  document.body.removeChild(ta);
}

/* ============================================================
   视图 4 · 验收台（自动扫描 + 十二项人工清单）
   ============================================================ */
function scanDraft(text){
  const lines = text.split("\n");
  const find = (re) => {
    const hits = [];
    lines.forEach((ln, i) => {
      let m; const r = new RegExp(re.source, re.flags.includes("g") ? re.flags : re.flags + "g");
      while ((m = r.exec(ln)) !== null){
        hits.push({line: i+1, text: m[0]});
        if (m.index === r.lastIndex) r.lastIndex++;
      }
    });
    return hits;
  };
  const rules = [];
  // 1 停用编号（§6.5-4）
  const stopped = find(/底(?:108|111|112)/);
  rules.push({lv: stopped.length ? "bad" : "ok", name:"停用编号（底108/底111/底112 不许出现）", hits: stopped,
    note: stopped.length ? "必须替换：底111→底006、底112→底014、底108→底018" : "未发现"});
  // 2 未知编号
  const refs = find(/底\d{3}/);
  const unknown = refs.filter(h => !VALID_IDS.has(h.text) && !STOPPED.includes(h.text));
  rules.push({lv: unknown.length ? "bad" : "ok", name:"编号存在性（引用的编号必须在 127 条台账内）", hits: unknown,
    note: unknown.length ? "台账中不存在这些编号——极可能是编造或笔误" : (refs.length ? "共引用 " + refs.length + " 处编号，全部存在" : "全文未引用编号")});
  // 3 禁用词（§5.7-6）
  const banned = BANNED.flatMap(w => find(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))));
  rules.push({lv: banned.length ? "bad" : "ok", name:"禁用词（赋能/抓手/闭环/底层逻辑/方法论/心智/颗粒度/打法/组合拳）", hits: banned,
    note: banned.length ? "命中即退回（§6.5 第 12 项要求命中数为 0）" : "命中数 0"});
  // 4 禁用套路
  const tao = BANNED_TAO.flatMap(w => find(new RegExp(w)));
  rules.push({lv: tao.length ? "bad" : "ok", name:"禁用套路（三天开单 / 月入十万 / 销冠神话）", hits: tao, note: tao.length ? "零成本信号，直接删除" : "未发现"});
  // 5 无主语引用（§6.5-5）
  const vague = find(/(?:研究表明|科学证明|实验证明|有研究显示)/);
  rules.push({lv: vague.length ? "bad" : "ok", name:"无主语引用（\"研究表明\"\"科学证明\"类）", hits: vague,
    note: vague.length ? "改为带编号的溯源引用（✅ + 底XXX），或删除" : "未发现"});
  // 6 天花板（作褒义时禁用）——机器判不了语义，交人工
  const tfb = find(/天花板/);
  rules.push({lv: tfb.length ? "warn" : "ok", name:"\"天花板\"（作褒义时禁用，需人工判断语境）", hits: tfb, note: tfb.length ? "逐处确认是否褒义用法" : "未发现"});
  // 7 凑数结构
  const struct = find(/[一二三四五六七八九十\d]大[一-龥]{1,4}/);
  rules.push({lv: struct.length ? "warn" : "ok", name:"\"X大Y\"式凑数结构（如\"五大维度\"\"三大核心\"）", hits: struct, note: struct.length ? "疑似凑数结构，人工确认" : "未发现"});
  // 8 三标记统计
  const nOk = (text.match(/✅/g) || []).length, nTool = (text.match(/🔧/g) || []).length, nWarn = (text.match(/⚠/g) || []).length;
  rules.push({lv: (nOk + nTool + nWarn) ? "ok" : "warn", name:"三标记统计",
    hits: [], note:`✅ ${nOk} 处 · 🔧 ${nTool} 处 · ⚠️ ${nWarn} 处。` + (nOk ? "（人工必做：随机抽三条 ✅ 回母本核对——AI 编造的引用，看起来永远比真的更整齐）" : "全文无标记——若是付费包正文则不合格")});
  return rules;
}

  $("#scanDemo").addEventListener("click", () => {
    $("#scanIn").value = [
      "🔧 用五大维度拆解你的底层逻辑，形成销售打法闭环。",
      "研究表明，勤奋的销售三天开单不是梦（底111）。",
      "✅ 非要挑\"最好\"那份工作的人，工资高了20%，人却更难受（底126）。",
      "价格谈不下来时，给一组等值选项让对方挑（底086）。"
    ].join("\n");
    toast("已填入示例，点「开始扫描」看它怎么被拦下");
  });
  if (!v.dataset.bound){ v.dataset.bound = "1"; v.addEventListener("change", e => {
    const cb = e.target.closest("input[type=checkbox]");
    if (cb){
      checks[+cb.dataset.i] = cb.checked;
      store.set("skdp.checks.v1", checks);
      cb.closest(".ck-item").classList.toggle("done", cb.checked);
      paintVerdict();
    }
  }); }
  $("#deliverName").addEventListener("input", e => {
    deliverName = e.target.value; store.set("skdp.deliver.v1", deliverName);
  });
  $("#ckReset").addEventListener("click", () => {
    checks = Array(12).fill(false); store.set("skdp.checks.v1", checks);
    renderQA(); toast("清单已清零");
  });
  $("#ckReport").addEventListener("click", () => {
    const flat = CHECKLIST.flatMap(g => g.items.map(it => ({g: g.g, it})));
    const n = checks.filter(Boolean).length;
    const md = [
      "# 验收报告 · " + (deliverName || "（未命名交付物）"),
      "",
      "依据：主控文档 v1.1 §6.5 十二项验收清单。**一项不过就退回重做。**",
      "",
      ...flat.map((f, i) => `- [${checks[i] ? "x" : " "}] ${i+1}. ${f.it}`),
      "",
      "结果：**" + n + " / 12** 通过。" + (n === 12 ? "✅ 可以交付。" : "🔴 未过 " + (12-n) + " 项，退回。"),
      "",
      "> 人工必做：随机抽三条 ✅ 回母本核对编号、数字、出处是否逐字一致。AI 编造的引用，看起来永远比真的更整齐。"
    ].join("\n");
    openDlg("验收报告（Markdown）", md);
  });
  paintVerdict();
}
function paintVerdict(){
  const n = checks.filter(Boolean).length;
  const el = $("#verdict");
  if (!el) return;
  el.innerHTML = n === 12
    ? `<div class="verdict pass">✅ 12 / 12 全部通过 —— 可以交付</div>`
    : `<div class="verdict fail">🔴 ${n} / 12 —— 未过 ${12-n} 项，不许交付</div>`;
}

$("#dlgX").addEventListener("click", () => $("#dlg").close());

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || e.target.isContentEditable;
  if (e.key === "Escape"){
    if ($("#dlg").open){ $("#dlg").close(); return; }
    if (typing){ e.target.blur(); return; }
    if (current === "ammo" && query){ query = ""; const q = $("#q"); if (q) q.value = ""; paintAmmoList(); }
    return;
  }
  if (typing) return;
  if (e.key === "/"){ e.preventDefault(); switchTo("ammo"); const q = $("#q"); if (q) q.focus(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= TABS.length) switchTo(TABS[n-1].id);
});
