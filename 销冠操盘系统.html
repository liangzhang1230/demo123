<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销冠操盘系统 · 一体版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
/* ============================================================
   销冠操盘系统 · 一体版 — 设计系统（双极简：Linear/Stripe 密度 + 金融级数字排版）
   亮/暗双主题；全部数字 tabular-nums；1px 发丝线承重；高信息密度
   ============================================================ */
:root{
  --bg:#f5f5f2; --card:#ffffff; --panel:#f7f7f4; --panel2:#efefeb;
  --ink:#191a1e; --ink2:#5b6070; --ink3:#8a8f9c; --ink4:#c6c9d1;
  --line:#e5e5e0; --line2:#d8d8d2;
  --accent:#4f46e5; --accent2:#7c5cf6; --accent-soft:#eef0fe; --accent-ink:#3730a3;
  --green:#137333; --green-soft:#e6f4ea;
  --amber:#b25e09; --amber-soft:#fdf1df;
  --red:#c5221f;  --red-soft:#fce8e6; --red-hero:#d93025;
  --gold:#8a6d1b; --gold-soft:#faf3d9;
  --blue:#1a56db; --blue-soft:#eaf1fe;
  --shadow:0 1px 2px rgba(20,22,30,.05),0 4px 14px rgba(20,22,30,.04);
  --radius:10px; --radius-sm:7px;
}
:root[data-theme="dark"]{
  --bg:#0e1015; --card:#161921; --panel:#1b1f29; --panel2:#222633;
  --ink:#e8eaf0; --ink2:#a2a8b8; --ink3:#6d7385; --ink4:#3c4152;
  --line:#262b38; --line2:#303648;
  --accent:#8b85ff; --accent2:#a78bfa; --accent-soft:#232345; --accent-ink:#c4c0ff;
  --green:#5dc389; --green-soft:#12291c;
  --amber:#e5a558; --amber-soft:#2e2214;
  --red:#f28b82;  --red-soft:#331b19; --red-hero:#ff6b60;
  --gold:#d9bc6a; --gold-soft:#2c2513;
  --blue:#7ab0ff; --blue-soft:#15233a;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  font-feature-settings:"tnum","cnum";
}
::selection{background:var(--accent);color:#fff}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:var(--radius-sm);padding:5px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
input[type=range]{padding:0;border:none;box-shadow:none;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
input.err{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
h1,h2,h3,h4{font-weight:650;letter-spacing:-.01em}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}

/* ---------- 顶部导航 ---------- */
#topnav{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:2px;padding:0 14px;height:48px}
#topnav .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-right:14px;white-space:nowrap}
#topnav .brand .logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
#topnav .brand small{color:var(--ink3);font-weight:500;font-size:11px}
.nav-tab{padding:5px 11px;border-radius:8px;color:var(--ink2);font-weight:550;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.nav-tab:hover{background:var(--panel);color:var(--ink)}
.nav-tab.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:650}
.nav-tab .dotwarn{width:6px;height:6px;border-radius:50%;background:var(--red-hero);display:inline-block}
#topnav .sp{flex:1}
/* 定价板块：顶部导航项下拉快速跳转（悬停 / 键盘聚焦展开） */
.nav-drop{position:relative;display:inline-flex}
.nav-caret{font-size:9px;opacity:.65;margin-left:1px}
.nav-drop::after{content:"";position:absolute;top:100%;left:0;right:0;height:8px}   /* 悬停桥，跨过间隙不丢焦 */
.nav-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:172px;z-index:70;
  display:none;flex-direction:column;gap:2px;padding:6px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  box-shadow:0 14px 34px -10px rgba(0,0,0,.30)}
.nav-drop:hover>.nav-menu,.nav-drop:focus-within>.nav-menu{display:flex}
.nav-menu-item{text-align:left;padding:7px 11px;border-radius:8px;font-size:12.8px;font-weight:550;color:var(--ink2);white-space:nowrap}
.nav-menu-item:hover{background:var(--panel);color:var(--ink)}
.nav-menu-item.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:650}
.icon-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:14px}
.icon-btn:hover{background:var(--panel);color:var(--ink)}

/* ---------- 全局实时指标条 ---------- */
#livebar{position:sticky;top:48px;z-index:55;display:flex;align-items:stretch;overflow-x:auto;
  background:var(--card);border-bottom:1px solid var(--line);padding:0 10px;min-height:44px;scrollbar-width:none}
#livebar::-webkit-scrollbar{display:none}
.lv-cell{flex:1;min-width:96px;padding:5px 10px;border-right:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.lv-cell:last-child{border-right:none}
.lv-cell:hover{background:var(--panel)}
.lv-cell .k{font-size:10.5px;color:var(--ink3);white-space:nowrap;letter-spacing:.02em}
.lv-cell .v{font-size:14.5px;font-weight:700;white-space:nowrap;line-height:1.25}
.lv-cell .v.red{color:var(--red-hero)} .lv-cell .v.green{color:var(--green)} .lv-cell .v.amber{color:var(--amber)} .lv-cell .v.dim{color:var(--ink3);font-weight:550}

/* ---------- 子导航（跟随吸顶：topnav 48 + livebar 45 = 93） ---------- */
#subnav{position:sticky;top:93px;z-index:54;padding:10px 18px;max-width:1280px;margin:0 auto}
.sub-tabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.sub-picker{display:none}
#subnav::before{content:"";position:absolute;top:0;bottom:0;left:calc(-50vw + 50%);width:100vw;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(160%) blur(10px);
  border-bottom:1px solid var(--line);z-index:-1}
#subnav:empty{display:none}
.sub-tab{padding:4px 11px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2);font-size:12.5px;font-weight:550;background:var(--card)}
.sub-tab:hover{color:var(--ink);border-color:var(--ink4)}
.sub-tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-theme="dark"] .sub-tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- 主体 ---------- */
#view{max-width:1280px;margin:0 auto;padding:14px 18px 90px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1fr 2fr}
.span2{grid-column:span 2}
.g-hero{grid-template-columns:1.5fr 1fr;align-items:start}
@media (max-width:980px){.g2,.g3,.g4,.g23,.g32{grid-template-columns:1fr}.span2{grid-column:span 1}}
@media (max-width:760px){.g-hero{grid-template-columns:1fr}}
/* ═══════════ 手机 / 平板移动壳（桌面 ≥1024 完全不受影响） ═══════════
   世界顶级做法：主导航下沉为底部标签栏(4 常驻 + 更多)，横排指标重排为 KPI 卡片网格，
   子导航吸顶胶囊，内容单列。渐进披露：一眼见核心，细节点开。 */
#bottomnav, #moresheet{display:none}                    /* 桌面隐藏，仅移动壳启用 */

@media (max-width:1023px){
  /* —— 顶部：仅留品牌 + 右侧工具（板块切换交给底部栏） —— */
  #topnav{padding:0 12px}
  #topnav .nav-tab, #topnav .nav-drop{display:none}     /* 顶部板块 tab 让位给底部栏 */
  #topnav .brand small{display:none}

  /* —— 指标条 → KPI 卡片网格（重排不缩放，滚动即见全部） —— */
  #livebar{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
    gap:8px;padding:10px 12px;overflow:visible;min-height:0;border-bottom:none;background:transparent}
  .lv-cell{border:1px solid var(--line);border-right:1px solid var(--line);border-radius:11px;
    background:var(--card);padding:9px 11px;box-shadow:var(--shadow);min-width:0}
  .lv-cell .k{white-space:normal}
  .lv-cell .v{font-size:16px;white-space:normal}

  /* —— 二级导航：下拉选择器（当前页 + 一览全部，永不横滑藏页；与底部一级栏区分） —— */
  #subnav{top:48px;z-index:54;padding:8px 12px;max-width:none}
  #subnav::before{background:color-mix(in srgb,var(--card) 92%,transparent)}
  .sub-picker{display:flex;align-items:center;gap:8px;width:100%;padding:10px 13px;border-radius:12px;
    border:1px solid var(--line2);background:var(--card);font-size:13.5px;font-weight:650;color:var(--ink);box-shadow:var(--shadow)}
  .sub-picker .sp-cur{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub-picker .sp-meta{flex:0 0 auto;font-size:11px;color:var(--ink3);font-weight:600;background:var(--panel);border-radius:99px;padding:1px 8px}
  .sub-picker .sp-car{flex:0 0 auto;color:var(--ink3);font-size:11px;transition:transform .16s}
  .sub-picker[aria-expanded="true"] .sp-car{transform:rotate(180deg)}
  .sub-tabs{display:none}
  .sub-tabs.open{display:flex;flex-direction:column;gap:2px;position:absolute;left:12px;right:12px;top:calc(100% - 3px);
    z-index:70;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 18px 46px -12px rgba(0,0,0,.38);max-height:64vh;overflow:auto}
  .sub-tabs.open .sub-tab{width:100%;text-align:left;border:none;border-radius:9px;padding:11px 12px;
    font-size:13.5px;font-weight:600;background:transparent;color:var(--ink2)}
  .sub-tabs.open .sub-tab.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}

  /* —— 落地内容：区段标题「一上一下」——标题在上、副标在下，不再左右挤压 —— */
  .sect{flex-direction:column;align-items:flex-start;gap:2px;margin:16px 0 8px}
  .sect .sub{font-size:12px;line-height:1.55}

  /* —— 定价下拉在移动端不用（底部栏 + 吸顶子标签已覆盖切换） —— */
  .nav-caret, .nav-drop::after{display:none}
  .nav-menu{display:none!important}

  /* —— 内容：单列 + 让出底部栏高度 —— */
  #view{padding:12px 14px calc(66px + env(safe-area-inset-bottom))}
  .footer-note{padding-bottom:calc(20px + 66px + env(safe-area-inset-bottom))}
  .g-hero{grid-template-columns:1fr}

  /* —— 底部标签栏（拇指区，5 槽：4 板块 + 更多） —— */
  #bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;
    background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:saturate(160%) blur(12px);
    border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px -12px rgba(0,0,0,.25)}
  .bn-tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:5px 2px;border-radius:12px;color:var(--ink3);font-weight:600;min-width:0}
  .bn-tab .bn-ic{position:relative;font-size:19px;line-height:1}
  .bn-tab .bn-lb{font-size:10.5px;letter-spacing:.01em;white-space:nowrap}
  .bn-tab.on{color:var(--accent-ink);background:var(--accent-soft)}
  .bn-dot{position:absolute;top:-2px;right:-6px;width:7px;height:7px;border-radius:50%;
    background:var(--red-hero);border:1.5px solid var(--card)}

  /* —— 「更多」抽屉（底部半屏卡片，遮罩点击关闭） —— */
  #moresheet.open{display:block;position:fixed;inset:0;z-index:90}
  #moresheet .ms-scrim{position:absolute;inset:0;background:rgba(15,18,30,.42);
    animation:ms-fade .18s ease}
  #moresheet .ms-panel{position:absolute;left:0;right:0;bottom:0;
    background:var(--card);border-radius:18px 18px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -14px 40px -12px rgba(0,0,0,.4);animation:ms-up .22s cubic-bezier(.22,1,.36,1)}
  .ms-grab{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:6px auto 12px}
  .ms-head{font-size:13px;font-weight:700;color:var(--ink2);margin:0 2px 12px}
  .ms-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .ms-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:14px 6px;border:1px solid var(--line);border-radius:14px;background:var(--panel);
    color:var(--ink2);font-weight:600}
  .ms-item .ms-ic{font-size:24px;line-height:1}
  .ms-item .ms-lb{font-size:11.5px}
  .ms-item.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
  .ms-item .bn-dot{top:8px;right:calc(50% - 22px)}
  @keyframes ms-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes ms-fade{from{opacity:0}to{opacity:1}}
}
@media (max-width:560px){ .ms-grid{grid-template-columns:repeat(3,1fr)} }
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.card.flat{box-shadow:none}
.card>h3{font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:9px}
.card>h3 .sub{color:var(--ink3);font-weight:450;font-size:12px}
.card>h3 .right{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:450}
.sect{margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
.sect h2{font-size:16px}
.sect .sub{color:var(--ink3);font-size:12.5px}
.hero{font-size:40px;font-weight:750;letter-spacing:-.02em;line-height:1.1;margin:2px 0}
.hero.sm{font-size:28px}
.hero.red{color:var(--red-hero)} .hero.green{color:var(--green)} .hero.amber{color:var(--amber)} .hero.accent{color:var(--accent)}
.hint{color:var(--ink3);font-size:12px}
.src{color:var(--ink3);font-size:11.5px;margin-top:6px;line-height:1.45}
.src::before{content:"📎 "}
.divider{border-top:1px solid var(--line);margin:10px 0}

/* ---------- 徽章 / 灯 / 仪表 ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:1.5px 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.plain::before{display:none}
.badge.g{background:var(--green-soft);color:var(--green)}
.badge.a{background:var(--amber-soft);color:var(--amber)}
.badge.r{background:var(--red-soft);color:var(--red)}
.badge.b{background:var(--blue-soft);color:var(--blue)}
.badge.n{background:var(--panel2);color:var(--ink2)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.acc{background:var(--accent-soft);color:var(--accent-ink)}
.meter{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;position:relative;margin-top:4px}
.meter>i{display:block;height:100%;border-radius:3px;background:var(--green)}
.meter>i.a{background:var(--amber)} .meter>i.r{background:var(--red-hero)} .meter>i.acc{background:var(--accent)}
.meter .band{position:absolute;top:-2px;bottom:-2px;border-left:1.5px solid var(--ink4);opacity:.85}

/* ---------- 键值行 / 表格 ---------- */
.kv{display:flex;justify-content:space-between;gap:10px;padding:4.5px 0;border-bottom:1px dashed var(--line);font-size:12.8px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:650;white-space:nowrap}
.kv .k{color:var(--ink2)}
.kv.total{border-top:1.5px solid var(--line2);border-bottom:none;padding-top:7px;font-weight:700}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{color:var(--ink3);font-weight:600;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;font-size:11.5px}
.tbl td{padding:5.5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--panel)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5.5px 13px;border-radius:8px;font-size:12.8px;font-weight:600;
  border:1px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink4);background:var(--panel)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line2))}
.btn.sm{padding:2.5px 9px;font-size:11.8px;border-radius:7px}
.btn.ghost{border-color:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 提示条 / 行动卡 ---------- */
.banner{border-radius:var(--radius-sm);padding:9px 12px;font-size:12.6px;margin:8px 0;border:1px solid transparent;line-height:1.5}
.banner.r{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 22%,transparent)}
.banner.a{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 22%,transparent)}
.banner.g{background:var(--green-soft);color:var(--green)}
.banner.b{background:var(--blue-soft);color:var(--blue)}
.banner.n{background:var(--panel);color:var(--ink2)}
.action-card{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius-sm);
  padding:10px 12px;margin:8px 0;background:var(--card);font-size:12.8px}
.action-card.r{border-left-color:var(--red-hero)} .action-card.a{border-left-color:var(--amber)}
.action-card.g{border-left-color:var(--green)} .action-card.gold{border-left-color:var(--gold)}
.action-card h4{font-size:12.8px;margin-bottom:3px}
.killer{background:var(--panel);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.6px;color:var(--ink2);margin-top:9px;font-style:normal}
.callout{border:1px dashed var(--line2);border-radius:var(--radius-sm);padding:9px 12px;color:var(--ink2);font-size:12.3px;margin-top:8px}

/* ---------- 折叠 ---------- */
details.acc{border:1px solid var(--line);border-radius:var(--radius-sm);margin:7px 0;background:var(--card)}
details.acc>summary{cursor:pointer;padding:8px 12px;font-weight:600;font-size:12.8px;list-style:none;display:flex;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"›";margin-left:auto;color:var(--ink3);transform:rotate(90deg);transition:transform .15s}
details.acc[open]>summary::after{transform:rotate(-90deg)}
details.acc>.acc-body{padding:2px 12px 11px;font-size:12.6px;border-top:1px solid var(--line)}

/* ---------- 表单 ---------- */
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>label{font-size:11.8px;color:var(--ink2);font-weight:600;display:flex;gap:5px;align-items:center}
.field .hint{font-size:11px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
@media (max-width:700px){.frm{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg>button{padding:4.5px 11px;font-size:12.3px;color:var(--ink2);border-right:1px solid var(--line2);background:var(--card);font-weight:550}
.seg>button:last-child{border-right:none}
.seg>button.on{background:var(--accent);color:#fff}
.linked{color:var(--accent);font-size:10.5px;font-weight:650;border:1px solid currentColor;border-radius:4px;padding:0 4px}

/* ---------- 状态点 ---------- */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
.dot.g{background:var(--green)} .dot.a{background:var(--amber)} .dot.r{background:var(--red-hero)} .dot.n{background:var(--ink4)}

/* ---------- 弹层 / toast / 命令面板 ---------- */
#modal-root{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;
  background:rgba(12,14,20,.45);padding:7vh 16px;overflow:auto}
#modal-root.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.28);
  width:min(660px,100%);padding:18px 20px}
.modal h3{font-size:15px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:99;
  background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:12.8px;font-weight:600;
  transition:all .22s;pointer-events:none;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#palette{position:fixed;inset:0;z-index:95;display:none;align-items:flex-start;justify-content:center;background:rgba(12,14,20,.4);padding-top:12vh}
#palette.open{display:flex}
#palette .pal{width:min(520px,92vw);background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.3)}
#palette input{width:100%;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:12px 16px;font-size:14px;background:transparent}
#palette .pal-list{max-height:330px;overflow:auto;padding:6px}
#palette .pal-it{padding:8px 12px;border-radius:8px;font-size:13px;display:flex;gap:8px;cursor:pointer}
#palette .pal-it.sel,#palette .pal-it:hover{background:var(--accent-soft);color:var(--accent-ink)}
#palette .pal-it small{margin-left:auto;color:var(--ink3)}

/* ---------- sparkline / 散点 ---------- */
.spark{width:100%;height:46px}
svg text{fill:var(--ink3);font-size:9.5px}
svg .axis{stroke:var(--line2)}

/* ---------- KPI 网格 ---------- */
.kpi{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);cursor:pointer;min-width:0}
.kpi:hover{border-color:var(--ink4)}
.kpi .k{font-size:11px;color:var(--ink3);white-space:nowrap}
.kpi .v{font-size:20px;font-weight:750;letter-spacing:-.01em;line-height:1.2;white-space:nowrap}
.kpi .s{font-size:11px;color:var(--ink3)}
.kpi .v.red{color:var(--red-hero)}.kpi .v.green{color:var(--green)}.kpi .v.amber{color:var(--amber)}.kpi .v.accent{color:var(--accent)}

/* ---------- 打印 ---------- */
@media print{
  #topnav,#livebar,#subnav,.no-print,#toast,#modal-root,#palette{display:none!important}
  body{background:#fff;color:#000}
  #view{max-width:none;padding:0}
  .card{box-shadow:none;break-inside:avoid}
  .print-foot{display:block!important;margin-top:16px;padding-top:8px;border-top:1px solid #999;font-size:10.5px;color:#555}
}
.print-foot{display:none}
.footer-note{max-width:1280px;margin:0 auto;padding:0 18px 26px;color:var(--ink3);font-size:11.5px}

</style>

/* ===== 01-kernel.js ===== */
/* ============================================================

   比率 0–1；日期 'YYYY-MM-DD' UTC；系数只经 getCoef（覆盖层优先）。
   ============================================================ */
const SK = (() => {
  'use strict';
  const YUAN = 100, WAN = 1000000;

  /* ---------- 基础工具 ---------- */
  const safeDiv = (a, b) => (b === 0 || b == null || a == null || !isFinite(b)) ? null : a / b;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const roundTo = (v, step) => v == null ? null : Math.round(v / step) * step;
  const round100 = x => Math.round(x / 100) * 100;
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const stddevP = a => { if (a.length < 2) return null; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / a.length); };
  const stddevS = a => { if (a.length < 2) return null; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
  function pearson(xs, ys) {
    const n = xs.length; if (n < 2) return null;
    let sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
    for (let i = 0; i < n; i++) { sx += xs[i]; sy += ys[i]; sxx += xs[i] * xs[i]; syy += ys[i] * ys[i]; sxy += xs[i] * ys[i]; }
    const cov = n * sxy - sx * sy, dx = Math.sqrt(n * sxx - sx * sx), dy = Math.sqrt(n * syy - sy * sy), den = dx * dy;
    return den === 0 ? null : cov / den;
  }
  function percentileR7(sorted, p) { const n = sorted.length; if (!n) return null; const h = (n - 1) * p, lo = Math.floor(h), f = h - lo; return lo + 1 >= n ? sorted[n - 1] : sorted[lo] + f * (sorted[lo + 1] - sorted[lo]); }
  let _seq = 0;
  const uid = p => p + '_' + Date.now().toString(36) + '_' + (++_seq) + Math.floor(Math.random() * 900 + 100);
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  function mulberry32(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  const dParse = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };

  /* ---------- 系数总表（唯一阈值权威源；分区命名空间；可被 DB.coefOverrides 按 path 覆盖） ---------- */

  /* ---------- 统一数据库 ---------- */

  let DB = null;

/* ===== 02-ui.js ===== */
/* ============================================================
   UI 外壳 — 组件库 / 顶部导航 / 全局实时指标条 / 路由 / 数据绑定
   交互公约：
   - 点击 [data-act="ns.name"] → SK.actions['ns.name'](dataset, el, ev)
   - 表单 [data-bind="path"] + data-type(int|num|wan|pct100|str|bool|fen-yuan)
     change → 写 DB → SK.commit()（持久化+全量重渲染，全站实时换算）
   - input 事件只刷 [data-out]（滑杆实时回显），不打断输入焦点
   ============================================================ */
(() => {
  'use strict';
  const { esc, fmt, DASH } = SK;

  /* ---------- 组件库 ---------- */
  const h = {
    card: (title, body, opts = {}) => `<div class="card ${opts.cls || ''}">${title ? `<h3>${title}${opts.right ? `<span class="right">${opts.right}</span>` : ''}</h3>` : ''}${body}</div>`,
    kv: rows => rows.map(r => `<div class="kv ${r.total ? 'total' : ''}"><span class="k">${r.k}</span><b class="${r.cls || ''}">${r.v}</b></div>`).join(''),
    tbl: (cols, rows, opts = {}) => `<div class="tbl-wrap"><table class="tbl">${opts.noHead ? '' : `<thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}">${c.t}</th>`).join('')}</tr></thead>`}<tbody>${rows.length ? rows.join('') : `<tr><td colspan="${cols.length}" style="text-align:center;color:var(--ink3)">${opts.empty || '暂无数据'}</td></tr>`}</tbody></table></div>`,
    badge: (t, tone = 'n', plain = false) => `<span class="badge ${tone} ${plain ? 'plain' : ''}">${t}</span>`,
    meter: (ratio, tone = '', bands = []) => `<div class="meter"><i class="${tone}" style="width:${Math.round(SK.clamp(ratio == null ? 0 : ratio, 0, 1) * 100)}%"></i>${bands.map(b => `<span class="band" style="left:${b * 100}%"></span>`).join('')}</div>`,
    banner: (t, tone = 'n') => `<div class="banner ${tone}">${t}</div>`,
    action: (title, body, tone = '', btns = '') => `<div class="action-card ${tone}"><h4>${title}</h4><div>${body}</div>${btns ? `<div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">${btns}</div>` : ''}</div>`,
    btn: (label, act, opts = {}) => `<button class="btn ${opts.cls || ''}" data-act="${act}" ${opts.data || ''} ${opts.disabled ? 'disabled' : ''} ${opts.title ? `title="${esc(opts.title)}"` : ''}>${label}</button>`,
    hero: (v, label, tone = '', small = false) => `<div><div class="hero ${small ? 'sm' : ''} ${tone}">${v}</div><div class="hint">${label}</div></div>`,
    src: t => `<div class="src">${t}</div>`,
    hint: t => `<div class="hint">${t}</div>`,
    acc: (sum, body, open = false) => `<details class="acc" ${open ? 'open' : ''}><summary>${sum}</summary><div class="acc-body">${body}</div></details>`,
    dot: tone => `<span class="dot ${tone}"></span>`,
    linked: (t = '联动') => `<span class="linked" title="该值由其他板块实时换算">${t}</span>`,
    field: (label, control, hint = '') => `<div class="field"><label>${label}</label>${control}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`,
    input: (path, type, opts = {}) => `<input type="${opts.itype || 'number'}" data-bind="${path}" data-type="${type}" value="${opts.value != null ? esc(opts.value) : ''}" ${opts.step ? `step="${opts.step}"` : ''} ${opts.min != null ? `min="${opts.min}"` : ''} ${opts.max != null ? `max="${opts.max}"` : ''} ${opts.ph ? `placeholder="${esc(opts.ph)}"` : ''} ${opts.attrs || ''}>`,
    select: (path, options, cur, opts = {}) => `<select data-bind="${path}" data-type="${opts.type || 'str'}" ${opts.attrs || ''}>${options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(cur) ? 'selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`,
    seg: (path, options, cur, type = 'str') => `<div class="seg">${options.map(o => `<button data-act="ui.seg" data-path="${path}" data-val="${esc(o.v)}" data-vtype="${type}" class="${String(o.v) === String(cur) ? 'on' : ''}">${esc(o.t)}</button>`).join('')}</div>`,
    range: (path, val, min, max, step, outFmt = 'raw') => `<div style="display:flex;align-items:center;gap:8px"><input type="range" data-bind="${path}" data-type="num" min="${min}" max="${max}" step="${step}" value="${val}" style="flex:1"><b data-out="${path}" data-outfmt="${outFmt}" style="min-width:44px;text-align:right">${val}</b></div>`,
    spark(arr, mark = null) {
      if (!arr || !arr.length) return '';
      const W = 220, H = 46, max = Math.max(...arr, 1);
      const pts = arr.map((v, i) => `${(i / (arr.length - 1) * (W - 8) + 4).toFixed(1)},${(H - 6 - v / max * (H - 14)).toFixed(1)}`).join(' ');
      const markX = mark != null ? (mark - 1) / (arr.length - 1) * (W - 8) + 4 : null;
      return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${markX != null ? `<line x1="${markX}" y1="4" x2="${markX}" y2="${H - 4}" stroke="var(--amber)" stroke-dasharray="3 3"/>` : ''}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.8"/></svg>`;
    },
    ring(pct, label, tone = 'accent') {
      const p = SK.clamp(pct == null ? 0 : pct, 0, 100);
      const col = tone === 'r' ? 'var(--red-hero)' : tone === 'g' ? 'var(--green)' : tone === 'a' ? 'var(--amber)' : 'var(--accent)';
      return `<div style="display:flex;align-items:center;gap:10px"><div style="width:62px;height:62px;border-radius:50%;background:conic-gradient(${col} ${p * 3.6}deg,var(--panel2) 0);display:flex;align-items:center;justify-content:center"><div style="width:46px;height:46px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:14px">${pct == null ? DASH : Math.round(pct)}</div></div><div class="hint">${label}</div></div>`;

  /* ---------- toast / modal ---------- */

  SK._setToast(toast);
  function modal(html) { const r = document.getElementById('modal-root'); r.innerHTML = `<div class="modal">${html}</div>`; r.classList.add('open'); }
  function closeModal() { const r = document.getElementById('modal-root'); r.classList.remove('open'); r.innerHTML = ''; }

  /* ---------- 路由 ---------- */
  const route = { board: 'dash', sub: null };
  function parseHash() {
    const m = location.hash.replace(/^#\/?/, '').split('/');
    route.board = m[0] || 'dash'; route.sub = m[1] || null;
  }
  let subnavOpen = false;
  function nav(board, sub) { moreOpen = false; subnavOpen = false; location.hash = '#/' + board + (sub ? '/' + sub : ''); }

  /* ---------- 数据绑定 ---------- */
  function setPath(obj, path, val) {
    const ks = path.split('.'); let o = obj;
    for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
    o[ks[ks.length - 1]] = val;
  }
  function castVal(raw, type) {
    switch (type) {
      case 'int': return Math.round(parseFloat(raw)) || 0;
      case 'num': { const v = parseFloat(raw); return isFinite(v) ? v : 0; }
      case 'wan': { const v = parseFloat(raw); return isFinite(v) ? Math.round(v * SK.WAN) : 0; }        // 万元 → 分
      case 'fen-yuan': { const v = parseFloat(raw); return isFinite(v) ? Math.round(v * 100) : 0; }      // 元 → 分
      case 'pct100': { const v = parseFloat(raw); return isFinite(v) ? v / 100 : 0; }                    // % → 0–1
      case 'bool': return raw === true || raw === 'true' || raw === 'on';
      default: return raw;
    }
  }
  function bindTarget(el) {
    const path = el.dataset.bind;
    if (path.startsWith('coef:')) return { obj: SK.DB.coefOverrides, key: path.slice(5), coef: true };
    return { obj: SK.DB, key: path };
  }
  function handleBind(el) {
    const t = bindTarget(el);
    let raw = el.type === 'checkbox' ? el.checked : el.value;
    const val = castVal(raw, el.dataset.type || 'str');
    if (t.coef) {
      if (raw === '' || raw == null) delete t.obj[t.key]; else t.obj[t.key] = val;
    } else setPath(t.obj, t.key, val);
    commit();
  }

  /* ---------- 渲染 ---------- */
  function boardById(id) { return SK.modules.find(m => m.id === id); }
  function renderTopnav() {
    const el = document.getElementById('topnav');
    el.innerHTML = `
      <div class="brand"><div class="logo">销</div><span>销冠操盘系统 <small>一体版 v1.0</small></span></div>
      ${SK.modules.map(m => {
        const alerts = m.alerts ? m.alerts() : 0;
        const on = route.board === m.id;
        const hasDrop = m.subnav && m.subnav.length;   // 所有含子页的板块都带下拉快速跳转（驾驶舱/云端无子页不带）
        const tab = `<button class="nav-tab ${on ? 'on' : ''}" data-act="ui.nav" data-board="${m.id}">${m.icon} ${m.title}${hasDrop ? ' <span class="nav-caret">▾</span>' : ''}${alerts > 0 ? '<span class="dotwarn"></span>' : ''}</button>`;
        if (!hasDrop) return tab;
        const menu = m.subnav.map(s => `<button class="nav-menu-item ${on && route.sub === s.id ? 'on' : ''}" data-act="ui.nav" data-board="${m.id}" data-sub="${s.id}">${s.label}</button>`).join('');
        return `<div class="nav-drop">${tab}<div class="nav-menu" role="menu">${menu}</div></div>`;
      }).join('')}
      <div class="sp"></div>
      <button class="icon-btn" data-act="ui.palette" title="命令面板 ⌘K">⌘K</button>
      <button class="icon-btn" data-act="ui.print" title="打印当前页">🖨</button>
      <button class="icon-btn" data-act="ui.theme" title="主题">🌓</button>`;
  }
  function renderLivebar() {
    const el = document.getElementById('livebar');
    const cells = [];
    for (const m of SK.modules) if (m.liveCells) { try { cells.push(...m.liveCells()); } catch (e) { console.error('liveCells', m.id, e); } }
    el.innerHTML = cells.map(c => `<div class="lv-cell" data-act="ui.nav" data-board="${c.board}" ${c.sub ? `data-sub="${c.sub}"` : ''} title="${esc(c.tip || '')}"><span class="k">${c.k}</span><span class="v ${c.tone || ''}">${c.v}</span></div>`).join('');
  }
  function renderSubnav() {
    const el = document.getElementById('subnav');
    const m = boardById(route.board);
    if (!m || !m.subnav || !m.subnav.length) { el.innerHTML = ''; return; }
    if (!route.sub || !m.subnav.some(s => s.id === route.sub)) route.sub = m.subnav[0].id;
    const idx = Math.max(0, m.subnav.findIndex(s => s.id === route.sub)), cur = m.subnav[idx];
    const chips = m.subnav.map(s => `<button class="sub-tab ${route.sub === s.id ? 'on' : ''}" data-act="ui.nav" data-board="${m.id}" data-sub="${s.id}">${s.label}</button>`).join('');
    // 桌面：胶囊 tab 一排(.sub-tabs)；手机/平板：下拉选择器(.sub-picker)展开同一批 tab——不横滑藏页、与底部一级栏区分
    el.innerHTML =
      `<button class="sub-picker" data-act="ui.subnav-toggle" aria-expanded="${subnavOpen ? 'true' : 'false'}">
        <span class="sp-cur">${cur.label}</span><span class="sp-meta">${idx + 1}/${m.subnav.length}</span><span class="sp-car">▾</span>
      </button>
      <div class="sub-tabs ${subnavOpen ? 'open' : ''}">${chips}</div>`;
  }
  /* ---------- 手机 / 平板：底部标签栏 + 「更多」抽屉 ---------- */
  const BN_PRIMARY = 4;                                   // 底部常驻前 4 个板块，其余进「更多」
  let moreOpen = false;
  function renderBottomnav() {
    const el = document.getElementById('bottomnav'); if (!el) return;
    const prim = SK.modules.slice(0, BN_PRIMARY), rest = SK.modules.slice(BN_PRIMARY);
    const btn = m => {
      const a = m.alerts ? m.alerts() : 0;
      return `<button class="bn-tab ${route.board === m.id ? 'on' : ''}" data-act="ui.nav" data-board="${m.id}">
        <span class="bn-ic">${m.icon}${a > 0 ? '<i class="bn-dot"></i>' : ''}</span><span class="bn-lb">${m.title}</span></button>`;
    };
    const restA = rest.reduce((s, m) => s + (m.alerts ? m.alerts() : 0), 0);
    const curRest = rest.some(m => m.id === route.board);
    el.innerHTML = prim.map(btn).join('') +
      `<button class="bn-tab ${moreOpen || curRest ? 'on' : ''}" data-act="ui.more">
        <span class="bn-ic">☰${restA > 0 ? '<i class="bn-dot"></i>' : ''}</span><span class="bn-lb">更多</span></button>`;
  }
  function renderMoresheet() {
    const el = document.getElementById('moresheet'); if (!el) return;
    el.className = moreOpen ? 'open' : '';
    if (!moreOpen) { el.innerHTML = ''; return; }
    const rest = SK.modules.slice(BN_PRIMARY);
    el.innerHTML = `<div class="ms-scrim" data-act="ui.more-close"></div>
      <div class="ms-panel" role="dialog" aria-label="更多板块">
        <div class="ms-grab"></div>
        <div class="ms-head">更多板块</div>
        <div class="ms-grid">${rest.map(m => {
          const a = m.alerts ? m.alerts() : 0;
          return `<button class="ms-item ${route.board === m.id ? 'on' : ''}" data-act="ui.nav" data-board="${m.id}">
            <span class="ms-ic">${m.icon}</span><span class="ms-lb">${m.title}</span>${a > 0 ? '<i class="bn-dot"></i>' : ''}</button>`;
        }).join('')}</div>
      </div>`;
  }
  let renderScheduled = false;
  function render() {
    SK.xReset();
    parseHash();
    subnavOpen = false;                                  // 任何整页渲染(含前进/后退)都收起二级下拉
    const m = boardById(route.board) || SK.modules[0];
    route.board = m.id;
    renderTopnav(); renderSubnav(); renderLivebar(); renderBottomnav(); renderMoresheet();
    const view = document.getElementById('view');
    try { view.innerHTML = m.render(route.sub); }
    catch (e) { console.error(e); view.innerHTML = h.banner('渲染出错：' + esc(e.message), 'r'); }
    document.getElementById('backup-note').innerHTML = backupNote();
    window.scrollTo(0, 0);
  }
  function commit() {
    SK.persist();
    if (renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(() => { renderScheduled = false; render(); });
  }
  function backupNote() {
    const last = SK.DB.ui.lastExportAt, nd = SK.getCoef('shared.backupNudgeDays');
    if (!last) return `💾 建议定期在「数据中心」导出备份 · 本地存储占用 ${SK.storageKB() || 0} KB · 数据不出你的电脑`;
    const d = SK.diffDays(last, SK.today());
    return d > nd ? `💾 你已 ${d} 天没备份数据了——硬盘损坏/换电脑前请到「数据中心」导出备份` : `💾 上次备份 ${last} · 本地存储 ${SK.storageKB() || 0} KB · 数据不出你的电脑`;
  }

  /* ---------- 主题 ---------- */
  function applyTheme() {
    const t = SK.DB.ui.theme || 'auto';
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }

  /* ---------- 命令面板 ---------- */
  let palItems = [], palSel = 0;
  function paletteItems() {
    const items = [];
    for (const m of SK.modules) {
      items.push({ t: `${m.icon} ${m.title}`, s: '板块', run: () => nav(m.id) });
      (m.subnav || []).forEach(s => items.push({ t: `${m.icon} ${m.title} · ${s.label}`, s: '页面', run: () => nav(m.id, s.id) }));
    }
    items.push({ t: '🌓 切换主题', s: '操作', run: () => SK.actions['ui.theme']() });
    items.push({ t: '📦 导出全量备份', s: '操作', run: () => SK.actions['data.export']() });
    items.push({ t: '🧪 载入演示数据', s: '操作', run: () => SK.actions['data.seed']() });
    return items;
  }
  function openPalette() {
    const p = document.getElementById('palette');
    p.classList.add('open');
    p.innerHTML = `<div class="pal"><input id="pal-q" placeholder="搜索页面 / 操作…"><div class="pal-list" id="pal-list"></div></div>`;
    palSel = 0; filterPal('');
    const q = document.getElementById('pal-q'); q.focus();
    q.addEventListener('input', () => { palSel = 0; filterPal(q.value); });
  }
  function filterPal(qs) {
    palItems = paletteItems().filter(it => !qs || it.t.toLowerCase().includes(qs.toLowerCase()));
    document.getElementById('pal-list').innerHTML = palItems.map((it, i) =>
      `<div class="pal-it ${i === palSel ? 'sel' : ''}" data-pal="${i}">${it.t}<small>${it.s}</small></div>`).join('');
  }
  function closePalette() { const p = document.getElementById('palette'); p.classList.remove('open'); p.innerHTML = ''; }

  /* ---------- 核心动作 ---------- */
  Object.assign(SK.actions, {
    'ui.nav': d => nav(d.board, d.sub || null),
    'ui.more': () => { moreOpen = !moreOpen; renderMoresheet(); renderBottomnav(); },
    'ui.more-close': () => { moreOpen = false; renderMoresheet(); renderBottomnav(); },
    'ui.subnav-toggle': () => { subnavOpen = !subnavOpen; renderSubnav(); },
    'ui.theme': () => {
      const seq = ['auto', 'light', 'dark'];
      SK.DB.ui.theme = seq[(seq.indexOf(SK.DB.ui.theme || 'auto') + 1) % 3];
      applyTheme(); commit(); toast('主题：' + SK.DB.ui.theme);
    },
    'ui.print': () => window.print(),
    'ui.palette': () => openPalette(),
    'ui.seg': d => {
      const val = d.vtype === 'num' ? parseFloat(d.val) : d.vtype === 'bool' ? d.val === 'true' : d.val;
      if (d.path.startsWith('coef:')) SK.DB.coefOverrides[d.path.slice(5)] = val;
      else setPath(SK.DB, d.path, val);
      commit();
    },
    'ui.modal-close': () => closeModal(),
    'ui.toast-ac': () => toast('已生成 action_card（系统永不自动执行 · 由你点击后才动）'),
  });

  /* ---------- 全局事件 ---------- */
  function wire() {
    document.addEventListener('click', ev => {
      const pal = ev.target.closest('[data-pal]');
      if (pal) { const it = palItems[+pal.dataset.pal]; closePalette(); it && it.run(); return; }
      if (ev.target.id === 'palette') { closePalette(); return; }
      if (ev.target.id === 'modal-root') { closeModal(); return; }
      if (subnavOpen && !ev.target.closest('#subnav')) { subnavOpen = false; renderSubnav(); }  // 点外部收起二级下拉
      const el = ev.target.closest('[data-act]');
      if (!el) return;
      const fn = SK.actions[el.dataset.act];
      if (fn) fn(el.dataset, el, ev); else console.warn('未注册动作', el.dataset.act);
    });
    document.addEventListener('change', ev => {
      const el = ev.target.closest('[data-bind]');
      if (el) handleBind(el);
    });
    document.addEventListener('input', ev => {
      const el = ev.target.closest('[data-bind]');
      if (!el) return;
      // 滑杆实时回显（不落库不重渲染）
      const out = document.querySelector(`[data-out="${el.dataset.bind}"]`);
      if (out) {
        const v = parseFloat(el.value);
        out.textContent = out.dataset.outfmt === 'pct' ? Math.round(v) + '%' : el.value;
      }
      const live = SK.actions['ui.live-input'];   // 模块可注册细粒度实时响应
      if (live) live({ path: el.dataset.bind, value: el.value }, el, ev);
    });
    document.addEventListener('keydown', ev => {
      const p = document.getElementById('palette');
      if (p.classList.contains('open')) {
        if (ev.key === 'Escape') return closePalette();
        if (ev.key === 'ArrowDown') { palSel = Math.min(palSel + 1, palItems.length - 1); filterPal(document.getElementById('pal-q').value); ev.preventDefault(); return; }
        if (ev.key === 'ArrowUp') { palSel = Math.max(palSel - 1, 0); filterPal(document.getElementById('pal-q').value); ev.preventDefault(); return; }
        if (ev.key === 'Enter') { const it = palItems[palSel]; closePalette(); it && it.run(); return; }
        return;
      }
      if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); openPalette(); return; }
      if (ev.key === 'Escape') closeModal();
    });
    window.addEventListener('hashchange', render);
  }

  /* ---------- 启动 ---------- */
  function boot() {
    SK.loadDB();
    applyTheme();
    parseHash();
    wire();
    render();
    // 控制台自检（不阻塞 UI）
    setTimeout(() => {
      try {
        const res = SK.tests.map(t => { try { const r = t.fn(); return { id: t.id, pass: r === true || (r && r.pass) }; } catch (e) { return { id: t.id, pass: false, err: e.message }; } });
        const bad = res.filter(r => !r.pass);
        console.log(`[销冠操盘系统] 自检 ${res.length - bad.length}/${res.length} 绿`, bad.length ? bad : '');
        window.__SUITE_SELFTEST__ = res;
      } catch (e) { console.error(e); }
    }, 50);
  }

  window.UI = { h, toast, modal, closeModal, nav, route, render, commit, boot, applyTheme };
})();

/* ===== 10-dingjia.js ===== */
/* ============================================================
   定价器（dingjia）— 销冠定价器 v2.5 一体化移植
   引擎逐字复刻原版：compute 顺序 B→D→A→C→E→合计。
   输入全部绑定共享字段 DB.company；salesCount/managerCount 由员工档案派生只读。
   系数：dingjia.* 与 shared.* 命名空间，只经 SK.getCoef。
   ============================================================ */
(() => {
  'use strict';
  const { h } = UI, { fmt, esc, DASH, safeDiv, clamp } = SK;
  const WAN = SK.WAN;

  /* ================= 0. 常量与文案 ================= */
  const GRADE_IDX = { effective: 1, efficient: 2, leading: 3 };
  const gradeIndex = g => GRADE_IDX[g] != null ? GRADE_IDX[g] : 1;
  const GRADE_SHORT = { effective: '初级', efficient: '中级', leading: '高级' };
  const GRADE_TECH = { effective: '有效', efficient: '高效', leading: '领先' };
  const GRADE_DESC = {
    effective: '能独立签单、稳定达标的常规销售——多数团队按这档定薪',
    efficient: '持续超额、能自己带节奏的骨干',
    leading: '团队头部标杆，产出明显高于均值',
  };
  const LEVEL_DESC = {
    sales: '一线销售，直接签单回款',
    manager: '带 5–8 人的一线主管，约三成时间用于管人',
    executive: '定战略、背全盘目标，按 1 人计',
  };
  const levelName = l => ({ sales: '销售', manager: '主管', executive: '高管' })[l] || l;
  const gradeFull = g => `${GRADE_SHORT[g]}（${GRADE_TECH[g]}）`;
  const roundYuanFen = fen => Math.round(fen / 100) * 100;   // 四舍五入到元（分单位）

  const ENUMS = {
    cityTier: [['tier1', '一线'], ['tier2', '二线'], ['tier34', '三四线']],
    cycleTier: [['short', '短期≤30天'], ['regular', '常规1–3月'], ['midLong', '中长4–6月'], ['long', '长期7–12月'], ['ultraLong', '超长>12月']],
    tierGrade: [['effective', '初级（有效）'], ['efficient', '中级（高效）'], ['leading', '高级（领先）']],

  const GATE_BRIEF = {

  /* ================= 1. 引擎（纯函数，逐字复刻 v2.5）================= */

  // 账单B（六步链；today/targetYear 显式注入）
  function calcCardB(inp, today, targetYear) {
    const cyc = inp.cycleTier, I5 = inp.nextYearTargetGrossAmt, I6 = inp.lastYearPerCapitaGrossAmt,
      I7 = inp.salesCount, I9 = inp.attritionRate, I10 = inp.hiringCycleDays;
    if (!I6) return { ok: false };
    const midF = SK.getCoef('shared.midYearAttritionFactor');
    const kEff = m => SK.newHireYearRate(cyc, m) * (1 - I9 * midF);
    const k1 = SK.newHireYearRate(cyc, 1), kEff1 = kEff(1);
    const fullCap = I5 / I6;                                    // ① 满产当量
    const S1 = Math.max(0, Math.ceil(fullCap) - I7);            // ② 天真
    const expAttr = I7 * I9;                                    // ③ 预期流失（全额计入缺口）
    const gapCap = fullCap - I7 + expAttr;                      // ④ 缺口当量
    const S6 = Math.max(0, Math.ceil(safeDiv(gapCap, kEff1)));  // ⑥ 真实
    const overRate = safeDiv(S6 - S1, S6);
    const exposeAmt = Math.max(0, (gapCap - S1 * kEff1) * I6);
    const totalHeadTarget = I7 + S6;
    let latestMonth = null;
    for (let m = 12; m >= 1; m--) { if (kEff(m) * S6 >= gapCap) { latestMonth = m; break; } }
    let latestHire = null, isLate = false, lateDays = 0;
    if (latestMonth) {
      latestHire = SK.addDays(SK.firstDay(targetYear, latestMonth), -I10);
      lateDays = SK.diffDays(latestHire, today); isLate = lateDays > 0;
    }
    const seg = SK.SEGMENT_MAP[cyc], frr = SK.getCoef('dingjia.fullRampRatio')[seg];
    const stretch = safeDiv(I5, totalHeadTarget) != null && safeDiv(I5, totalHeadTarget) > (I6 / frr) * 1.2;
    return { ok: true, k1, kEff1, S1, fullCap, expAttr, gapCap, S6, overRate, exposeAmt,
      totalHeadTarget, latestMonth, latestHire, isLate, lateDays, ramp80: SK.calcRamp80(cyc), targetYear, stretch };
  }

  // 账单D（管理跨度）
  function calcCardD(inp, totalHeadTarget) {
    const I8 = inp.managerCount;
    const sd = SK.getCoef('shared.spanDefault');
    const availH = sd.weeklyHrs * sd.manageTimeShare - SK.getCoef('shared.fixedMeetingHrs');
    const spanCap = Math.floor(availH / SK.getCoef('shared.perHeadMgmtHrs'));
    const heads = (totalHeadTarget != null) ? totalHeadTarget : inp.salesCount;
    const managerNeeded = Math.ceil(safeDiv(heads, spanCap));
    const gap = Math.max(0, managerNeeded - I8);
    const curSpan = safeDiv(heads, Math.max(I8, 1));
    const coachMin = Math.round(Math.max(0, availH - heads * SK.getCoef('shared.perHeadAdminHrs')) / heads * 60);
    return { availH, spanCap, heads, managerNeeded, gap, curSpan, coachMin };
  }

  // 账单A（三层全链 + 六道闸）
  function calcCardA(inp, managerNeeded, totalHeadTarget) {
    const I1 = inp.cityTier, I2 = inp.cycleTier, grade = inp.tierGrade, I4 = inp.targetPersonalMonthlyGrossAmt,
      I5 = inp.nextYearTargetGrossAmt, I11 = inp.blendedMarginRate;
    // 🔴 v2.5：销售档 gi 与 主管/高管档 gmi 各自独立选择（idx 按层取）
    const gi = gradeIndex(grade), gmi = gradeIndex(inp.mgrGrade), cityB = SK.getCoef('dingjia.cityBase')[I1], cf = SK.getCoef('dingjia.cycleFactor')[I2],
      social = SK.getCoef('shared.socialCostRate'), ltr = SK.getCoef('shared.longTermRate'), minW = SK.getCoef('shared.minWageTable')[I1],
      lm = SK.getCoef('dingjia.levelMultiplier'), tt = SK.getCoef('dingjia.thresholdTTable')[I1];
    const Bof = (lv, idx) => roundYuanFen(cityB * lm[lv][idx] * cf);
    const Tof = (lv, idx) => tt[lv][idx] * 100;                 // 元→分
    const Gof = lv => lv === 'sales' ? I4 : lv === 'manager' ? safeDiv(I5, 12 * Math.max(managerNeeded, 1)) : I5 / 12;
    const layers = ['sales', 'manager', 'executive'];
    const count = { sales: totalHeadTarget, manager: managerNeeded, executive: 1 };
    const rows = layers.map(lv => {
      const idx = lv === 'sales' ? gi : gmi;                    // 销售用销售档，主管+高管共用 mgrGrade 档
      const B = Bof(lv, idx), T = Tof(lv, idx), G = Gof(lv);
      const longAmt = Math.round(T * ltr), gapAmt = Math.round(T * (1 - ltr)) - B;
      const blocked = B >= T * (1 - ltr), r = blocked ? null : safeDiv(gapAmt, G);
      const belowMinWage = B < minW, floatShare = safeDiv(gapAmt, T);
      return { level: lv, B, T, G, longAmt, gapAmt, blocked, r, belowMinWage, floatShare, count: count[lv] };
    });
    const sales = rows[0], Bwarn = Bof('sales', 0), Twarn = Tof('sales', 0);
    const goodHire = Math.min(sales.B / Bwarn, sales.T / Twarn);
    const comp = ratio3(sales.B, sales.gapAmt, sales.longAmt);
    const burdenNum = rows.reduce((s, r) => s + (r.count || 0) * r.gapAmt * 12, 0);
    const burdenRate = safeDiv(burdenNum, I5);
    const fullNum = rows.reduce((s, r) => s + (r.count || 0) * (Math.round(r.B * (1 + social)) + r.gapAmt + r.longAmt) * 12, 0);
    const fullBurden = safeDiv(fullNum, I5), fullRev = fullBurden != null ? fullBurden * I11 : null;
    // 六道闸
    const gates = [];
    const anyBlocked = rows.some(r => r.blocked);
    if (anyBlocked) gates.push({ id: 1, light: 'red', code: 'W-02', row: rows.find(r => r.blocked) });
    if (I11 < 0.20) gates.push({ id: 2, light: 'red', code: 'W-01' });
    if (sales.B < Bwarn) gates.push({ id: 3, light: 'red', code: 'W-03' });
    if (sales.floatShare != null && sales.floatShare >= 0.65) gates.push({ id: 4, light: 'amber', code: 'W-04' });
    if (burdenRate != null) {
      if (burdenRate > 0.35) gates.push({ id: 5, light: 'red', code: 'W-05' });
      else if (burdenRate < 0.25) gates.push({ id: 5, light: 'amber', code: 'W-06' });
      else gates.push({ id: 5, light: 'green', code: 'ok' });
    }
    rows.forEach(r => { if (r.belowMinWage) gates.push({ id: 6, light: 'red', code: 'W-29', row: r, minW }); });
    return { rows, sales, Bwarn, Twarn, goodHire, comp, burdenRate, fullBurden, fullRev, marginRate: I11,
      hungerBait: sales.B < Bwarn, gates, anyBlocked };
  }
  function ratio3(a, b, c) {
    const t = a + b + c; if (t <= 0) return [0, 0, 0];
    let x = [Math.round(a / t * 100), Math.round(b / t * 100), Math.round(c / t * 100)];
    const diff = 100 - (x[0] + x[1] + x[2]); x[1] += diff; return x;
  }

  // 账单C（流失价签简版 3 项）
  function calcCardC(inp) {
    const I1 = inp.cityTier, I2 = inp.cycleTier, I6 = inp.lastYearPerCapitaGrossAmt,
      I7 = inp.salesCount, I9 = inp.attritionRate, I10 = inp.hiringCycleDays;
    const monthPer = I6 / 12, idle = monthPer * I10 / 30, arr = SK.RAMP[I2];
    let sumGap = 0; for (let pos = 1; pos <= 12; pos++) sumGap += (1 - arr[pos - 1] / 100);
    const rampGap = monthPer * sumGap, recruitFee = SK.getCoef('shared.recruitFeeDefaultAmt'), tag = idle + rampGap + recruitFee;
    const Tsales = SK.getCoef('dingjia.thresholdTTable')[I1].sales[1] * 100; // effective
    const ote = SK.getCoef('dingjia.turnoverCostOteRate');
    const oteLow = Tsales * 12 * ote[0], oteHigh = Tsales * 12 * ote[1];
    const annual = tag * I7 * I9;
    return { idle, rampGap, recruitFee, tag, oteLow, oteHigh, annual, sumGap };
  }

  // 账单E（团队奖 TIS）
  function calcCardE(inp) {
    const I7 = inp.salesCount, I12 = inp.complementLevel, I13 = inp.attributableLevel, tis = SK.getCoef('dingjia.teamBonusTIS');
    const sizeScore = 100 * clamp(1 - (I7 - tis.sizeFull) / (tis.sizeZero - tis.sizeFull), 0, 1);
    const compScore = tis.complementEnum[I12], visScore = { no: 0, partial: 50, yes: 100 }[I13];
    const TIS = tis.w[0] * sizeScore + tis.w[1] * compScore + tis.w[2] * visScore;
    const light = TIS >= tis.green ? 'green' : (TIS >= tis.red ? 'amber' : 'red');
    return { sizeScore, compScore, visScore, TIS, light };
  }

  // 合计
  function calcTotalLine(B, C) { return { total: (C ? C.annual : 0) + (B ? B.exposeAmt : 0), annual: C ? C.annual : 0, expose: B ? B.exposeAmt : 0 }; }

  /* ---- 风洞引擎 ---- */
  function generateMenu(baseQuotaAmt, baseBonusAmt, gate3Active) {
    if (gate3Active) return { blocked: true, code: 'W-19' };
    if (!(baseQuotaAmt > 0) || !(baseBonusAmt > 0)) return null;
    const steps = SK.getCoef('dingjia.menuQuotaSteps'), mid = SK.getCoef('dingjia.menuAttainMid'),
      slope = SK.getCoef('dingjia.menuAttainSlope'), round = SK.getCoef('dingjia.menuRound'),
      E = mid * baseBonusAmt, P = x => clamp(mid + slope * (1 - x), 0.05, 0.95);
    let tiers = steps.map(x => { const quota = baseQuotaAmt * x; let bonus = SK.roundTo(E / P(x), round); return { x, quota, bonus, P: P(x) }; });
    // 校验二（激励相容）：bonus/quota 严格递增；低档违反→下调（脚注 W-28）
    let adjusted = false;
    for (let i = 1; i < tiers.length; i++) {
      if (tiers[i].bonus / tiers[i].quota <= tiers[i - 1].bonus / tiers[i - 1].quota) {
        tiers[i - 1].bonus = SK.roundTo(0.98 * (tiers[i].bonus / tiers[i].quota) * tiers[i - 1].quota, round); adjusted = true;
      }
    }
    tiers = tiers.map(t => ({ ...t, unitReturn: t.bonus / t.quota, dev: Math.abs(t.P * t.bonus - E) / E }));
    return { tiers, E, adjusted };
  }
  // 造假风险闸：p90Real 显式传入（一体版取 X('suanzhang').realP90Factor；null 回退 shared.p90ColdFactor）
  function gateFraudRisk(audit, inp, p90Real) {
    const I1 = inp.cityTier, I2 = inp.cycleTier, I5 = inp.nextYearTargetGrossAmt, I6 = inp.lastYearPerCapitaGrossAmt, I7 = inp.salesCount;
    const p90Eff = (p90Real != null) ? p90Real : SK.getCoef('shared.p90ColdFactor');
    const ratioCur = safeDiv(safeDiv(I5, I7), I6 * p90Eff);
    const Bwarn = roundYuanFen(SK.getCoef('dingjia.cityBase')[I1] * SK.getCoef('dingjia.levelMultiplier').sales[0] * SK.getCoef('dingjia.cycleFactor')[I2]);
    const hunger = audit.currentBaseSalaryAmt < Bwarn * SK.getCoef('dingjia.hungerBufferRate');
    const rl = SK.getCoef('dingjia.attainabilityRedline'); let light, code;
    if (ratioCur != null && ratioCur > rl && hunger) { light = 'red'; code = 'W-20'; }
    else if (ratioCur != null && ratioCur > rl && !hunger) { light = 'amber'; code = 'W-20b'; }
    else { light = 'green'; code = 'ok'; }
    return { p90Eff, ratioCur, Bwarn, hunger, light, code };
  }
  function gateAlignment(audit) {
    const p = audit.positionType, b = audit.currentCommissionBase;
    if ((p === 'advisory' || p === 'aftersales') && b === 'contract_amount') return { light: 'red', code: 'W-21' };
    if (p === 'pure_sales' && b === 'contract_amount') return { light: 'amber', code: 'W-21b' };
    return { light: 'green', code: 'ok' };
  }
  function checkGuardrail(hasMenuOrSprint, guardrailMetric) { return { locked: hasMenuOrSprint && !guardrailMetric, code: 'W-22' }; }
  function countProcessRedlines(n) { return { warn: n >= SK.getCoef('dingjia.processRedlineWarnCount'), n, code: 'W-23' }; }
  function explorationContract(inp) {
    const r80 = SK.calcRamp80(inp.cycleTier);
    return { floorMonths: r80 + 2, minWage: SK.getCoef('shared.minWageTable')[inp.cityTier] };
  }
  function leakSandbox(measures) { return measures.filter(m => LEAK_MAP[m]).map(m => ({ measure: m, ...LEAK_MAP[m] })); }

  /* ================= 2. 输入装配（DB.company → 引擎 inp，纯函数）================= */
  function buildInputs(db) {
    const c = db.company || {};
    const wanAmt = v => v == null ? null : Math.round(v * WAN);
    return {
      cityTier: c.cityTier, cycleTier: c.cycleTier, tierGrade: c.tierGrade || 'effective', mgrGrade: c.mgrGrade || 'effective',
      targetPersonalMonthlyGrossAmt: wanAmt(c.targetPersonalMonthlyGrossWan),
      nextYearTargetGrossAmt: wanAmt(c.targetYearGrossWan),
      lastYearPerCapitaGrossAmt: wanAmt(c.lastYearPerCapitaWan),
      salesCount: (db.people || []).filter(p => p.isActive && p.positionType === 'sales').length,
      managerCount: (db.people || []).filter(p => p.isActive && p.positionType === 'manager').length,
      attritionRate: c.attritionRate, hiringCycleDays: c.hiringCycleDays, blendedMarginRate: c.blendedMarginRate,
      complementLevel: c.complementLevel, attributableLevel: c.attributableLevel,
      targetYearMode: c.targetYearMode || 'next',
    };
  }
  // 主计算入口（顺序 B→D→A→C→E→合计；today 显式传入，纯函数）
  function computeAll(db, today) {
    const inp = buildInputs(db);
    const ty = (+today.slice(0, 4)) + (inp.targetYearMode === 'this' ? 0 : 1);
    const R = { inp, targetYear: ty };
    try {
      if (inp.cityTier && inp.cycleTier && inp.lastYearPerCapitaGrossAmt > 0 && inp.nextYearTargetGrossAmt > 0
        && inp.attritionRate != null && inp.hiringCycleDays > 0) {
        const b = calcCardB(inp, today, ty); if (b.ok) R.B = b;
      }
    } catch (e) { /* 缺数→整卡— */ }
    try { R.D = calcCardD(inp, R.B ? R.B.totalHeadTarget : null); } catch (e) {}
    try {
      if (inp.cityTier && inp.cycleTier && inp.targetPersonalMonthlyGrossAmt > 0 && inp.nextYearTargetGrossAmt > 0 && inp.blendedMarginRate != null) {
        R.A = calcCardA(inp, R.D ? R.D.managerNeeded : 1, R.B ? R.B.totalHeadTarget : (inp.salesCount != null ? inp.salesCount : 1));
      }
    } catch (e) {}
    try { if (inp.cityTier && inp.cycleTier && inp.lastYearPerCapitaGrossAmt > 0) R.C = calcCardC(inp); } catch (e) {}
    try { if (inp.complementLevel && inp.attributableLevel) R.E = calcCardE(inp); } catch (e) {}
    if (R.B || R.C) R.total = calcTotalLine(R.B || null, R.C || null);
    return R;
  }

  /* ================= 3. X 跨模块派生：summary 注册 ================= */
  SK.summary.dingjia = (db, today) => {
    const R = computeAll(db, today);
    const A = R.A, s = A ? A.sales : null;
    return {
      ok: !!s,
      r: s ? s.r : null,                       // 销售层提成率
      matrixT: s ? s.T : null,                 // 销售档达标收入 T（分）
      matrixB: s ? s.B : null,                 // 销售档底薪 B（分）
      floatShare: s ? s.floatShare : null,
      goodHireIndex: A ? A.goodHire : null,
      burdenRate: A ? A.burdenRate : null,
      total: R.total ? R.total.total : null,   // 今年漏损 = C.annual + B.exposeAmt（分）
      results: R,                              // 完整五账单（内部用）
    };
  };

    const a = SK.DB.audit;
    if (!Array.isArray(a.controlMeasures)) a.controlMeasures = [];
    if (!Array.isArray(a.claimedOutlets)) a.claimedOutlets = [];
    return a;

  function tierTableHtml() {

  function cardAHtml(R) {
    const A = R.A, s = A.sales;
    const rowsHtml = A.rows.map(r => `<tr><td>${levelName(r.level)}</td>
      <td class="num ${r.belowMinWage ? '' : ''}" style="${r.belowMinWage ? 'color:var(--red);font-weight:600' : ''}">${fmt.yuan(r.B)}${r.belowMinWage ? ' ⚠︎' : ''}</td>
      <td class="num">${fmt.yuan(r.T)}</td><td class="num">${r.blocked ? DASH : fmt.pct(r.r)}</td><td class="num">${r.count != null ? r.count : DASH}</td></tr>`);
    const [cb, cg, cl] = A.comp;
    const gi = A.goodHire, giTone = gi < 1 ? 'r' : gi < 1.2 ? 'a' : gi < 1.4 ? 'g' : 'gold';
    const giLab = gi < 1 ? '🔴 偏低' : gi < 1.2 ? '🟡 及格' : gi < 1.4 ? '🟢 好招' : '🏅 极好招';
    const bTone = A.burdenRate > 0.35 ? 'r' : A.burdenRate < 0.25 ? 'a' : '';
    let body = '';
    if (A.anyBlocked) body += gate('red', W_TEXT['W-02']({ row: A.rows.find(r => r.blocked) }));
    body += h.tbl([{ t: '层级' }, { t: '底薪 B', num: 1 }, { t: '达标收入 T', num: 1 }, { t: '提成率 r', num: 1 }, { t: '目标人数', num: 1 }], rowsHtml);
    body += `<div class="hint" style="margin-top:6px">销售层薪酬构成（底薪 : 提成缺口 : 长期分红池）</div>`;
    body += compbar([[cb, cb, '#6366f1'], [cg, cg, '#f59e0b'], [cl, cl, '#10b981']]);
    body += `<div style="margin:10px 0">${h.badge(`好招指数 ${gi.toFixed(2)} · ${giLab}`, giTone, true)}</div>`;
    if (A.burdenRate != null) {
      body += `<div class="hint">全链提成负担占目标毛利（健康带 25–35%）</div>${h.meter(A.burdenRate / 0.5, bTone, [0.5, 0.7])}${meterCap('0%', '健康带 25–35%', '50%+')}`;
    }
    A.gates.filter(g => g.id !== 1).forEach(g => {
      body += gate(g.light, (W_TEXT[g.code] || (() => ''))(Object.assign({ burdenRate: A.burdenRate, marginRate: A.marginRate }, g)));

    if (A.fullBurden != null) body += h.banner(`ℹ️ 全口径人力负担（含底薪/社保/长期分红池）≈ <b>${fmt.pct(A.fullBurden)}</b>；按毛利率折营收 ≈ <b>${fmt.pct(A.fullRev)}</b>，对标 CCOS 健康带 8–15% 营收。`, 'n');

    body += h.src('📎 三层定薪回算：B=城市基数×层级倍数×周期因子；T 查阈值矩阵；r=(T×90%−B)÷月毛利目标 G');
    return dcard('A', '账单A · 定薪回算', `好招指数 ${A.goodHire.toFixed(2)} · 销售${GRADE_TECH[R.inp.tierGrade]}·管理层${GRADE_TECH[R.inp.mgrGrade]}档`, s.r != null ? fmt.pct(s.r) : DASH, '销售提成率 r', body);

  function cardBHtml(R) {
    const B = R.B;
    const rows = [
      ['① 需要满产当量', B.fullCap.toFixed(2) + ' 人'],
      ['② 你脑子里（天真）需招 S1', B.S1 + ' 人'],

  /* ================= 6. 动作 ================= */
  Object.assign(SK.actions, {
    'dj.card': d => { const oc = SK.DB.ui.openCards || (SK.DB.ui.openCards = {}); oc[d.key] = !oc[d.key]; UI.commit(); },
    'dj.tier': d => {                                       // ① 销售档 / ② 主管高管档 收合（持久化，修复重渲复位 bug）
      const to = SK.DB.ui.tierOpen || (SK.DB.ui.tierOpen = { sales: true, mgr: false });

    'dj.ty': () => { SK.DB.company.targetYearMode = SK.DB.company.targetYearMode === 'this' ? 'next' : 'this'; UI.commit(); },
    'dj.grade': d => { SK.DB.company.tierGrade = d.g; gradeBaseDraft = null; matchNote = ''; UI.commit(); },
    'dj.grade-match': () => {
      const inp = document.getElementById('dj-gbase'); if (!inp) return;
      const v = parseFloat(inp.value);
      if (isNaN(v)) { UI.toast('先输入现行月底薪（元）'); return; }
      const c = SK.DB.company;
      if (!c.cityTier || !c.cycleTier) { UI.toast('先选城市线级与成交周期档'); return; }
      const cityB = SK.getCoef('dingjia.cityBase')[c.cityTier], cf = SK.getCoef('dingjia.cycleFactor')[c.cycleTier],
        lm = SK.getCoef('dingjia.levelMultiplier');
      const cand = ['effective', 'efficient', 'leading'].map(g => ({ g, B: roundYuanFen(cityB * lm.sales[gradeIndex(g)] * cf) }));
      const fen = Math.round(v * 100);
      let best = cand[0]; cand.forEach(x => { if (Math.abs(x.B - fen) < Math.abs(best.B - fen)) best = x; });
      const lo = cand[0].B, hi = cand[2].B;
      matchNote = fen < lo * 0.98 ? `低于「初级」矩阵底薪（${fmt.yuan(lo)}）——可能偏低；已按初级档算。`
        : fen > hi * 1.02 ? `高于「高级」矩阵底薪（${fmt.yuan(hi)}）——已按高级档算。`
        : `≈ 最接近「${GRADE_SHORT[best.g]}（${GRADE_TECH[best.g]}）」档（矩阵 ${fmt.yuan(best.B)}）。已为你选定该档。`;

    'dj.fee': () => {

  /* ================= 8. 对拍自检（黄金值；fixture 直接喂纯函数，不碰业务 DB）================= */
  const TEST_TODAY = '2026-07-13';
  const TW = w => w * 1e6;   // 万元→分
  function baseBFix() {
    return { cityTier: 'tier1', cycleTier: 'regular', tierGrade: 'effective',
      targetPersonalMonthlyGrossAmt: TW(9), nextYearTargetGrossAmt: TW(1000), lastYearPerCapitaGrossAmt: TW(100),
      salesCount: 5, managerCount: 1, attritionRate: 0.35, hiringCycleDays: 45, blendedMarginRate: 0.30,
      complementLevel: 'partial', attributableLevel: 'partial' };
  }
  // 出厂系数下跑（暂存并清空 coefOverrides，跑完精确还原）
  function withCleanCoef(fn) {
    const db = SK.DB, sv = db ? db.coefOverrides : null;
    if (db) db.coefOverrides = {};
    SK.setTestToday(TEST_TODAY);
    try { return fn(); }
    finally { if (db) db.coefOverrides = sv; SK.setTestToday(null); }
  }
  SK.tests.push({
    id: 'T-A1', name: '定价·定薪回算 r=19.5% 负担27.1%',
    fn: () => withCleanCoef(() => {
      // 原版 T-A1 fixture：tier1/short/effective，I4=10万/月，I5=1200万，managerNeeded=2，totalHeadTarget=10
      const A = calcCardA({ cityTier: 'tier1', cycleTier: 'short', tierGrade: 'effective',
        targetPersonalMonthlyGrossAmt: 100000 * 100, nextYearTargetGrossAmt: TW(1200), blendedMarginRate: 0.30, salesCount: 10 }, 2, 10);
      const got = { r: A.rows[0].r, burden: A.burdenRate };
      const pass = got.r != null && Math.abs(got.r - 0.195) <= 0.005 && got.burden != null && Math.abs(got.burden - 0.271) <= 0.005;
      return { pass, got: { r: (got.r * 100).toFixed(1) + '%', burden: (got.burden * 100).toFixed(1) + '%' }, want: { r: '19.5%', burden: '27.1%' } };
    }),

  SK.tests.push({
    id: 'T-A-mgr', name: '定价·主管高管档独立联动（v2.5）',
    fn: () => withCleanCoef(() => {
      const base = { cityTier: 'tier1', cycleTier: 'short', targetPersonalMonthlyGrossAmt: 100000 * 100, nextYearTargetGrossAmt: TW(1200), blendedMarginRate: 0.30, salesCount: 10 };
      // 双档 effective：销售19.5% / 主管4.7% / 高管2.9%（旧口径不变）
      const A0 = calcCardA({ ...base, tierGrade: 'effective', mgrGrade: 'effective' }, 2, 10);
      // 销售 effective 不动，仅把管理层升到 leading：销售 r 恒 19.5%，主管↑6.2%，高管↑4.0%
      const A1 = calcCardA({ ...base, tierGrade: 'effective', mgrGrade: 'leading' }, 2, 10);
      const p = (x) => (x * 100).toFixed(1);
      const salesUnchanged = A1.rows[0].r === A0.rows[0].r && A1.rows[0].B === A0.rows[0].B;          // 解耦：改管理层档，销售层零变化
      const mgrShifted = A1.rows[1].B === 1750000 && A1.rows[2].B === 2500000                          // 管理层 B 按 leading 倍数（3.5/5.0）
        && A0.rows[1].B === 1250000 && A0.rows[2].B === 2000000;                                       // effective 倍数（2.5/4.0）
      const rOk = p(A0.rows[1].r) === '4.7' && p(A0.rows[2].r) === '2.9'
        && p(A1.rows[0].r) === '19.5' && p(A1.rows[1].r) === '6.2' && p(A1.rows[2].r) === '4.0';
      return {
        pass: salesUnchanged && mgrShifted && rOk,
        got: { effEff: `销${p(A0.rows[0].r)}/主${p(A0.rows[1].r)}/高${p(A0.rows[2].r)}`, effLead: `销${p(A1.rows[0].r)}/主${p(A1.rows[1].r)}/高${p(A1.rows[2].r)}`, 解耦: salesUnchanged },
        want: { effEff: '销19.5/主4.7/高2.9', effLead: '销19.5/主6.2/高4.0', 解耦: true },
      };
    }),
  });
  SK.tests.push({
    id: 'T-B1', name: '定价·六步链 S1=5 S6=16 开招2026-11-17',
    fn: () => withCleanCoef(() => {
      const B = calcCardB(baseBFix(), TEST_TODAY, 2027);
      const pass = B.S1 === 5 && B.S6 === 16 && (B.overRate * 100).toFixed(1) === '68.8'
        && B.latestMonth === 1 && B.latestHire === '2026-11-17' && B.isLate === false;
      return { pass, got: { S1: B.S1, S6: B.S6, over: fmt.pct(B.overRate), hire: B.latestHire }, want: { S1: 5, S6: 16, over: '68.8%', hire: '2026-11-17' } };

  SK.tests.push({
    id: 'T-C1', name: '定价·流失价签 61.2万 / 年账 107.0万',

      const pass = (C.tag / 1e6).toFixed(1) === '61.2' && (C.annual / 1e6).toFixed(1) === '107.0'
        && (C.oteLow / 1e6).toFixed(1) === '54.0' && (C.oteHigh / 1e6).toFixed(1) === '72.0';
      return { pass, got: { tag: fmt.wan(C.tag), annual: fmt.wan(C.annual) }, want: { tag: '61.2万', annual: '107.0万' } };
    }),

  SK.tests.push({
    id: 'T-D1', name: '定价·管理跨度 heads=21 → 需3缺2',
    fn: () => withCleanCoef(() => {
      const D = calcCardD(baseBFix(), 21);
      const pass = D.availH === 9 && D.spanCap === 8 && D.managerNeeded === 3 && D.gap === 2 && D.coachMin === 0;
      return { pass, got: { spanCap: D.spanCap, need: D.managerNeeded, gap: D.gap, coach: D.coachMin }, want: { spanCap: 8, need: 3, gap: 2, coach: 0 } };

  SK.tests.push({

      return { pass, got: t.map(x => x.bonus / 100), want: [22700, 30000, 44100] };

    }),

  SK.tests.push({
    id: 'T-F19', name: '定价·探索保底月 9/11/13/14/14',
    fn: () => withCleanCoef(() => {

      const got = [fl('short'), fl('regular'), fl('midLong'), fl('long'), fl('ultraLong')];
      const want = [9, 11, 13, 14, 14];
      return { pass: got.join() === want.join(), got, want };
    }),
  });
})();

/* ===== 11-suanzhang.js ===== */
/* ============================================================
   算账器（suanzhang）· 经营真相层 —— 全系统数据地基
   引擎逐字复刻《销冠算账器 v3.3》（唯一事实源：公式/阈值/话术）。
   一体化差异：无锁屏/无免费版/无信封页——闸⑪三证据链实时取自
   X('liuren').ahc 与 DB.m28Agreements；提成率 r 实时取 SK.rRate()。
   口径：计毛利/回款的单 = deals.status==='won'（按 dealDate 归月）；
        挂账 = won 且 paidDate==null；本期 = 当月。
   ============================================================ */
(() => {
  'use strict';
  const { h } = UI, { fmt, esc, DASH, safeDiv } = SK;
  const gc = p => SK.getCoef(p);

  /* ================= 枚举（件二 SE 系） ================= */
  const SE01 = { instant_bonus: '即时奖金', year_end_bonus: '年终奖', dividend: '分红', reimburse: '报销(只进成本)', mentoring_share: '带教分成', recipe_royalty: '配方使用费', sprint_vested: '冲刺金兑现', discretionary: '红包·慰问·普发', other: '其他' };
  const SE02 = { competitive_pressure: '竞争对手压价', volume_deal: '大单走量', period_end_push: '期末冲刺', customer_relationship: '老客户关系', strategic_entry: '战略性开口', authorized_promo: '公司授权促销', other: '其他' };
  const SE04 = { immediate: '立即发放', weekend_delayed: '延迟至周末', scheduled: '计划内' };
  const SE07 = { rent: '房租', marketing: '市场', admin: '行政', other: '其他' };

  /* ================= 引擎 E（逐字复刻 v3.3 计算引擎；系数改经 SK.getCoef） ================= */
  const E = {};
  E.round = x => Math.round(x);
  E.commission = (paymentAmt, g, r) => { if (paymentAmt == null || g == null || r == null) return null; return E.round(paymentAmt * g * r); };
  E.BONUS_TYPES = ['instant_bonus', 'year_end_bonus', 'dividend', 'mentoring_share', 'recipe_royalty', 'sprint_vested', 'discretionary'];
  E.totalIncome = ctx => {                                  // reimburse 永不进收入（闸③宪法级）
    let b = ctx.baseSalaryAmt || 0, c = ctx.commissionAmt || 0, bo = 0;

  E.amortizeForScissors = (type, amount, pm) => { if (amount == null) return null; if (type === 'year_end_bonus') return amount / 12; if (type === 'dividend') return pm ? amount / pm : amount; return amount; };
  E.uerObsGate = n => (n || 0) >= gc('suanzhang.uerMinObs');
  E.dvi = x => {

  E.dviBand = v => { if (v == null) return null; return v > 70 ? 'green' : (v >= 40 ? 'amber' : 'red'); };
  E.hijackVerdict = ev => {                                  // 闸⑪ 三证据链

  /* ================= 派生层（统一 DB → 各屏数字唯一来源） ================= */
  const mShift = (m, k) => { const [y, mm] = m.split('-').map(Number); return new Date(Date.UTC(y, mm - 1 + k, 1)).toISOString().slice(0, 7); };

  function buildIdx(db, r) {                                 // 一次扫描 → 人×月聚合
    const gm = {}, pay = {}, cnt = {}, comm = {}, la = {}, self = {}, po = {}, months = {};
    const bump = (o, sp, m, v) => { (o[sp] || (o[sp] = {}))[m] = (o[sp][m] || 0) + v; };
    db.deals.forEach(d => {
      if (d.status !== 'won' || !d.dealDate) return;         // 口径：只有 won 计毛利，按 dealDate 归月
      const m = SK.monthOf(d.dealDate); months[m] = 1;

  function personLabor(c, p, m) {
    return E.laborCost({ baseSalaryAmt: p.baseSalaryAmt, commissionAmt: G(c.idx.comm, p.spId, m), payouts: (c.idx.po[p.spId] && c.idx.po[p.spId][m]) || [] });
  }
  function m21Month(c, m) {
    const rows = c.db.people.filter(p => p.positionType === 'sales').map(p => ({
      id: p.spId, name: p.name, leads: G(c.idx.la, p.spId, m), selfDevLeads: G(c.idx.self, p.spId, m), grossMarginAmt: G(c.idx.gm, p.spId, m),

  }

  /* UER 团队 OLS 面板：X=[1, leads, conv, aov/1e6, marginRate]，y=personNet */
  function uerAll(c) {
    const sales = c.db.people.filter(p => p.positionType === 'sales');
    const X = [], y = [], keys = [];
    c.idx.monthList.forEach(m => {
      sales.forEach(p => {

  /* M34 时点套利（近 12 月；末段 = 当月最后 1/3） */
  function m34Calc(c) {
    const from = mShift(c.curM, -11) + '-01';
    let tailList = 0, tailDisc = 0, headList = 0, headDisc = 0, tailPay = 0;
    c.db.discounts.forEach(d => {
      if (d.discountDate < from) return;
      const tailStart = dim(SK.monthOf(d.discountDate)) * (1 - gc('suanzhang.m34TailShare'));
      const disc = d.listPriceAmt - d.actualPriceAmt;
      if (dayOfMonth(d.discountDate) > tailStart) { tailList += d.listPriceAmt; tailDisc += disc; }
      else { headList += d.listPriceAmt; headDisc += disc; }
    });
    c.db.deals.forEach(d => {
      if (d.status !== 'won' || !d.dealDate || d.dealDate < from) return;

  /* 红包体检（本期 discretionary）：dailyAvg ≈ 累计提成 ÷ max(1, 成交笔数×9) */
  function hongbaoRows(c) {

  /* ================= SK.summary.suanzhang —— 全系统数据地基 ================= */
  function compute(db, T) {
    const c = ctx(db, T);
    const sales = db.people.filter(p => p.positionType === 'sales');
    const actSales = sales.filter(p => p.isActive);
    const m12 = []; for (let k = 11; k >= 0; k--) m12.push(mShift(c.curM, -k));
    const m6 = m12.slice(6), last3 = m12.slice(9), prev3 = m12.slice(6, 9);

    const Mcur = m21Month(c, c.curM);
    const m21Done = !!Mcur.done && Mcur.n >= 2;

      spId: r.id, name: r.name, leads: r.leads, selfShare: safeDiv(r.selfDevLeads, r.leads),
      index: r.index, over: r.over, under: r.under, grossMarginAmt: r.grossMarginAmt,
      unitLeadMargin: r.unitLeadMargin, normMargin: r.normMargin, origRank: r.origRank, normRank: r.normRank,

    const L = ledgerFor(c, c.curM);

    const uer = uerAll(c);
    const uerBySp = {}; if (uer.ok) uer.rows.forEach(r => { uerBySp[r.sp] = { resid: r.resid, band: r.band }; });

    const g5 = gate5(c, c.curM);

    // realP90Factor：本期归一化毛利分布（样本 <8 → null）
    const realP90 = E.realP90Factor((Mcur.rows || []).map(r => r.normMargin).filter(x => x != null).map(x => x / 1e4));

    // DVI（按原版公式，用现有数据近似；录入滞后分项无 entryDate 概念 → 记满 25）
    let dvi = null;
    {
      let dealCur = 0; Object.keys(c.idx.cnt).forEach(sp => { dealCur += G(c.idx.cnt, sp, c.curM); });
      if (dealCur >= gc('suanzhang.dviMinDeals') && actSales.length) {
        let wd = 0; const wdSet = {};
        for (let d = 29; d >= 0; d--) { const ds = SK.addDays(T, -d); if (SK.weekdayOf(ds) === 0) continue; wd++; wdSet[ds] = 1; }
        const salesSet = {}; actSales.forEach(p => { salesSet[p.spId] = 1; });
        let rep = 0; db.dailyReports.forEach(r => { if (wdSet[r.date] && salesSet[r.employeeId]) rep++; });
        const reportRate = SK.clamp(rep / Math.max(1, wd * actSales.length), 0, 1);
        const leadAttribRate = actSales.filter(p => G(c.idx.la, p.spId, c.curM) > 0).length / actSales.length;
        const discMonths = {}; db.discounts.forEach(d => { discMonths[SK.monthOf(d.discountDate)] = 1; });
        const dealMonths = m12.filter(m => Object.keys(c.idx.cnt).some(sp => G(c.idx.cnt, sp, m) > 0));
        const discountRecordRate = dealMonths.length ? dealMonths.filter(m => discMonths[m]).length / dealMonths.length : 0;
        dvi = Math.round(SK.clamp(E.dvi({ reportRate, medianEntryLagDays: 0, leadAttribRate, discountRecordRate, dealCount: dealCur }), 0, 100));
      }
    }

    // 逐月归一名次（近 ≤6 月）
    const rankByMonth = m6.map(m => {
      const M = m21Month(c, m); const map = {};
      (M.rows || []).forEach(r => { map[r.id] = r.normRank; });
      return map;
    });

    // 单遍：近6月已回款 / 近12月特殊发放
    const m6Set = {}; m6.forEach(m => { m6Set[m] = 1; });
    const m12Set = {}; m12.forEach(m => { m12Set[m] = 1; });
    const collected6 = {}, special12 = {};
    db.deals.forEach(d => {
      if (d.status !== 'won' || !d.dealDate || !d.paidDate) return;
      if (m6Set[SK.monthOf(d.dealDate)]) collected6[d.employeeId] = (collected6[d.employeeId] || 0) + d.paymentAmt;
    });
    db.payouts.forEach(p => {
      if (['instant_bonus', 'discretionary', 'sprint_vested'].indexOf(p.type) < 0) return;
      if (m12Set[SK.monthOf(p.payoutDate)]) special12[p.employeeId] = (special12[p.employeeId] || 0) + 1;
    });

    const dj = SK.X('dingjia');
    const perPerson = {};
    actSales.forEach(p => {
      const sp = p.spId;
      const gmOf = m => G(c.idx.gm, sp, m), commOf = m => G(c.idx.comm, sp, m), cntOf = m => G(c.idx.cnt, sp, m);
      const sum = (arr, f) => arr.reduce((a, m) => a + f(m), 0);
      const cg = growth(sum(last3, gmOf), sum(prev3, gmOf));
      const ig = growth(sum(last3, m => p.baseSalaryAmt + commOf(m)), sum(prev3, m => p.baseSalaryAmt + commOf(m)));
      const avgInc6 = (6 * p.baseSalaryAmt + sum(m6, commOf)) / 6;
      const marketGap = (dj && dj.matrixT != null && dj.matrixT > 0) ? (dj.matrixT - avgInc6) / dj.matrixT : null;
      const hireM = SK.monthOf(p.hireDate);
      let trajEarly = null;
      if (mShift(hireM, 5) <= c.curM) { trajEarly = []; for (let k = 0; k < 6; k++) trajEarly.push(gmOf(mShift(hireM, k)) / 1e6); }
      perPerson[sp] = {
        normRankMonths: rankByMonth.map(map => (map[sp] != null ? map[sp] : null)),
        scissors: E.scissors(cg, ig),
        marketGap,
        leadIndex: idxBySp[sp] ? idxBySp[sp].index : null,
        collected6m: collected6[sp] || 0,
        specialPayout12m: special12[sp] || 0,
        contribGrowth: cg,
        margin12: m12.map(m => (cntOf(m) > 0 ? gmOf(m) : null)),
        traj6: m6.map(m => gmOf(m) / 1e6),
        trajEarly,
        uerSeries: (uer.ok && uer.series[sp]) ? uer.series[sp] : [],
        discountRate: personLeak(c, sp, c.curM),
        complaintCount: null,                                 // 无客诉数据源，消费方需判空
        growth3m: cg,
      };
    });

    return {
      m21Done,
      imbalanceRate: Mcur.imbalanceRate != null ? Mcur.imbalanceRate : null,
      uerTeamMean: uer.ok ? uer.teamMean : null,
      realP90Factor: realP90,
      dvi,
      netContributionAmt: hasLedger ? L.net : null,
      laborRoi,
      ledger: hasLedger ? { net: L.net, rate: safeDiv(L.net, L.grossMarginAmt) } : null,
      m21rows,
      uerBySp,
      teamDiscountLeakRate: g5.leakRate,
      perPerson,
    };
  }

  function gate11Body(c, teamMean) {
    const lr = SK.X('liuren');
    const e1 = (lr && lr.ahc != null) ? lr.ahc : null;                                     // 实时取证①：留人器 AHC
    const Mn = m21Month(c, c.curM).n || 0;
    const masters = {}; c.db.m28Agreements.forEach(a => { masters[a.masterId] = 1; });     // 实时取证②：M28 覆盖率

  function vProduct() {
    const c = C(); const mo = c.curM;

    const winRate = (won + lost) > 0 && lost > 0 ? safeDiv(won, won + lost) : null;
    const fd = gc('suanzhang.forcedDiscount');
    const forced = g5.leakRate != null && g5.leakRate > fd.rate && g5.pushShare != null && g5.pushShare > fd.share;
    // 退款品类集中度：品类退款占比 ÷ 品类回款占比 的最大值
    let refundX = null;
    {
      const refM = c.db.refunds.filter(x => SK.monthOf(x.refundDate) === mo);
      const totalRef = refM.reduce((a, x) => a + x.amount, 0);
      let totalPay = 0; const payByCat = {};
      c.db.deals.forEach(d => { if (d.status !== 'won' || !d.dealDate || SK.monthOf(d.dealDate) !== mo) return; totalPay += d.paymentAmt; payByCat[d.categoryId] = (payByCat[d.categoryId] || 0) + d.paymentAmt; });
      if (totalRef > 0 && totalPay > 0) {
        const refByCat = {}; refM.forEach(x => { refByCat[x.categoryId] = (refByCat[x.categoryId] || 0) + x.amount; });
        Object.keys(refByCat).forEach(cid => {
          const xv = safeDiv(refByCat[cid] / totalRef, (payByCat[cid] || 0) / totalPay);
          if (xv != null && (refundX == null || xv > refundX)) refundX = xv;

  }
