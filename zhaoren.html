<!doctype html>
<html lang="zh-CN">
<head>

<title>销冠招人器 · 该招几人 / 何时招 / 怎么面不招错</title>

<style>
/* ============================================================================
   设计系统 · 双极简
   系统极简：单文件 / 零依赖 / 零网络 / localStorage / 双击即用
   用户极简：一屏一结论 / 渐进披露 / null→"—" 从不假装知道 / 每个数经得起较真
   外形借鉴：Linear 的克制与一屏一事、Stripe 的金融级数字排版、Apple/Geist 的类型阶梯
   ==========================================================================*/
:root{
  --bg:#f7f6f3; --surface:#ffffff; --surface-2:#fbfaf8; --sunken:#f2f0ec;
  --ink:#17181c; --ink-2:#4a4d55; --ink-3:#8a8d96; --line:#e7e4de; --line-2:#efece7;
  --accent:#4436c9; --accent-soft:#eeecfb; --accent-ink:#4436c9;
  --red:#c8342c; --red-soft:#fbeceb; --amber:#b7791f; --amber-soft:#fdf3e2;
  --green:#0f8a4d; --green-soft:#e8f5ee; --gold:#a5760a; --gold-soft:#fbf3df;
  --r-lg:16px; --r-md:11px; --r-sm:7px;
  --shadow:0 1px 2px rgba(20,20,30,.04), 0 8px 28px -18px rgba(20,20,30,.22);
  --mono:"SF Mono",ui-monospace,"JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e0f13; --surface:#17181d; --surface-2:#1b1c22; --sunken:#101116;
  --ink:#eceef2; --ink-2:#a7abb5; --ink-3:#6d717c; --line:#282a31; --line-2:#22242a;
  --accent:#9a8dff; --accent-soft:#211f38; --accent-ink:#b3a8ff;
  --red:#f0736a; --red-soft:#2a1917; --amber:#e0a54a; --amber-soft:#271e12;
  --green:#4bc487; --green-soft:#12241a; --gold:#d6a94a; --gold-soft:#241d10;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -18px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0e0f13; --surface:#17181d; --surface-2:#1b1c22; --sunken:#101116;
  --ink:#eceef2; --ink-2:#a7abb5; --ink-3:#6d717c; --line:#282a31; --line-2:#22242a;
  --accent:#9a8dff; --accent-soft:#211f38; --accent-ink:#b3a8ff;
  --red:#f0736a; --red-soft:#2a1917; --amber:#e0a54a; --amber-soft:#271e12;
  --green:#4bc487; --green-soft:#12241a; --gold:#d6a94a; --gold-soft:#241d10;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -18px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#f7f6f3; --surface:#ffffff; --surface-2:#fbfaf8; --sunken:#f2f0ec;
  --ink:#17181c; --ink-2:#4a4d55; --ink-3:#8a8d96; --line:#e7e4de; --line-2:#efece7;
  --accent:#4436c9; --accent-soft:#eeecfb; --accent-ink:#4436c9;
  --red:#c8342c; --red-soft:#fbeceb; --amber:#b7791f; --amber-soft:#fdf3e2;
  --green:#0f8a4d; --green-soft:#e8f5ee; --gold:#a5760a; --gold-soft:#fbf3df;
  --shadow:0 1px 2px rgba(20,20,30,.04), 0 8px 28px -18px rgba(20,20,30,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;
  font-size:15px;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--accent-ink);text-decoration:none}

/* ---------- 外壳 ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,var(--accent),#7b6ef0);
  display:grid;place-items:center;color:#fff;font-size:17px;box-shadow:0 3px 10px -3px var(--accent)}
.brand b{font-size:15px;font-weight:650;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-3);font-size:11px;font-weight:450;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  color:var(--ink-2);font-size:13.5px;font-weight:500;transition:.12s;position:relative}
.nav a .ix{width:19px;text-align:center;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav a.on .ix{color:var(--accent-ink)}
.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:9px}
.sig{font-size:11.5px;color:var(--ink-3);line-height:1.45}
.sig b{color:var(--ink-2);font-weight:600}
.toolrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chipbtn{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2)}
.chipbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.chipbtn.act{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- 主区 ---------- */
.main{padding:0 0 80px}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line-2);padding:11px 34px;
  display:flex;align-items:center;gap:12px;min-height:52px}
.topbar h1{font-size:15px;font-weight:640}
.topbar .crumb{color:var(--ink-3);font-size:12.5px}
.grow{flex:1}
.wrap{max-width:940px;margin:0 auto;padding:28px 34px}
.banner{margin:0 34px;margin-top:14px;padding:11px 16px;border-radius:var(--r-md);font-size:13px;
  display:flex;gap:10px;align-items:center;border:1px solid}
.banner.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,transparent);color:var(--amber)}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-ink)}
.banner b{font-weight:650}
.banner .x{margin-left:auto;opacity:.6;font-size:16px}

/* ---------- 卡片/排版 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:22px 24px;margin-bottom:18px}
.card.flush{padding:0;overflow:hidden}
.sect-h{font-size:12px;font-weight:680;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.eyebrow{font-size:12px;font-weight:640;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
h2.big{font-size:27px;font-weight:680;letter-spacing:-.02em;margin:6px 0}
.lede{color:var(--ink-2);font-size:15px;max-width:60ch}
.muted{color:var(--ink-3)}
.hair{height:1px;background:var(--line-2);margin:16px 0;border:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent;line-height:1.3}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--green-soft);color:var(--green)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.grey{background:var(--sunken);color:var(--ink-3)} .pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.red{background:var(--red)} .dot.amber{background:var(--amber)} .dot.green{background:var(--green)} .dot.grey{background:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink);transition:.12s}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 14px -6px var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}

/* inputs */
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--ink-3);font-weight:450;margin-top:4px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface-2);transition:.12s;font-variant-numeric:tabular-nums}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);background:var(--surface);
  box-shadow:0 0 0 3px var(--accent-soft)}
.field .suffix{position:relative}
.field .suffix .u{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:12px;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.splitcols{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.splitcols{grid-template-columns:1fr}}

/* stat / hero */
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px}
.stat .k{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.03em}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .s{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:4px 0 8px}
.vs-cell{text-align:center;padding:18px 10px;border-radius:var(--r-md)}
.vs-cell.bad{background:var(--sunken)} .vs-cell.good{background:var(--accent-soft)}
.vs-cell .lab{font-size:12px;font-weight:600;color:var(--ink-3)}
.vs-cell .big{font-size:52px;font-weight:750;letter-spacing:-.03em;line-height:1;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.vs-cell.good .big{color:var(--accent-ink)}
.vs-cell .sub{font-size:12px;color:var(--ink-3)}
.vs-mid{color:var(--ink-3);font-size:13px;font-weight:600}

/* gate list */
.gate{border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:9px;overflow:hidden;background:var(--surface)}
.gate summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;user-select:none}
.gate summary::-webkit-details-marker{display:none}
.gate summary:hover{background:var(--surface-2)}
.gate .gname{font-weight:600;font-size:14px} .gate .gjudge{color:var(--ink-3);font-size:12.5px}
.gate .chev{margin-left:auto;color:var(--ink-3);transition:.2s}
.gate[open] .chev{transform:rotate(90deg)}
.gate .body{padding:2px 16px 16px 40px;border-top:1px solid var(--line-2);font-size:13.5px;color:var(--ink-2)}
.gate .body .seg{margin-top:12px}
.gate .body .seg b{color:var(--ink);font-weight:600;display:block;font-size:12px;letter-spacing:.02em;margin-bottom:3px}
.src{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;color:var(--ink-3);
  background:var(--sunken);padding:2px 8px;border-radius:6px;margin:2px 4px 2px 0}
.action-card{margin-top:14px;padding:12px 14px;background:var(--accent-soft);border-radius:var(--r-sm);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.action-card .txt{font-size:13px;color:var(--accent-ink);font-weight:550;flex:1;min-width:180px}

/* table */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2)}
th{font-size:11.5px;font-weight:650;color:var(--ink-3);letter-spacing:.03em;background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}

/* asOf source line (A-21/A-22) */
.asof{font-size:11px;color:var(--ink-3);margin-top:3px}

/* pools */
.pools{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pool{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;min-height:120px}
.pool h4{font-size:12px;color:var(--ink-3);font-weight:650;display:flex;justify-content:space-between}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px;font-size:12.5px;margin-top:7px}

/* weight editor */
.wrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.wrow .wl{width:96px;font-size:13px;font-weight:550}
.wrow input[type=range]{flex:1;accent-color:var(--accent)}
.wrow .wv{width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.wsum{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:600}

/* badges (self check) */
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.badge{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-size:12.5px}
.badge.ok{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 26%,transparent)}
.badge.no{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.badge .m{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}


.boundary{text-align:center;color:var(--ink-3);font-size:13px;padding:26px 0 8px;font-style:italic}
.kbd{font-family:var(--mono);font-size:11px;background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:1px 5px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:550;box-shadow:var(--shadow);z-index:100;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;bottom:30px}

@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.grid2,.grid3,.pools{grid-template-columns:1fr}.versus{grid-template-columns:1fr}.badges{grid-template-columns:1fr}}
@media print{.side,.topbar,.banner,.no-print{display:none!important}.app{display:block}.wrap{max-width:none}.card{box-shadow:none;break-inside:avoid}
  body{background:#fff}.print-foot{display:block!important}}
.print-foot{display:none;text-align:center;font-size:11px;color:#888;margin-top:20px}
</style>
</head>

  });
  // 黑暗三角滑杆
  $('#view').querySelectorAll('[data-dt]').forEach(el=>{
    el.addEventListener('input',()=>{ S.dt[el.dataset.dt]=parseInt(el.value)||0; save('dt'); render(); });
  });
  // 系数覆盖
  $('#view').querySelectorAll('[data-coef]').forEach(el=>{
    el.addEventListener('change',()=>{ const ov=Store.get('coefOverride',{}); const v=el.value.trim();
      if(v==='') delete ov[el.dataset.coef]; else ov[el.dataset.coef]=parseFloat(v);
      Store.set('coefOverride',ov); toast('系数已覆盖（仅数值权）'); });
  });
  // 授权署名
  const ten=$('#view').querySelector('[data-act="tenant"]');
  if(ten) ten.addEventListener('change',()=>{ Store.set('tenant',ten.value); $('#tenant').textContent=ten.value; toast('署名已更新'); });
  // 通用动作
  $('#view').querySelectorAll('[data-act]').forEach(el=>{
    const act=el.dataset.act;
    if(['tenant'].includes(act)) return;
    if(act==='importEnv'){ el.addEventListener('change',importEnv); return; }
    el.addEventListener('click',(e)=>handleAct(act,e));
  });
  $('#banners').querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>handleAct(el.dataset.act)));
  // 侧栏
  $('#clockBtn').onclick=()=>{ S.demoClock=!S.demoClock; save('demoClock'); syncTools(); render(); };
  $('#themeBtn').onclick=cycleTheme;
}
function handleAct(act,e){
  switch(act){
    case 'loadSample': S.inputs={...DEF_INPUTS}; save('inputs');
      if(S.route==='input'){ render(); toast('已填入示例，右侧结果已更新'); } else { toast('已载入示例'); location.hash='#result'; }
      break;
    case 'commitInputs': save('inputs'); break;
    case 'resetInputs': S.inputs={...DEF_INPUTS}; save('inputs'); render(); toast('已恢复默认'); break;
    case 'resetWeights': S.weights={...E.DEFAULT_COEF.hiringWeightsFactory}; save('weights'); render(); break;
    case 'resetCoef': Store.set('coefOverride',{}); toast('已清空覆盖'); break;
    case 'dismissBanner': S.bannerDismissed=true; banners(); break;
    case 'adopt': toast('已采纳 · 建议记入 ActionCard（系统永不自动执行）'); break;
    case 'ignore': toast('已忽略'); break;
    case 'later': toast('已稍后'); break;
    case 'exportEnv': exportEnv(); break;
    case 'saveScenario': Store.set('scenario',{inputs:S.inputs,weights:S.weights,savedAt:today()}); toast('场景已保存'); break;
  }
}
function exportEnv(){
  const entities={ Candidate:S.candidates, Employee:S.employees, HiringCriteria:[{weights:S.weights}] };
  const r=E.capacityChain(currentInputs(),ctx());
  const derived={ trueHires:r.trueHires, overRate:r.overRate };
  const env=E.buildEnvelope(entities,derived,{today:today()});
  const blob=new Blob([JSON.stringify(env,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='skab_zhaoren_'+today()+'.json'; a.click();
  Store.set('lastExport',today()); toast('已导出信封 JSON · 备份成功'); banners();
}
function importEnv(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const env=JSON.parse(rd.result); const imp=E.importEnvelope(env);
    if(!imp.ok){ toast('非 skab_v1 信封，已忽略'); return; }
    S.extRef[imp.board]={exportedAt:imp.ref.exportedAt,dataVersion:imp.ref.dataVersion,derived:imp.ref.derived,importedAt:today()};
    save('extRef'); toast('已导入 '+imp.board+' 信封（只读缓存 · 整条覆盖）'); render();
  }catch(err){ toast('JSON 解析失败'); } };
  rd.readAsText(f);
}
function cycleTheme(){ const o=['auto','light','dark']; S.theme=o[(o.indexOf(S.theme)+1)%3]; save('theme'); applyTheme(); toast('主题：'+S.theme); }
function applyTheme(){ if(S.theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',S.theme); }
function syncTools(){ $('#clockBtn').textContent=S.demoClock?'演示钟':'真实钟'; $('#clockBtn').classList.toggle('act',S.demoClock); }

/* ============================================================================
   启动
   ==========================================================================*/
(function boot(){
  applyTheme();
  $('#tenant').textContent=Store.get('tenant','王总（示例）');
  syncTools();
  const q=Store.quotaProbe();
  if(!q.writeOk) setTimeout(()=>toast('⚠ localStorage 写入异常，请立即导出备份'),600);
  render();
})();
</script>
</body>
</html>
