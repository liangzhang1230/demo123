    --acc-rgb:55,199,255;
    --acc-2:#9FE4FF;          /* 浅色调（徽章文字/图表标签）*/
    --acc-deep:#1385CC;       /* 深色调（竖脊/CTA渐变下端）*/
    --ink-0:#0A1420;          /* 底色 深 */
    --ink-1:#0D1E2E;          /* 底色 渐变上端 */
    --rev:#FF8A5C;            /* 唯一的"扎心/反转"点睛色 */
    --rev-rgb:255,138,92;

    /* —— 固定不变 —— */
    --surface:rgba(255,255,255,.035);
    --hairline-soft:rgba(255,255,255,.07);
    --cream:#F2F7F4;
    --dim:#93AAA2;
    --dim-2:#6E857D;
    --gold:#F4C664;
  }
  .hairline{}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#05100c;}
  body{
    font-family:"Noto Sans CJK SC","Noto Sans CJK SC Regular",sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    display:flex;flex-direction:column;align-items:center;gap:48px;padding:48px;
  }

  .card{
    position:relative;width:1080px;height:1440px;
    background:
      radial-gradient(120% 80% at 82% -8%, rgba(var(--acc-rgb),.14), rgba(var(--acc-rgb),0) 46%),

    display:flex;flex-direction:column;isolation:isolate;
  }
  .card > *{flex-shrink:0;}   /* 禁止子元素被压缩，溢出即暴露，便于精确校对 */
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;
    background:linear-gradient(180deg,var(--acc) 0%, var(--acc-deep) 100%);
    box-shadow:0 0 26px rgba(var(--acc-rgb),.5);}
  .card::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(120% 100% at 50% 0%, #000 30%, transparent 92%);}

  .brand-name{font-size:27px;font-weight:700;letter-spacing:2px;color:var(--cream);}
  .brand-name b{color:var(--acc);}
  .file-no{font-size:23px;color:var(--dim);letter-spacing:1px;margin-top:3px;
    font-variant-numeric:tabular-nums;}
  .badge{display:flex;align-items:center;gap:10px;
    border:1.5px solid rgba(var(--acc-rgb),.28);background:rgba(var(--acc-rgb),.06);

  .sep{color:var(--dim-2);font-size:22px;}

  .hl-mint{color:var(--acc);}

  .hl-under::after{content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:12px;

    font-size:34px;line-height:1.44;color:#D8E6E0;font-weight:500;}
  .hook .mark{position:absolute;left:-6px;top:-30px;font-size:96px;line-height:1;

  .ruler i{flex:1;border-left:2px solid rgba(var(--acc-rgb),.16);height:10px;}
  .ruler i:nth-child(5n+1){height:20px;border-color:rgba(var(--acc-rgb),.5);}

  .block{margin-top:9px;}
  .block-label{display:flex;align-items:center;gap:16px;margin-bottom:6px;}
  .block-num{font-size:40px;font-weight:900;color:var(--acc);

  .u-line{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;}

  .bar-fill.dim{background:rgba(255,255,255,.16);}
  .bar-val{width:130px;font-size:25px;font-weight:800;color:var(--acc-2);white-space:nowrap;}
  .bar-val.lose{color:var(--rev);}
  .bar-val.dim{color:var(--dim);}
</style>

function barsChart(items){
  return `<div class="bars">${items.map(b=>`
    <div class="bar-row">
      <span class="bar-lab">${b.lab}</span>
      <span class="bar-track"><span class="bar-fill ${b.kind||''}" style="width:${b.w}%"></span></span>
      <span class="bar-val ${b.kind==='lose'?'lose':(b.kind==='dim'?'dim':'')}">${b.val}</span>
    </div>`).join("")}</div>`;
}

function render(c){
  const verdict = c.verdict.map(v=>`<span class="${v.cls||''}">${v.t}</span>`).join("");

        <div class="num">${s.num}</div><div class="tagn">${s.tagn}</div></div>`).join("")}</div>` : "";
  const chart = c.chart==="u" ? uChart() : c.chart==="decline" ? declineChart() : c.chart==="bars" ? barsChart(c.bars) : "";
  return `
  <div class="card">
    <div class="top">
      <div class="brand-mark">
        <div class="brand-dot">底</div>
        <div>
          <div class="brand-name">销冠<b>底牌</b> · 反常识实证库</div>

    <div class="ruler">${Array.from({length:36}).map(()=>"<i></i>").join("")}</div>
    <div class="block">
      <div class="block-label"><span class="block-num">01</span><span class="block-title">${c.b1title}</span><span class="block-line"></span></div>
      ${stats}${chart}

    </div>
    <div class="block">
      <div class="block-label"><span class="block-num">02</span><span class="block-title">${c.b2title}</span><span class="block-line"></span></div>
      <div class="body">${c.b2body}</div>
    </div>
    <div class="cite">
      <span class="book">📚</span><span class="src">${c.citeSrc}</span>
      <span class="sep">·</span><span>${c.citeJour}</span>
      <span class="sep">·</span><span class="grade ${c.gradeLevel}"><i class="gdot"></i>${c.gradeText}</span>

      <div class="note">每条都查得到论文 · 关注不迷路 →</div>
    </div>
  </div>`;
}
